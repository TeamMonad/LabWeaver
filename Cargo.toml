[workspace]
resolver = "2"
members = [
  "crates/agent-core",
  "crates/contracts",
  "crates/persistence-sqlx",
  "crates/telemetry",
  "xtask",
  "services/access-service",
  "services/agent-service",
  "services/control-service",
  "services/environment-service",
  "services/evaluation-service",
  "services/resource-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TeamMonad/LabWeaver"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.88"
axum = "0.8.4"
http = "1.3.1"
jsonschema = { version = "0.33.0", default-features = false }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "json", "uuid", "time"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["std"] }
thiserror = "2.0.12"
time = { version = "=0.3.41", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.45.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "=5.5.0", features = ["time", "uuid"] }
uuid = { version = "1.16.0", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
