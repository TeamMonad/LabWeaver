[workspace]
resolver = "2"
members = [
  "access-gateway",
  "crates/agent-core",
  "crates/artifact-store",
  "crates/auth",
  "crates/contracts",
  "crates/persistence-sqlx",
  "crates/telemetry",
  "xtask",
  "services/access-service",
  "services/agent-service",
  "services/control-service",
  "services/environment-service",
  "services/evaluation-service",
  "services/resource-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TeamMonad/LabWeaver"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.88"
async-nats = { version = "=0.45.0", default-features = false, features = ["ring", "server_2_10", "server_2_11"] }
aws-config = { version = "=1.5.16", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-credential-types = "=1.2.1"
aws-sdk-s3 = { version = "=1.70.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
axum = "0.8.4"
base64 = "0.22.1"
bollard = "=0.19.1"
futures-util = "0.3.31"
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
chacha20poly1305 = "0.10.1"
http = "1.3.1"
hyper = { version = "1.10.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio", "service"] }
jsonwebtoken = "9.3.1"
jwt-authorizer = { version = "0.15.0", default-features = false, features = ["rustls-tls", "time"] }
jsonschema = { version = "0.33.0", default-features = false }
landlock = "0.4.7"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"] }
nix = { version = "0.31.3", default-features = false, features = ["process", "resource", "signal"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest"] }
rand = "0.9.1"
reqwest = { version = "0.12.28", default-features = false, features = ["cookies", "json", "rustls-tls", "stream"] }
russh = { version = "0.62.2", default-features = false, features = ["ring"] }
russh-sftp = "2.3.0"
scraper = "0.24.0"
rcgen = "=0.14.7"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
schemars = "1.0.4"
seccompiler = "0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "time"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["std"] }
subtle = "2.6.1"
thiserror = "2.0.12"
tempfile = "3.27.0"
time = { version = "=0.3.41", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.45.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "=5.5.0", features = ["time", "uuid"] }
uuid = { version = "1.16.0", features = ["serde", "v4", "v7"] }
url = { version = "2.5.4", features = ["serde"] }
x509-parser = "0.16.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[patch.crates-io]
# Upstream 0.15.0 discards the configured HTTP client during JWKS refresh.
# This audited patch preserves the mature crate and makes unknown-kid refresh
# reuse the same deployment-controlled trust store used for Discovery.
jwt-authorizer = { path = "vendor/jwt-authorizer" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
