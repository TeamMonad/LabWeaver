# Disposable single node Kind profile for tools/local_dev.py.
# The command replaces the image locators with registry digests after building.
localValidation:
  mode: kind
  releaseEligible: false
  singleNode: true
  storageClassName: standard
  accessMode: ReadWriteOnce

workloads:
  # The checked-in values are the fixture/base overlay. local_dev.py up
  # enables this workload after it provisions the run-owned Harbor and
  # BuildKit services; external-fixtures keeps it disabled and supplies its
  # separate bounded build fixture.
  build-executor:
    enabled: false
  kubevirt-executor:
    enabled: false
  kubevirt-console-executor:
    enabled: false

# All in-cluster service JWT clients use the local Keycloak realm and its
# private CA material generated by local_dev.py.
  control-service:
    env:
      LABWEAVER_SERVICE_OIDC_ISSUER: https://keycloak.keycloak-system.svc:8443/realms/workloads
  access-service:
    env:
      LABWEAVER_SERVICE_OIDC_ISSUER: https://keycloak.keycloak-system.svc:8443/realms/workloads
  agent-service:
    env:
      LABWEAVER_SERVICE_OIDC_ISSUER: https://keycloak.keycloak-system.svc:8443/realms/workloads
  environment-service:
    env:
      LABWEAVER_SERVICE_OIDC_ISSUER: https://keycloak.keycloak-system.svc:8443/realms/workloads
  evaluation-service:
    env:
      LABWEAVER_SERVICE_OIDC_ISSUER: https://keycloak.keycloak-system.svc:8443/realms/workloads
  resource-service:
    enabled: true
    env:
      LABWEAVER_SERVICE_OIDC_ISSUER: https://keycloak.keycloak-system.svc:8443/realms/workloads
  openssh-gateway:
    env:
      LABWEAVER_SERVICE_OIDC_ISSUER: https://keycloak.keycloak-system.svc:8443/realms/workloads

network:
  defaultDenyEnabled: true
  kubernetesApiCidrs: [10.96.0.1/32]
  cdiCloneSourcePolicyEnabled: false
  ciliumIngressPolicyEnabled: false
  resourceKubernetesApiCiliumPolicyEnabled: false
  externalServiceEndpoints: []

portalRoute:
  enabled: false

objectStoreRoute:
  enabled: false

sshGatewayService:
  enabled: false
