{{- $registry := required "trust.registry is required" .Values.trust.registry -}}
{{- $revision := required "trust.revision is required" .Values.trust.revision -}}
{{- $issuer := required "trust.issuer is required" .Values.trust.issuer -}}
{{- $subject := required "trust.subject is required" .Values.trust.subject -}}
{{- $roots := required "trust.fulcioRoots is required" .Values.trust.fulcioRoots -}}
{{- $rekor := required "trust.rekorUrl is required" .Values.trust.rekorUrl -}}
{{- $previousRevision := required "trust.previous.revision is required" .Values.trust.previous.revision -}}
{{- $previousIssuer := required "trust.previous.issuer is required" .Values.trust.previous.issuer -}}
{{- $previousSubject := required "trust.previous.subject is required" .Values.trust.previous.subject -}}
{{- $previousRoots := required "trust.previous.fulcioRoots is required" .Values.trust.previous.fulcioRoots -}}
{{- $previousRekor := required "trust.previous.rekorUrl is required" .Values.trust.previous.rekorUrl -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: labweaver-verified-platform-images
  labels:
    {{- include "labweaver.labels" . | nindent 4 }}
    labweaver.io/trust-revision: {{ $revision | quote }}
    labweaver.io/previous-trust-revision: {{ $previousRevision | quote }}
spec:
  admission: true
  background: true
  validationFailureAction: Enforce
  failurePolicy: Fail
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 10
  rules:
    - name: require-harbor-digests
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["labweaver-system"]
      validate:
        message: Platform images must use the approved Harbor project and an immutable digest.
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "{{ $registry }}/labweaver-system/*@sha256:*"
    - name: verify-private-sigstore-identity
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["labweaver-system"]
      verifyImages:
        - imageReferences:
            - "{{ $registry }}/labweaver-system/*"
          mutateDigest: false
          required: true
          verifyDigest: true
          useCache: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: {{ $subject | quote }}
                    issuer: {{ $issuer | quote }}
                    roots: |-
                      {{- $roots | nindent 22 }}
                    rekor:
                      url: {{ $rekor | quote }}
                - keyless:
                    subject: {{ $previousSubject | quote }}
                    issuer: {{ $previousIssuer | quote }}
                    roots: |-
                      {{- $previousRoots | nindent 22 }}
                    rekor:
                      url: {{ $previousRekor | quote }}
