{{- if .Values.objectStoreRoute.enabled }}
{{- $namespace := required "objectStoreRoute.namespace is required" .Values.objectStoreRoute.namespace }}
{{- $service := required "objectStoreRoute.serviceName is required" .Values.objectStoreRoute.serviceName }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-object-store-ca
  namespace: {{ $namespace }}
  labels:
    {{- include "labweaver.labels" . | nindent 4 }}
data:
  ca.crt: |
{{ required "objectStoreRoute.caCertificate is required" .Values.objectStoreRoute.caCertificate | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ .Release.Name }}-object-store
  namespace: {{ $namespace }}
  labels:
    {{- include "labweaver.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ $service }}
      sectionName: api
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ .Release.Name }}-object-store-ca
    hostname: {{ required "objectStoreRoute.backendHostname is required" .Values.objectStoreRoute.backendHostname | quote }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-object-store-ingress
  namespace: {{ $namespace }}
  labels:
    {{- include "labweaver.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $service }}
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - port: {{ required "objectStoreRoute.servicePort is required" .Values.objectStoreRoute.servicePort | quote }}
              protocol: TCP
{{- end }}
