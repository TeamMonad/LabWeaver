{{- $root := . -}}
{{- range $name, $configuration := .Values.workloads }}
{{- if $configuration.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "labweaver.labels" $root | nindent 4 }}
automountServiceAccountToken: {{ default false $configuration.kubernetesApi }}
{{- if $configuration.rbacProfile }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $root.Release.Namespace }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "labweaver.labels" $root | nindent 4 }}
rules:
  {{- if and (ne $configuration.rbacProfile "kubevirt-console") (ne $configuration.rbacProfile "work-execution") (ne $configuration.rbacProfile "authoring") }}
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces/finalize"]
    verbs: ["update"]
  {{- end }}
  {{- if eq $configuration.rbacProfile "container" }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "serviceaccounts", "persistentvolumeclaims", "services", "secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  {{- else if eq $configuration.rbacProfile "work-execution" }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  {{- else if eq $configuration.rbacProfile "kubevirt" }}
  - apiGroups: [""]
    resources: ["resourcequotas", "serviceaccounts", "persistentvolumeclaims", "services", "secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datasources"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines/start", "virtualmachines/stop", "virtualmachines/restart"]
    verbs: ["update"]
  {{- else if eq $configuration.rbacProfile "kubevirt-console" }}
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    resourceNames: ["runtime"]
    verbs: ["get"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/vnc"]
    resourceNames: ["runtime"]
    verbs: ["get"]
  {{- else if eq $configuration.rbacProfile "evaluation" }}
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # `list` is required by the orphan reconciler, which enumerates the namespace's Jobs to find
    # residue of terminal attempts; without it every reconcile pass fails with 403 and orphan
    # cleanup silently never happens (observed as LW_EVALUATION_ORPHAN_RECONCILE_FAILED with
    # error_kind=kubernetes).
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch", "delete"]
  {{- else if eq $configuration.rbacProfile "resource" }}
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  {{- else if eq $configuration.rbacProfile "authoring" }}
  # The authoring executor owns one-shot sandbox objects only in its fixed
  # namespace; those permissions are granted by the namespaced Role below.
  {{- else }}
  {{- fail (printf "workloads.%s.rbacProfile must be container, kubevirt, kubevirt-console, work-execution, evaluation, resource, or authoring" $name) }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $root.Release.Namespace }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "labweaver.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $root.Release.Namespace }}-{{ $name }}
{{- if eq $configuration.rbacProfile "authoring" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-authoring
  namespace: labweaver-authoring
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "labweaver.labels" $root | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "pods"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-authoring
  namespace: labweaver-authoring
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "labweaver.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-authoring
{{- end }}
{{- if eq $configuration.rbacProfile "kubevirt" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-datasource
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "labweaver.labels" $root | nindent 4 }}
rules:
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes/source"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-datasource
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "labweaver.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-datasource
{{- end }}
{{- end }}
{{- end }}
{{- end }}
