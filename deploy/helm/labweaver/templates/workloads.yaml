{{- $root := . -}}
{{- range $name, $configuration := .Values.workloads }}
{{- if $configuration.enabled }}
{{- $input := $configuration }}
{{- $managedControl := and (eq $name "control-service") $root.Values.managedControlConfiguration }}
{{- $environmentAuthority := and (has $name (list "container-executor" "kubevirt-executor")) $root.Values.environmentExecutorAuthority }}
{{- $platformPolicy := $root.Values.platformConfigurationPolicy -}}
{{- $runtimePolicy := dict -}}
{{- if and $platformPolicy (hasKey $platformPolicy "runtimePolicy") }}
{{- $runtimePolicy = index $platformPolicy "runtimePolicy" -}}
{{- end }}
{{- $managedSource := $root.Values.managedControlConfiguration -}}
{{- if and $platformPolicy (not $managedSource) }}
{{- fail "platformConfigurationPolicy requires authenticated managedControlConfiguration" }}
{{- end }}
{{- if $root.Values.workloadInputs }}
{{- if not (hasKey $root.Values.workloadInputs $name) }}
{{- fail (printf "workloadInputs.%s is required" $name) }}
{{- end }}
{{- $input = index $root.Values.workloadInputs $name }}
{{- if or (not (hasKey $input "env")) (not (hasKey $input "secretEnv")) }}
{{- fail (printf "workloadInputs.%s requires env and secretEnv" $name) }}
{{- end }}
{{- end }}
{{- if eq $name "agent-service" }}
{{- $env := deepCopy $input.env }}
{{- $secretEnv := default dict $input.secretEnv }}
{{- range $key, $value := (include "labweaver.agentControlConnection" $root | fromYaml) }}
{{- if or (hasKey $secretEnv $key) (and (hasKey $env $key) (ne (index $env $key) $value)) }}
{{- fail (printf "Agent Control connection owns %s" $key) }}
{{- end }}
{{- $_ := set $env $key $value }}
{{- end }}
{{- $input = dict "env" $env "secretEnv" $secretEnv }}
{{- end }}
{{- $imageKey := required (printf "workloads.%s.imageKey is required" $name) $configuration.imageKey }}
{{- $image := index $root.Values.images $imageKey }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "labweaver.labels" $root | nindent 4 }}
spec:
  replicas: {{ default 1 $configuration.replicas }}
  revisionHistoryLimit: 3
  {{- with $configuration.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "labweaver.labels" $root | nindent 8 }}
      annotations:
        labweaver.io/configuration-bundle-sha256: {{ include "labweaver.configurationBundleSha256" $root | quote }}
        {{- if $managedControl }}
        checksum/control-loaded-configuration: {{ include "labweaver.controlManagedChecksum" $root | quote }}
        {{- end }}
        {{- if $platformPolicy }}
        labweaver.io/platform-policy-sha256: {{ required "platformConfigurationPolicy.configurationSha256 is required" $platformPolicy.configurationSha256 | quote }}
        {{- end }}
      {{- if and (eq $name "web") $root.Values.objectStoreRoute.enabled }}
        checksum/object-store-proxy: {{ printf "%s\n%s\n%s\n%s" $root.Values.objectStoreRoute.caCertificate $root.Values.objectStoreRoute.backendHostname $root.Values.objectStoreRoute.pathPrefix $root.Values.objectStoreRoute.serviceName | sha256sum | quote }}
      {{- end }}
    spec:
      {{- if eq $name "kubevirt-executor" }}
      hostPID: false
      shareProcessNamespace: false
      {{- end }}
      {{- if and (eq $name "kubevirt-executor") $platformPolicy (index $runtimePolicy "privilegedAllowed") }}
      {{- $location := index $runtimePolicy "privilegedExecutionLocation" }}
      {{- if and $location (eq (index $location "kind") "dedicated_node_pool") }}
      nodeSelector:
        {{- toYaml (index $location "nodeSelector") | nindent 8 }}
      tolerations:
        - key: {{ required "platformConfigurationPolicy.runtimePolicy.privilegedExecutionLocation.taintKey is required" (index $location "taintKey") | quote }}
          operator: Equal
          value: {{ required "platformConfigurationPolicy.runtimePolicy.privilegedExecutionLocation.taintValue is required" (index $location "taintValue") | quote }}
          effect: NoSchedule
      {{- end }}
      {{- end }}
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: {{ default false $configuration.kubernetesApi }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $root.Values.hostAliases $configuration.hostAliases) }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ not (default false $configuration.gateway) }}
        runAsUser: {{ ternary 0 (default 65532 $configuration.runAsUser) (default false $configuration.gateway) }}
        runAsGroup: {{ ternary 0 (default 65532 $configuration.runAsUser) (default false $configuration.gateway) }}
        fsGroup: {{ ternary 0 (default 65532 $configuration.runAsUser) (default false $configuration.gateway) }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      {{- if $managedControl }}
      initContainers:
        - name: prepare-managed-configuration
          image: {{ include "labweaver.image" (dict "key" $imageKey "value" $image) | quote }}
          imagePullPolicy: IfNotPresent
          args: ["--prepare-managed-configuration"]
          env:
            - {name: LABWEAVER_PLATFORM_CONFIGURATION_PROJECTED_DIR, value: /etc/labweaver/managed-input}
            - {name: LABWEAVER_PLATFORM_CONFIGURATION_RUNTIME_DIR, value: /run/labweaver/managed-configuration}
            - {name: LABWEAVER_PLATFORM_CONFIGURATION_PROJECTED_SHA256, value: {{ include "labweaver.controlManagedChecksum" $root | quote }}}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 4Mi}
            limits: {cpu: 100m, memory: 64Mi, ephemeral-storage: 8Mi}
          volumeMounts:
            - {name: managed-input, mountPath: /etc/labweaver/managed-input, readOnly: true}
            - {name: managed-runtime, mountPath: /run/labweaver/managed-configuration}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "labweaver.image" (dict "key" $imageKey "value" $image) | quote }}
          imagePullPolicy: IfNotPresent
          {{- if eq $name "kubevirt-executor" }}
          command: ["/usr/local/bin/labweaver-service"]
          {{- end }}
          {{- with $configuration.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $input.env $input.secretEnv (eq $name "kubevirt-executor") }}
          env:
            {{- if $managedControl }}
            {{- range $reserved := list "LABWEAVER_PLATFORM_CONFIGURATION_VERSION_FILE" "LABWEAVER_PLATFORM_CONFIGURATION_SOURCE_FILE" "LABWEAVER_CONTROL_POD_NAME" "LABWEAVER_CONTROL_POD_NAMESPACE" "LABWEAVER_CONTROL_POD_UID" }}
            {{- if or (hasKey $input.env $reserved) (hasKey $input.secretEnv $reserved) }}
            {{- fail (printf "managed Control owns %s" $reserved) }}
            {{- end }}
            {{- end }}
            - {name: LABWEAVER_PLATFORM_CONFIGURATION_VERSION_FILE, value: /run/labweaver/managed-configuration/current/platform-configuration.json}
            - {name: LABWEAVER_PLATFORM_CONFIGURATION_SOURCE_FILE, value: /run/labweaver/managed-configuration/current/platform-configuration-source.json}
            - name: LABWEAVER_CONTROL_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: LABWEAVER_CONTROL_POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: LABWEAVER_CONTROL_POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            {{- end }}
            {{- if eq $name "kubevirt-executor" }}
            - name: LABWEAVER_EXECUTOR_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: LABWEAVER_EXECUTOR_POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: LABWEAVER_EXECUTOR_POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: LABWEAVER_EXECUTOR_CONTAINER_NAME
              value: {{ $name | quote }}
            {{- end }}
            {{- range $key, $value := $input.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $reference := $input.secretEnv }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ default $configuration.secret $reference.secret }}
                  key: {{ required (printf "workloads.%s.secretEnv.%s.key is required" $name $key) $reference.key }}
            {{- end }}
          {{- end }}
          {{- with $configuration.ports }}
          ports:
            {{- range . }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: TCP
            {{- end }}
          {{- end }}
          {{- with $configuration.readiness }}
          readinessProbe:
            {{- if eq .type "http" }}
            httpGet: {path: {{ default "/health/ready" .path }}, port: {{ .port }}}
            {{- else if eq .type "tcp" }}
            tcpSocket: {port: {{ .port }}}
            {{- else }}
            {{- fail (printf "workloads.%s.readiness.type must be http or tcp" $name) }}
            {{- end }}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            {{- if eq .type "http" }}
            httpGet: {path: {{ default "/health/live" .livenessPath }}, port: {{ .port }}}
            {{- else }}
            tcpSocket: {port: {{ .port }}}
            {{- end }}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            {{- if $configuration.gateway }}
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID", "SYS_CHROOT"]
            {{- else }}
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
            {{- end }}
          resources:
            {{- toYaml (default $root.Values.resources $configuration.resources) | nindent 12 }}
          volumeMounts:
            {{- if $environmentAuthority }}
            - {name: environment-authority, mountPath: /etc/labweaver/environment-authority, readOnly: true}
            {{- end }}
            {{- if $managedControl }}
            - {name: managed-runtime, mountPath: /run/labweaver/managed-configuration, readOnly: true}
            {{- end }}
            {{- if $configuration.configMap }}
            - {name: config, mountPath: /etc/labweaver/config, readOnly: true}
            {{- end }}
            {{- if and $configuration.secret (not $configuration.gateway) }}
            - {name: secrets, mountPath: /etc/labweaver/secrets, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
            {{- if $configuration.gateway }}
            - {name: sshd-run, mountPath: /run/sshd}
            - {name: secret-source, mountPath: /var/run/labweaver-secrets-src, readOnly: true}
            - {name: gateway-secrets, mountPath: /etc/labweaver/secrets}
            {{- end }}
            {{- if and (eq $name "web") $root.Values.objectStoreRoute.enabled }}
            - {name: object-store, mountPath: /etc/labweaver/object-store, readOnly: true}
            - {name: object-store-nginx, mountPath: /etc/nginx/labweaver-conf.d, readOnly: true}
            {{- end }}
      volumes:
        {{- if $environmentAuthority }}
        - name: environment-authority
          projected:
            defaultMode: 0440
            sources:
              {{- range $root.Values.environmentExecutorAuthority.secretSources }}
              - secret:
                  name: {{ .name | quote }}
                  items:
                    {{- toYaml .items | nindent 20 }}
              {{- end }}
        {{- end }}
        {{- if $managedControl }}
        - name: managed-input
          configMap:
            name: {{ include "labweaver.controlManagedConfigMap" $root }}
            defaultMode: 0444
            items:
              - {key: platform-configuration.json, path: platform-configuration.json}
              - {key: platform-configuration-source.json, path: platform-configuration-source.json}
        - name: managed-runtime
          emptyDir: {sizeLimit: 8Mi}
        {{- end }}
        {{- if $configuration.configMap }}
        - name: config
          configMap: {name: {{ $configuration.configMap }}}
        {{- end }}
        {{- if and $configuration.secret (not $configuration.gateway) }}
        - name: secrets
          secret:
            secretName: {{ $configuration.secret }}
            defaultMode: 0440
        {{- end }}
        - name: tmp
          emptyDir: {sizeLimit: {{ default "64Mi" $configuration.tmpSizeLimit }}}
        {{- if $configuration.gateway }}
        - name: sshd-run
          emptyDir: {sizeLimit: 8Mi}
        - name: secret-source
          secret:
            secretName: {{ required (printf "workloads.%s.secret is required" $name) $configuration.secret }}
            defaultMode: 0400
        - name: gateway-secrets
          emptyDir: {sizeLimit: 8Mi}
        {{- end }}
        {{- if and (eq $name "web") $root.Values.objectStoreRoute.enabled }}
        - name: object-store
          configMap:
            name: {{ $root.Release.Name }}-object-store-ca
            items: [{key: ca.crt, path: ca.crt}]
        - name: object-store-nginx
          configMap:
            name: {{ $root.Release.Name }}-object-store-ca
            items: [{key: object-store.conf, path: object-store.conf}]
        {{- end }}
{{- with $configuration.ports }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  {{- if and (eq $name "openssh-gateway") $root.Values.sshGatewayService.enabled }}
  annotations:
    metallb.io/allow-shared-ip: {{ required "sshGatewayService.sharedIPKey is required" $root.Values.sshGatewayService.sharedIPKey | quote }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "labweaver.labels" $root | nindent 4 }}
spec:
  {{- if and (eq $name "openssh-gateway") $root.Values.sshGatewayService.enabled }}
  type: LoadBalancer
  loadBalancerIP: {{ required "sshGatewayService.loadBalancerIP is required" $root.Values.sshGatewayService.loadBalancerIP | quote }}
  externalTrafficPolicy: Cluster
  {{- end }}
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports:
    {{- range . }}
    - name: {{ .name }}
      port: {{ .servicePort }}
      targetPort: {{ .name }}
      protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
