{{- $root := . -}}
{{- range $name, $configuration := .Values.workloads }}
{{- if $configuration.enabled }}
{{- $imageKey := required (printf "workloads.%s.imageKey is required" $name) $configuration.imageKey }}
{{- $image := index $root.Values.images $imageKey }}
{{- $configMap := required (printf "workloads.%s.configMap is required" $name) $configuration.configMap }}
{{- $configSecret := required (printf "workloads.%s.configSecret is required" $name) $configuration.configSecret }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "labweaver.labels" $root | nindent 4 }}
spec:
  replicas: {{ default 1 $configuration.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "labweaver.labels" $root | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: {{ default false $configuration.kubernetesApi }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ include "labweaver.image" (dict "key" $imageKey "value" $image) | quote }}
          imagePullPolicy: IfNotPresent
          args: ["--mode", {{ $configuration.mode | quote }}]
          env:
            - name: LABWEAVER_CONFIG
              value: /etc/labweaver/config/config.yaml
            - name: LABWEAVER_SECRETS
              value: /etc/labweaver/secrets/secrets.yaml
          {{- if gt (int $configuration.port) 0 }}
          ports:
            - name: service
              containerPort: {{ $configuration.port }}
          {{- if eq (default "http" $configuration.probe) "tcp" }}
          readinessProbe:
            tcpSocket: {port: service}
          livenessProbe:
            tcpSocket: {port: service}
          {{- else }}
          readinessProbe:
            httpGet: {path: /health/ready, port: service}
          livenessProbe:
            httpGet: {path: /health/live, port: service}
          {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/labweaver/config, readOnly: true}
            - {name: secrets, mountPath: /etc/labweaver/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ $configMap }}}
        - name: secrets
          secret: {secretName: {{ $configSecret }}}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- if gt (int $configuration.port) 0 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports:
    - name: service
      port: {{ $configuration.port }}
      targetPort: service
{{- end }}
{{- end }}
{{- end }}
