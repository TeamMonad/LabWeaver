images:
  access_service: ""
  agent_service: ""
  control_service: ""
  environment_service: ""
  web: ""
  openssh_gateway: ""

imagePullSecrets: []

workloads:
  control-service:
    enabled: true
    imageKey: control_service
    mode: control-service
    port: 8080
    configMap: control-service-config
    configSecret: control-service-secrets
  access-service:
    enabled: true
    imageKey: access_service
    mode: access-service
    port: 8081
    configMap: access-service-config
    configSecret: access-service-secrets
  agent-service:
    enabled: true
    imageKey: agent_service
    mode: agent-service
    port: 8082
    configMap: agent-service-config
    configSecret: agent-service-secrets
  build-executor:
    enabled: true
    imageKey: agent_service
    mode: build-executor
    port: 0
    configMap: build-executor-config
    configSecret: build-executor-secrets
  environment-service:
    enabled: true
    imageKey: environment_service
    mode: environment-service
    port: 8083
    configMap: environment-service-config
    configSecret: environment-service-secrets
  runtime-executor:
    enabled: true
    imageKey: environment_service
    mode: runtime-executor
    port: 0
    kubernetesApi: true
    configMap: runtime-executor-config
    configSecret: runtime-executor-secrets
  openssh-gateway:
    enabled: true
    imageKey: openssh_gateway
    mode: openssh-gateway
    port: 2222
    probe: tcp
    configMap: openssh-gateway-config
    configSecret: openssh-gateway-secrets
  web:
    enabled: true
    imageKey: web
    mode: web
    port: 8080
    configMap: web-config
    configSecret: web-secrets
  evaluation-service:
    enabled: false
  resource-service:
    enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi
    ephemeral-storage: 256Mi

network:
  infrastructureNamespaceSelector:
    matchLabels:
      labweaver.io/infrastructure: "true"
