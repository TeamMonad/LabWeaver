apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: labweaver-platform-image-shape-test
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-harbor-digests
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["labweaver-system"]
      validate:
        message: Platform images must use the approved Harbor project and an immutable digest.
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "harbor.invalid/labweaver-system/*@sha256:*"
