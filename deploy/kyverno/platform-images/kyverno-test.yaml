apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-image-shape
policies:
  - test-policy.yaml
resources:
  - resources.yaml
results:
  - policy: labweaver-platform-image-shape-test
    rule: require-harbor-digests
    resources: [valid]
    result: pass
