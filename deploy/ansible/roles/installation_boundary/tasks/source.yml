---
- name: Read a pinned infrastructure manifest from its configured external source
  ansible.builtin.uri:
    url: "{{ installation_boundary_source }}"
    return_content: true
    status_code: 200
  register: installation_boundary_source_http
  check_mode: false
  environment: "{{ labweaver_controller_proxy_env | default({}) }}"
  when: installation_boundary_source is match('^https?://')

- name: Read a pinned infrastructure manifest from its configured local locator
  ansible.builtin.slurp:
    src: "{{ installation_boundary_source }}"
  register: installation_boundary_source_file
  when: installation_boundary_source is not match('^https?://')

- name: Parse all pinned manifest documents without dropping invalid entries
  ansible.builtin.set_fact:
    installation_boundary_source_documents: >-
      {{ (installation_boundary_source_http.content if installation_boundary_source is match('^https?://')
          else installation_boundary_source_file.content | b64decode) | from_yaml_all | reject('equalto', none) | list }}
  no_log: true

- name: Require a nonempty Kubernetes document inventory
  ansible.builtin.assert:
    that:
      - installation_boundary_source_documents | length > 0
      - item is mapping
      - item.apiVersion is string
      - item.kind is string
      - item.kind != 'List' or item['items'] is sequence
    fail_msg: INFRASTRUCTURE_SOURCE_MANIFEST_INVALID
  loop: "{{ installation_boundary_source_documents }}"
  no_log: true

- name: Reject empty pinned manifest sources
  ansible.builtin.assert:
    that: installation_boundary_source_documents | length > 0
    fail_msg: INFRASTRUCTURE_SOURCE_MANIFEST_INVALID

- name: Add every pinned manifest object to the complete mutation inventory
  ansible.builtin.set_fact:
    installation_boundary_manifest_objects: >-
      {{ installation_boundary_manifest_objects + (item['items'] if item.kind == 'List' else [item]) }}
  loop: "{{ installation_boundary_source_documents }}"
  no_log: true
