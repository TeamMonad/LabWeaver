---
- name: Load immutable Sprint 2 foundation identities
  ansible.builtin.set_fact:
    sprint2_foundation_lock: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../versions.lock.yml') | from_yaml }}

- name: Validate Sprint 2 foundation inputs
  ansible.builtin.assert:
    that:
      - sprint2_foundation_enabled | bool
      - sprint2_foundation_namespace == 'labweaver-data'
      - sprint2_foundation_bundle | length > 0
      - sprint2_foundation_storage_class | length > 0
      - sprint2_foundation_minio_storage_class | length > 0
      - sprint2_foundation_lock.postgresql.image is match('^[^\s]+@sha256:[0-9a-f]{64}$')
      - sprint2_foundation_lock.sprint2_foundation.nats is match('^[^\s]+@sha256:[0-9a-f]{64}$')
      - sprint2_foundation_lock.sprint2_foundation.minio is match('^[^\s]+@sha256:[0-9a-f]{64}$')
    fail_msg: SPRINT2_FOUNDATION_INPUT_INVALID

- name: Inspect controlled foundation inputs
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ sprint2_foundation_bundle }}"
    - "{{ sprint2_foundation_manifest }}"
  register: sprint2_foundation_inputs
  delegate_to: localhost
  become: false

- name: Reject missing foundation inputs
  ansible.builtin.assert:
    that:
      - sprint2_foundation_inputs.results | map(attribute='stat.exists') | min
      - sprint2_foundation_inputs.results | map(attribute='stat.isreg') | min
    fail_msg: SPRINT2_FOUNDATION_INPUT_MISSING

- name: Parse reviewed foundation bundle and manifest
  ansible.builtin.set_fact:
    sprint2_foundation_objects: >-
      {{ lookup('ansible.builtin.file', sprint2_foundation_bundle) | from_yaml_all | list }}
    sprint2_foundation_manifest_value: >-
      {{ lookup('ansible.builtin.file', sprint2_foundation_manifest) | from_json }}
  no_log: true

- name: Validate foundation object boundary
  ansible.builtin.assert:
    that:
      - sprint2_foundation_manifest_value.apiVersion == 'deploy.labweaver.io/sprint2-bundle-manifest/v1'
      - sprint2_foundation_manifest_value.namespace == sprint2_foundation_namespace
      - sprint2_foundation_objects | length == 4
      - sprint2_foundation_objects | map(attribute='apiVersion') | unique | list == ['v1']
      - sprint2_foundation_objects | map(attribute='metadata.namespace') | unique | list == [sprint2_foundation_namespace]
      - >-
        sprint2_foundation_objects | selectattr('kind', 'equalto', 'ConfigMap')
        | map(attribute='metadata.name') | sort
        == sprint2_foundation_manifest_value.configMaps.keys() | sort
      - >-
        sprint2_foundation_objects | selectattr('kind', 'equalto', 'Secret')
        | map(attribute='metadata.name') | sort
        == sprint2_foundation_manifest_value.secrets.keys() | sort
    fail_msg: SPRINT2_FOUNDATION_BUNDLE_INVALID
  no_log: true

- name: Validate every foundation key against the manifest
  ansible.builtin.assert:
    that:
      - item.data is defined
      - item.stringData is not defined
      - item.binaryData is not defined
      - item.data.keys() | sort == sprint2_foundation_expected_keys | sort
      - item.kind != 'Secret' or item.type == 'Opaque'
    fail_msg: SPRINT2_FOUNDATION_BUNDLE_KEYS_INVALID
  vars:
    sprint2_foundation_expected_keys: >-
      {{ (sprint2_foundation_manifest_value.configMaps
          if item.kind == 'ConfigMap'
          else sprint2_foundation_manifest_value.secrets)[item.metadata.name] }}
  loop: "{{ sprint2_foundation_objects }}"
  no_log: true

- name: Select reviewed NATS server configuration
  ansible.builtin.set_fact:
    sprint2_foundation_nats_configuration: >-
      {{ (sprint2_foundation_objects
          | selectattr('kind', 'equalto', 'ConfigMap')
          | selectattr('metadata.name', 'equalto', 'nats-config')
          | first).data['nats-server.conf'] }}
  no_log: true

- name: Require JetStream, operator credentials, and mutual TLS
  ansible.builtin.assert:
    that:
      - "'jetstream' in sprint2_foundation_nats_configuration"
      - "'store_dir: \"/data\"' in sprint2_foundation_nats_configuration"
      - "'operator:' in sprint2_foundation_nats_configuration"
      - "'resolver' in sprint2_foundation_nats_configuration"
      - "'tls {' in sprint2_foundation_nats_configuration"
      - "'cert_file: \"/etc/nats/tls/tls.crt\"' in sprint2_foundation_nats_configuration"
      - "'key_file: \"/etc/nats/tls/tls.key\"' in sprint2_foundation_nats_configuration"
      - "'ca_file: \"/etc/nats/tls/ca.crt\"' in sprint2_foundation_nats_configuration"
      - "'verify: true' in sprint2_foundation_nats_configuration"
    fail_msg: SPRINT2_FOUNDATION_NATS_SECURITY_INVALID
  no_log: true

- name: Reconcile the protected foundation namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ sprint2_foundation_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ sprint2_foundation_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver-infrastructure
          labweaver.io/infrastructure: "true"
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted

- name: Apply reviewed foundation configuration
  kubernetes.core.k8s:
    kubeconfig: "{{ sprint2_foundation_kubeconfig }}"
    state: present
    definition: "{{ item }}"
  loop: "{{ sprint2_foundation_objects }}"
  no_log: true

- name: Reconcile foundation workloads
  kubernetes.core.k8s:
    kubeconfig: "{{ sprint2_foundation_kubeconfig }}"
    state: present
    definition: "{{ item }}"
  loop: >-
    {{ lookup('ansible.builtin.template', 'workloads.yml.j2') | from_yaml_all | list }}

- name: Read foundation StatefulSets
  kubernetes.core.k8s_info:
    kubeconfig: "{{ sprint2_foundation_kubeconfig }}"
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ sprint2_foundation_namespace }}"
  register: sprint2_foundation_statefulsets
  until: >-
    sprint2_foundation_statefulsets.resources | length == 3 and
    sprint2_foundation_statefulsets.resources
    | map(attribute='status.readyReplicas') | map('default', 0, true) | map('int') | min == 1
  retries: "{{ sprint2_foundation_rollout_retries }}"
  delay: "{{ sprint2_foundation_rollout_delay }}"

- name: Verify exact foundation workload set and immutable images
  ansible.builtin.assert:
    that:
      - sprint2_foundation_statefulsets.resources | map(attribute='metadata.name') | sort == ['minio', 'nats', 'postgres']
      - >-
        sprint2_foundation_statefulsets.resources
        | map(attribute='spec.template.spec.containers') | map('first')
        | map(attribute='image') | sort
        == [sprint2_foundation_lock.postgresql.image,
            sprint2_foundation_lock.sprint2_foundation.minio,
            sprint2_foundation_lock.sprint2_foundation.nats] | sort
    fail_msg: SPRINT2_FOUNDATION_READBACK_INVALID
