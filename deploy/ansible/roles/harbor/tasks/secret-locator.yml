---
- name: Read the Bundle Harbor locator on the controller
  when: harbor_secret_locator_controller | bool
  become: false
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_remote_tmp: "{{ harbor_secret_locator_controller_tmp }}"
  no_log: true
  block:
    - name: Require the derived Harbor locator binding
      ansible.builtin.assert:
        that:
          - harbor_secret_locator_path | length > 0
          - harbor_secret_locator_sha256 is match('^sha256:[0-9a-f]{64}$')
          - harbor_secret_locator_controller_tmp | length > 0
        fail_msg: HARBOR_SECRET_LOCATOR_INVALID

    - name: Inspect the private Harbor locator
      ansible.builtin.stat:
        path: "{{ harbor_secret_locator_path }}"
        checksum_algorithm: sha256
        follow: false
      register: harbor_locator_stat

    - name: Reject a missing or changed Harbor locator
      ansible.builtin.assert:
        that:
          - harbor_locator_stat.stat.isreg | default(false)
          - harbor_locator_stat.stat.mode | default('') == '0600'
          - ('sha256:' ~ (harbor_locator_stat.stat.checksum | default(''))) == harbor_secret_locator_sha256
        fail_msg: HARBOR_SECRET_LOCATOR_INVALID

    - name: Read the private Harbor locator
      ansible.builtin.slurp:
        src: "{{ harbor_secret_locator_path }}"
      register: harbor_locator_raw

    - name: Bind the bytes read to the Bundle source
      ansible.builtin.assert:
        that:
          - ('sha256:' ~ (harbor_locator_raw.content | b64decode | hash('sha256'))) == harbor_secret_locator_sha256
        fail_msg: HARBOR_SECRET_LOCATOR_CHANGED

    - name: Keep the existing Harbor credential input
      ansible.builtin.set_fact:
        harbor_secret_locator:
          stdout: "{{ harbor_locator_raw.content | b64decode }}"

- name: Read the legacy root-only Harbor locator on the router
  ansible.builtin.command:
    argv: [sudo, -n, cat, "{{ harbor_secret_locator_path }}"]
  check_mode: false
  delegate_to: "{{ 'localhost' if (harbor_secret_locator_controller | bool) else groups['routers'][0] }}"
  become: false
  changed_when: false
  no_log: true
  register: harbor_legacy_locator
  when: not (harbor_secret_locator_controller | bool)

- name: Keep the legacy Harbor credential input
  ansible.builtin.set_fact:
    harbor_secret_locator: "{{ harbor_legacy_locator }}"
  no_log: true
  when: not (harbor_secret_locator_controller | bool)

- name: Require each Harbor credential once
  ansible.builtin.assert:
    that:
      - harbor_secret_locator.stdout | regex_findall('(?m)^HARBOR_ADMIN_PASSWORD=(.+)$') | length == 1
      - harbor_secret_locator.stdout | regex_findall('(?m)^HARBOR_DATABASE_PASSWORD=(.+)$') | length == 1
      - harbor_secret_locator.stdout | regex_findall('(?m)^HARBOR_REDIS_PASSWORD=(.+)$') | length == 1
    fail_msg: HARBOR_SECRET_LOCATOR_KEYS_INVALID
  no_log: true

- name: Extract Harbor credentials without logging values
  ansible.builtin.set_fact:
    harbor_admin_password: "{{ harbor_secret_locator.stdout | regex_findall('(?m)^HARBOR_ADMIN_PASSWORD=(.+)$') | first }}"
    harbor_database_password: "{{ harbor_secret_locator.stdout | regex_findall('(?m)^HARBOR_DATABASE_PASSWORD=(.+)$') | first }}"
    harbor_redis_password: "{{ harbor_secret_locator.stdout | regex_findall('(?m)^HARBOR_REDIS_PASSWORD=(.+)$') | first }}"
  no_log: true
