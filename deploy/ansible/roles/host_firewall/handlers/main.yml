---
- name: Validate the permanent firewalld configuration
  ansible.builtin.command:
    argv: [firewall-cmd, --check-config]
  changed_when: false
  listen: Reload the host firewall safely

- name: Reload firewalld
  ansible.builtin.command:
    argv: [firewall-cmd, --reload]
  changed_when: true
  listen: Reload the host firewall safely
