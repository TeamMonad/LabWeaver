---
# Host firewall managed with firewalld. Every change is applied with the
# automatic rollback guard active (snapshot + systemd-run deadline), and the
# permanent configuration is validated before any reload.
#
# The ssh service is ensured in the public zone before any interface is bound
# or the service reloaded, so a misconfiguration cannot lock out management.

- name: Require the host firewall inputs
  ansible.builtin.assert:
    that:
      - host_firewall_public_interfaces | length > 0
      - host_firewall_public_services | select('equalto', 'ssh') | list | length == 1
    fail_msg: HOST_FIREWALL_INPUT_INVALID

- name: Install firewalld on Debian-family hosts
  ansible.builtin.apt:
    name: firewalld
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Install firewalld on RedHat-family hosts
  ansible.builtin.dnf:
    name: firewalld
    state: present
  when: ansible_facts.os_family == 'RedHat'

- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Build the effective firewall contract for this host
  ansible.builtin.set_fact:
    host_firewall_effective_public_interfaces: >-
      {{ host_firewall_public_interfaces | intersect(ansible_facts.interfaces | default([])) }}
    host_firewall_effective_internal_interfaces: >-
      {{ host_firewall_internal_interfaces | intersect(ansible_facts.interfaces | default([])) }}
    # Cluster sources are classified out of the public zone, so the internal
    # zone must also serve every service the public zone serves (otherwise the
    # WireGuard management mesh on wg0/51820 is rejected for node sources).
    host_firewall_effective_internal_services: >-
      {{ (host_firewall_internal_services + host_firewall_public_services) | unique | list }}
    host_firewall_effective_internal_ports: >-
      {{ (host_firewall_internal_ports | map(attribute='port') | list
          | zip(host_firewall_internal_ports | map(attribute='protocol') | list)
          | map('join', '/') | list)
         + host_firewall_public_ports
         + host_firewall_cluster_ports
         + ([host_firewall_cilium_wireguard_port] if host_firewall_cilium_wireguard_enabled | bool else [])
         + ([host_firewall_cilium_geneve_port] if host_firewall_cilium_geneve_enabled | bool else []) }}
    host_firewall_effective_internal_sources: >-
      {{ (host_firewall_internal_sources + host_firewall_cluster_sources) | unique | list }}

- name: Reject an uplink interface that is not present on the host
  ansible.builtin.assert:
    that:
      - host_firewall_effective_public_interfaces | length > 0
    fail_msg: HOST_FIREWALL_PUBLIC_INTERFACE_MISSING

- name: Verify sshd is listening before changing the host firewall
  ansible.builtin.command:
    argv: [ss, -H, -tln, "sport = :{{ host_firewall_ssh_probe_port }}"]
  changed_when: false
  register: host_firewall_sshd_listen

- name: Refuse to change the host firewall when sshd is not listening
  ansible.builtin.assert:
    that:
      - host_firewall_sshd_listen.stdout | trim | length > 0
    fail_msg: HOST_FIREWALL_SSHD_NOT_LISTENING

- name: Ensure ssh is allowed in the public zone before any interface change
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ host_firewall_public_zone }}"
      - --add-service=ssh
  register: host_firewall_ensure_public_ssh
  changed_when: "'ALREADY_ENABLED' not in (host_firewall_ensure_public_ssh.stderr | default(''))"
  notify: Reload the host firewall safely

- name: Read the public zone state
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, "--zone={{ host_firewall_public_zone }}", "--list-{{ item }}"]
  loop: [services, interfaces, ports]
  changed_when: false
  register: host_firewall_public_zone_state

- name: Read the internal zone state
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, "--zone={{ host_firewall_internal_zone }}", "--list-{{ item }}"]
  loop: [services, interfaces, ports, sources]
  changed_when: false
  register: host_firewall_internal_zone_state

- name: Read the docker zone state
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, "--zone={{ host_firewall_docker_zone }}", "--list-interfaces"]
  changed_when: false
  register: host_firewall_docker_zone_state
  when: host_firewall_manage_docker | bool

- name: Record the current docker zone interfaces
  ansible.builtin.set_fact:
    host_firewall_docker_interfaces_current: >-
      {{ host_firewall_docker_zone_state.stdout.split()
         if (host_firewall_docker_zone_state is defined
             and host_firewall_docker_zone_state.stdout is defined) else [] }}

- name: Stat the docker forwarding policy
  ansible.builtin.stat:
    path: "/etc/firewalld/policies/{{ host_firewall_docker_policy_name }}.xml"
  register: host_firewall_docker_policy_stat
  when: host_firewall_manage_docker_policy | bool

- name: Determine which firewall entries are missing
  ansible.builtin.set_fact:
    host_firewall_pending_public_interfaces: >-
      {{ host_firewall_effective_public_interfaces | difference(host_firewall_public_zone_state.results[1].stdout.split()) }}
    host_firewall_pending_public_services: >-
      {{ host_firewall_public_services | difference(host_firewall_public_zone_state.results[0].stdout.split()) }}
    host_firewall_pending_public_ports: >-
      {{ host_firewall_public_ports | difference(host_firewall_public_zone_state.results[2].stdout.split()) }}
    host_firewall_pending_internal_interfaces: >-
      {{ host_firewall_effective_internal_interfaces | difference(host_firewall_internal_zone_state.results[1].stdout.split()) }}
    host_firewall_pending_internal_services: >-
      {{ host_firewall_effective_internal_services | difference(host_firewall_internal_zone_state.results[0].stdout.split()) }}
    host_firewall_pending_internal_ports: >-
      {{ host_firewall_effective_internal_ports | difference(host_firewall_internal_zone_state.results[2].stdout.split()) }}
    host_firewall_pending_internal_sources: >-
      {{ host_firewall_effective_internal_sources | difference(host_firewall_internal_zone_state.results[3].stdout.split()) }}

- name: Decide whether a guarded firewalld change is required
  ansible.builtin.set_fact:
    host_firewall_change_pending: >-
      {{ (host_firewall_pending_public_interfaces + host_firewall_pending_public_services
          + host_firewall_pending_public_ports + host_firewall_pending_internal_interfaces
          + host_firewall_pending_internal_services + host_firewall_pending_internal_ports
          + host_firewall_pending_internal_sources) | length > 0
         or (host_firewall_ensure_public_ssh is changed)
         or (host_firewall_manage_docker | bool
             and host_firewall_docker_interface in (ansible_facts.interfaces | default([]))
             and host_firewall_docker_interface not in host_firewall_docker_interfaces_current)
         or (host_firewall_manage_docker_policy | bool
             and not (host_firewall_docker_policy_stat.stat.exists | default(false))) }}

- name: Snapshot the current firewalld configuration
  block:
    - name: Create the firewall snapshot root
      ansible.builtin.file:
        path: "{{ host_firewall_snapshot_root }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Record the snapshot directory
      ansible.builtin.set_fact:
        host_firewall_snapshot_dir: "{{ host_firewall_snapshot_root }}/{{ ansible_date_time.iso8601_basic_short }}"
    - name: Copy the current firewalld configuration
      ansible.builtin.command:
        argv: [cp, -a, /etc/firewalld, "{{ host_firewall_snapshot_dir }}"]
        creates: "{{ host_firewall_snapshot_dir }}"
      changed_when: true
  when: host_firewall_change_pending | bool

- name: Install the automatic rollback script
  ansible.builtin.template:
    src: rollback.sh.j2
    dest: "{{ host_firewall_rollback_script }}"
    owner: root
    group: root
    mode: '0700'
  when: host_firewall_change_pending | bool

- name: Cancel a stale rollback deadline before scheduling a new one
  ansible.builtin.systemd_service:
    name: "{{ host_firewall_rollback_unit }}.timer"
    state: stopped
  failed_when: false
  when: host_firewall_change_pending | bool

- name: Schedule the automatic rollback deadline
  ansible.builtin.command:
    argv:
      - systemd-run
      - "--on-active={{ host_firewall_rollback_seconds }}"
      - "--unit={{ host_firewall_rollback_unit }}"
      - --collect
      - --description=LabWeaver host firewall automatic rollback
      - "{{ host_firewall_rollback_script }}"
  changed_when: true
  when: host_firewall_change_pending | bool

- name: Bind the public interfaces
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ host_firewall_public_zone }}"
      - "--add-interface={{ item }}"
  loop: "{{ host_firewall_pending_public_interfaces }}"
  changed_when: true
  notify: Reload the host firewall safely

- name: Allow the public zone services
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ host_firewall_public_zone }}"
      - "--add-service={{ item }}"
  loop: "{{ host_firewall_pending_public_services }}"
  changed_when: true
  notify: Reload the host firewall safely

- name: Allow the public zone ports
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ host_firewall_public_zone }}"
      - "--add-port={{ item }}"
  loop: "{{ host_firewall_pending_public_ports }}"
  changed_when: true
  notify: Reload the host firewall safely

- name: Bind the internal interfaces
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ host_firewall_internal_zone }}"
      - "--add-interface={{ item }}"
  loop: "{{ host_firewall_pending_internal_interfaces }}"
  changed_when: true
  notify: Reload the host firewall safely

- name: Allow the internal zone services including those inherited from public
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ host_firewall_internal_zone }}"
      - "--add-service={{ item }}"
  loop: "{{ host_firewall_pending_internal_services }}"
  changed_when: true
  notify: Reload the host firewall safely

- name: Allow the internal zone ports including the Cilium and Kubernetes underlay
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ host_firewall_internal_zone }}"
      - "--add-port={{ item }}"
  loop: "{{ host_firewall_pending_internal_ports }}"
  changed_when: true
  notify: Reload the host firewall safely

- name: Allow the cluster source addresses in the internal zone
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ host_firewall_internal_zone }}"
      - "--add-source={{ item }}"
  loop: "{{ host_firewall_pending_internal_sources }}"
  changed_when: true
  notify: Reload the host firewall safely

- name: Bind the docker bridge to its zone
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ host_firewall_docker_zone }}"
      - "--add-interface={{ host_firewall_docker_interface }}"
  when:
    - host_firewall_manage_docker | bool
    - host_firewall_docker_interface in (ansible_facts.interfaces | default([]))
    - host_firewall_docker_interface not in host_firewall_docker_interfaces_current
  changed_when: true
  notify: Reload the host firewall safely

- name: Accept forwarding into the docker zone
  ansible.builtin.copy:
    dest: "/etc/firewalld/policies/{{ host_firewall_docker_policy_name }}.xml"
    owner: root
    group: root
    mode: '0644'
    content: |
      <?xml version="1.0" encoding="utf-8"?>
      <policy version="1.0" target="ACCEPT">
        <description>allow forwarding to the docker zone</description>
        <ingress-zone name="ANY"/>
        <egress-zone name="{{ host_firewall_docker_zone }}"/>
      </policy>
  when: host_firewall_manage_docker_policy | bool
  notify: Reload the host firewall safely

- name: Apply the validated firewall configuration
  ansible.builtin.meta: flush_handlers

- name: Require ssh to remain allowed in the active public zone
  ansible.builtin.command:
    argv: [firewall-cmd, "--zone={{ host_firewall_public_zone }}", "--query-service=ssh"]
  changed_when: false
  register: host_firewall_public_ssh_readback

- name: Fail closed when ssh is not allowed in the active public zone
  ansible.builtin.assert:
    that:
      - host_firewall_public_ssh_readback.stdout == 'yes'
    fail_msg: HOST_FIREWALL_SSH_NOT_ENABLED

- name: Read back the active interface zone bindings
  ansible.builtin.command:
    argv: [firewall-cmd, "--get-zone-of-interface={{ item }}"]
  loop: "{{ host_firewall_effective_public_interfaces }}"
  changed_when: false
  register: host_firewall_interface_zone_readback

- name: Require every public interface to be in the public zone
  ansible.builtin.assert:
    that:
      - >-
        host_firewall_interface_zone_readback.results | map(attribute='stdout')
        | select('equalto', host_firewall_public_zone) | list | length
        == host_firewall_effective_public_interfaces | length
    fail_msg: HOST_FIREWALL_PUBLIC_INTERFACE_ZONE_MISMATCH

- name: Probe a fresh SSH connection to the node
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: "{{ host_firewall_ssh_probe_port }}"
    delay: 2
    timeout: "{{ host_firewall_ssh_probe_timeout }}"
  delegate_to: localhost
  become: false

- name: Confirm the change by cancelling the automatic rollback
  ansible.builtin.systemd_service:
    name: "{{ host_firewall_rollback_unit }}.timer"
    state: stopped
  when: host_firewall_change_pending | bool
