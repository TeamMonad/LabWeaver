---
- name: Bind identity-foundation execution and configuration
  ansible.builtin.set_fact:
    identity_run_id: "{{ lookup('env', 'LABWEAVER_RUN_ID') }}"
    identity_secret_locator: "{{ lookup('env', 'LABWEAVER_IDENTITY_SECRET_LOCATOR') }}"
    identity_lock: "{{ (lookup('file', labweaver_versions_lock_file | default(playbook_dir ~ '/../../versions.lock.yml')) | from_yaml).identity_foundation }}"
    identity_ha_lock: "{{ (lookup('file', labweaver_versions_lock_file | default(playbook_dir ~ '/../../versions.lock.yml')) | from_yaml).high_availability }}"
    identity_run_suffix: "{{ lookup('env', 'LABWEAVER_RUN_ID') | hash('sha256') | truncate(12, true, '') }}"

- name: Reject incomplete or mutable identity-foundation configuration
  ansible.builtin.assert:
    that:
      - identity_foundation_enabled | bool
      - identity_run_id is match('^infra-[a-z0-9-]+$')
      - identity_hostname is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$')
      - identity_realm == 'workloads'
      - identity_service_clients | length == 6
      - (identity_service_clients | map(attribute='client_id') | list | unique | length) == (identity_service_clients | length)
      - (identity_service_clients | map(attribute='audience') | list | unique | length) == (identity_service_clients | length)
      - (identity_service_clients | map(attribute='client_id') | list) == (identity_service_clients | map(attribute='audience') | list)
      - identity_service_clients | selectattr('client_id', 'match', '^labweaver-[a-z0-9-]+$') | list | length == (identity_service_clients | length)
      - identity_service_clients | selectattr('audience', 'match', '^labweaver-[a-z0-9-]+$') | list | length == (identity_service_clients | length)
      - >-
        identity_service_clients
        | selectattr('secret_name', 'match', '^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$')
        | list | length == (identity_service_clients | length)
      - identity_service_clients | selectattr('secret_key', 'match', '^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$') | list | length == (identity_service_clients | length)
      - identity_secret_locator | length > 0
      - identity_secret_locator_sha256 is match('^sha256:[0-9a-f]{64}$')
      - identity_lock.keycloak == '26.7.0'
      - identity_lock.postgres == '17.6-alpine'
      - identity_lock.images.values() | reject('match', '^.+@sha256:[0-9a-f]{64}$') | list | length == 0
      - identity_ha_lock.cnpg.postgres_image is match('^.+@sha256:[0-9a-f]{64}$')
      - identity_postgres_storage is match('^[1-9][0-9]*(Gi|Ti)$')
      - identity_keycloak_replicas is integer
      - identity_keycloak_replicas == 2
    fail_msg: IDENTITY_CONFIGURATION_INVALID

- name: Hash the selected private identity secret locator
  ansible.builtin.stat:
    path: "{{ identity_secret_locator }}"
    checksum_algorithm: sha256
  become: "{{ not (identity_secret_locator_controller | bool) }}"
  delegate_to: "{{ 'localhost' if (identity_secret_locator_controller | bool) else groups['routers'][0] }}"
  vars:
    ansible_connection: >-
      {{ 'local' if (identity_secret_locator_controller | bool)
         else hostvars[groups['routers'][0]].ansible_connection | default('ssh') }}
    ansible_remote_tmp: >-
      {{ identity_secret_locator_controller_tmp if (identity_secret_locator_controller | bool)
         else hostvars[groups['routers'][0]].ansible_remote_tmp | default('~/.ansible/tmp') }}
  register: identity_locator_stat
  no_log: true

- name: Reject a missing or changed identity secret locator
  ansible.builtin.assert:
    that:
      - identity_locator_stat.stat.exists
      - (identity_secret_locator_controller | bool) or identity_locator_stat.stat.pw_name == 'root'
      - identity_locator_stat.stat.mode == '0600'
      - ('sha256:' ~ identity_locator_stat.stat.checksum) == identity_secret_locator_sha256
    fail_msg: IDENTITY_SECRET_LOCATOR_INVALID

- name: Read the identity bootstrap locator without logging it
  ansible.builtin.slurp:
    src: "{{ identity_secret_locator }}"
  become: "{{ not (identity_secret_locator_controller | bool) }}"
  delegate_to: "{{ 'localhost' if (identity_secret_locator_controller | bool) else groups['routers'][0] }}"
  vars:
    ansible_connection: >-
      {{ 'local' if (identity_secret_locator_controller | bool)
         else hostvars[groups['routers'][0]].ansible_connection | default('ssh') }}
    ansible_remote_tmp: >-
      {{ identity_secret_locator_controller_tmp if (identity_secret_locator_controller | bool)
         else hostvars[groups['routers'][0]].ansible_remote_tmp | default('~/.ansible/tmp') }}
  register: identity_locator_raw
  no_log: true

- name: Decode the identity bootstrap inputs
  ansible.builtin.set_fact:
    identity_secrets: "{{ identity_locator_raw.content | b64decode | from_yaml }}"
  no_log: true

- name: Validate bootstrap secret shape without exposing values
  ansible.builtin.assert:
    that:
      - identity_secrets.schema_version == 'identity-bootstrap.v2'
      - identity_secrets.database_password | length >= 32
      - identity_secrets.bootstrap_admin_password | length >= 32
      - identity_secrets.service_client_secrets is mapping
      - >-
        (identity_service_clients
        | selectattr('secret_key', 'in', identity_secrets.service_client_secrets.keys() | list)
        | list | length) == (identity_service_clients | length)
      - identity_secrets.revision is match('^[a-z0-9][a-z0-9.-]{0,63}$')
    fail_msg: IDENTITY_BOOTSTRAP_SECRET_INVALID
  no_log: true

- name: Validate every service client secret without exposing values
  ansible.builtin.assert:
    that:
      - identity_secrets.service_client_secrets[item.secret_key] | length >= 32
    fail_msg: IDENTITY_BOOTSTRAP_SERVICE_SECRET_INVALID
  loop: "{{ identity_service_clients }}"
  loop_control:
    label: "{{ item.client_id }}"
  no_log: true

- name: Validate service role assignments before provisioning
  ansible.builtin.assert:
    that:
      - item.caller in (identity_service_clients | map(attribute='client_id') | list)
      - item.target in (identity_service_clients | map(attribute='client_id') | list)
      - item.roles | length > 0
      - item.roles | select('match', '^[A-Za-z0-9_.:-]{1,128}$') | list | length == item.roles | length
    fail_msg: IDENTITY_SERVICE_ROLE_ASSIGNMENT_INVALID
  loop: "{{ identity_service_role_assignments }}"
  loop_control:
    label: "{{ item.caller }} -> {{ item.target }}"

- name: Validate service realm role assignments before provisioning
  ansible.builtin.assert:
    that:
      - item.caller in (identity_service_clients | map(attribute='client_id') | list)
      - item.roles | length > 0
      - item.roles | select('match', '^[A-Za-z0-9_.:-]{1,128}$') | list | length == item.roles | length
    fail_msg: IDENTITY_SERVICE_REALM_ROLE_ASSIGNMENT_INVALID
  loop: "{{ identity_service_realm_role_assignments }}"
  loop_control:
    label: "{{ item.caller }} -> realm-management"

- name: Restrict role-only provisioning to the approved directory reader mapping
  ansible.builtin.assert:
    that:
      - identity_service_realm_role_assignments | length == 1
      - identity_service_realm_role_assignments[0].caller == 'labweaver-access'
      - (identity_service_realm_role_assignments[0].roles | sort) == ['query-users', 'view-users']
    fail_msg: IDENTITY_DIRECTORY_ROLE_SCOPE_INVALID
  when: identity_foundation_realm_roles_only | bool

- name: Read the adopted cluster identity
  ansible.builtin.command:
    argv: ["{{ identity_kubectl_path }}", --kubeconfig, "{{ identity_kubeconfig_path }}", get, namespace, kube-system, -o, 'jsonpath={.metadata.uid}']
  changed_when: false
  register: identity_cluster_uid

- name: Read existing Gateway allocation before mutation
  ansible.builtin.command:
    argv: ["{{ identity_kubectl_path }}", --kubeconfig, "{{ identity_kubeconfig_path }}", get, gateway, -A, -o, json]
  changed_when: false
  register: identity_gateways_raw

- name: Select the adopted identity Gateway allocation
  ansible.builtin.set_fact:
    identity_gateway_candidates: >-
      {{
        (identity_gateways_raw.stdout | from_json)['items']
        | selectattr('metadata.name', 'equalto', 'identity-gateway')
        | selectattr('metadata.namespace', 'equalto', identity_namespace)
        | list
      }}
  when:
    - labweaver_preflight_identity_adopted | default(false) | bool
    - not (identity_foundation_realm_roles_only | bool)

- name: Read the adopted identity Gateway addresses
  ansible.builtin.set_fact:
    identity_gateway_allocated_addresses: >-
      {{
        (
          identity_gateway_candidates
          | map(attribute='status.addresses', default=[])
          | first
          | default([])
        )
        | map(attribute='value', default='')
        | reject('equalto', '')
        | list
      }}
  when:
    - labweaver_preflight_identity_adopted | default(false) | bool
    - not (identity_foundation_realm_roles_only | bool)

- name: Reject an adopted identity Gateway VIP change
  ansible.builtin.assert:
    that:
      - identity_gateway_candidates | length <= 1
      - >-
        identity_gateway_candidates | length == 0
        or identity_gateway_allocated_addresses | length == 0
        or (
          identity_gateway_allocated_addresses | length == 1
          and identity_gateway_allocated_addresses[0] == identity_gateway_vip
        )
    fail_msg: >-
      IDENTITY_GATEWAY_ADOPTED_VIP_MISMATCH: verify the existing identity-gateway
      allocation and configure identity_gateway_vip to that address before reconcile
  when:
    - labweaver_preflight_identity_adopted | default(false) | bool
    - not (identity_foundation_realm_roles_only | bool)

- name: Reject a conflicting Gateway VIP
  ansible.builtin.assert:
    that:
      - >-
        (identity_gateways_raw.stdout | from_json)['items']
        | rejectattr('metadata.name', 'equalto', 'identity-gateway')
        | map(attribute='status.addresses', default=[])
        | flatten
        | selectattr('value', 'equalto', identity_gateway_vip)
        | list | length == 0
    fail_msg: IDENTITY_GATEWAY_VIP_CONFLICT

- name: Require an existing healthy identity foundation in verify-only mode
  ansible.builtin.command:
    argv:
      - "{{ identity_kubectl_path }}"
      - --kubeconfig
      - "{{ identity_kubeconfig_path }}"
      - -n
      - "{{ identity_namespace }}"
      - rollout
      - status
      - "deployment/{{ identity_name }}"
      - --timeout=1s
  changed_when: false
  when: identity_foundation_verify_only | bool

- name: Reconcile identity foundation
  when:
    - not (identity_foundation_verify_only | bool)
    - not (identity_foundation_realm_roles_only | bool)
  block:
    - name: Validate the independent identity backup profile on the controller
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "{{ playbook_dir }}/../../../tools/ha_foundation.py", identity]
        stdin: "{{ identity_foundation_ha | to_json }}"
      delegate_to: localhost
      become: false
      changed_when: false
      register: identity_ha_validation

    - name: Bind the validated identity backup defaults
      ansible.builtin.set_fact:
        identity_foundation_ha: "{{ identity_ha_validation.stdout | from_json }}"

    - name: Require independent identity backup credentials
      ansible.builtin.assert:
        that:
          - identity_secrets.backup_access_key | default('') | length > 0
          - identity_secrets.backup_secret_key | default('') | length > 0
          - identity_secrets.backup_ca_crt | default('') is search('BEGIN CERTIFICATE')
        fail_msg: IDENTITY_BACKUP_CREDENTIALS_REQUIRED
      no_log: true

    - name: Require the platform CNPG and Barman CRDs before identity installation
      ansible.builtin.command:
        argv:
          - "{{ identity_kubectl_path }}"
          - --kubeconfig
          - "{{ identity_kubeconfig_path }}"
          - wait
          - "crd/{{ item }}"
          - --for=condition=Established
          - --timeout=60s
      loop: [clusters.postgresql.cnpg.io, objectstores.barmancloud.cnpg.io, scheduledbackups.postgresql.cnpg.io]
      changed_when: false

    - name: Install the locked Kubernetes Python client on the control plane
      ansible.builtin.dnf:
        name: "{{ identity_lock.python_kubernetes_rpm }}"
        state: present
      when: identity_controller_manage_python_kubernetes | bool

    - name: Verify the locked Kubernetes Python client identity
      ansible.builtin.command:
        argv: [rpm, -q, --queryformat, '%{NAME}-%{VERSION}-%{RELEASE}', python3-kubernetes]
      changed_when: false
      register: identity_python_kubernetes_rpm
      failed_when: identity_python_kubernetes_rpm.stdout != identity_lock.python_kubernetes_rpm
      when: identity_controller_manage_python_kubernetes | bool

    - name: Reject an unapproved standalone identity database cutover
      kubernetes.core.k8s_info:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        api_version: "{{ item.api }}"
        kind: "{{ item.kind }}"
        namespace: "{{ identity_namespace }}"
        name: identity-postgres
      loop:
        - {api: apps/v1, kind: StatefulSet}
        - {api: v1, kind: Service}
      register: identity_legacy_database

    - name: Require an explicit identity database data cutover window
      ansible.builtin.assert:
        that:
          - identity_legacy_database.results | map(attribute='resources') | flatten | length == 0
        fail_msg: IDENTITY_CNPG_CUTOVER_REQUIRED_NO_AUTOMATIC_DATA_DELETION

    - name: Create the restricted identity namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ identity_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/warn: restricted

    - name: Reconcile time-limited operator credential RBAC
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'operator-rbac.yml.j2') | from_yaml_all | list }}"

    - name: Apply the namespace-scoped internal CA chain
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'pki.yml.j2') | from_yaml_all | list }}"

    - name: Wait for the root and serving certificates
      ansible.builtin.command:
        argv:
          - "{{ identity_kubectl_path }}"
          - --kubeconfig
          - "{{ identity_kubeconfig_path }}"
          - -n
          - "{{ identity_namespace }}"
          - wait
          - "certificate/{{ item }}"
          - --for=condition=Ready
          - --timeout=5m
      changed_when: false
      loop: [identity-root-ca, keycloak-internal]

    - name: Read the public identity CA certificate
      kubernetes.core.k8s_info:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        api_version: v1
        kind: Secret
        namespace: "{{ identity_namespace }}"
        name: "{{ identity_ca_secret_name }}"
      register: identity_ca_secret
      no_log: true

    - name: Reject an incomplete identity CA authority
      ansible.builtin.assert:
        that:
          - identity_ca_secret.resources | length == 1
          - identity_ca_secret.resources[0].data['tls.crt'] | default('') | length > 0
        fail_msg: IDENTITY_CA_AUTHORITY_INVALID
      no_log: true

    - name: Publish the public identity CA bundle for infrastructure consumers
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ identity_ca_bundle_configmap_name }}"
            namespace: "{{ identity_namespace }}"
            labels:
              app.kubernetes.io/part-of: labweaver-infrastructure
              labweaver.io/authority: identity-ca
          data:
            ca.crt: "{{ identity_ca_secret.resources[0].data['tls.crt'] | b64decode }}"
      no_log: true

    - name: Install identity database and bootstrap credentials from the root-only locator
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "{{ item.name }}", namespace: "{{ identity_namespace }}"}
          type: "{{ item.type | default('Opaque') }}"
          stringData: "{{ item.data }}"
      loop:
        - name: "{{ identity_database_secret_name }}"
          type: kubernetes.io/basic-auth
          data: {username: keycloak, password: "{{ identity_secrets.database_password }}"}
        - {name: "{{ identity_bootstrap_secret_name }}", data: {username: platform-bootstrap, password: "{{ identity_secrets.bootstrap_admin_password }}"}}
        - name: identity-backup-secrets
          data:
            access-key: "{{ identity_secrets.backup_access_key }}"
            secret-key: "{{ identity_secrets.backup_secret_key }}"
            ca.crt: "{{ identity_secrets.backup_ca_crt }}"
      no_log: true

    - name: Install identity service client credentials from the root-only locator
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.secret_name }}"
            namespace: "{{ identity_namespace }}"
          type: Opaque
          stringData:
            client-id: "{{ item.client_id }}"
            client-secret: "{{ identity_secrets.service_client_secrets[item.secret_key] }}"
            audience: "{{ item.audience }}"
      loop: "{{ identity_service_clients }}"
      loop_control:
        label: "{{ item.client_id }}"
      no_log: true

    - name: Apply identity network policies before database bootstrap
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'policy.yml.j2') | from_yaml_all | list }}"

    - name: Apply the independent identity CNPG cluster and backup configuration
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'database.yml.j2') | from_yaml_all | list }}"

    - name: Wait for the identity database primary and replicas before starting Keycloak
      ansible.builtin.command:
        argv:
          - "{{ identity_kubectl_path }}"
          - --kubeconfig
          - "{{ identity_kubeconfig_path }}"
          - -n
          - "{{ identity_namespace }}"
          - wait
          - cluster/identity-postgres
          - --for=condition=Ready
          - --timeout=15m
      changed_when: false

    - name: Apply Keycloak workloads after the identity database is ready
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'workloads.yml.j2') | from_yaml_all | list }}"

    - name: Wait for identity workloads
      ansible.builtin.command:
        argv:
          - "{{ identity_kubectl_path }}"
          - --kubeconfig
          - "{{ identity_kubeconfig_path }}"
          - -n
          - "{{ identity_namespace }}"
          - rollout
          - status
          - "{{ item }}"
          - --timeout=15m
      changed_when: false
      loop: ["deployment/{{ identity_name }}"]

    - name: Provision the LabWeaver service OIDC clients and roles
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'provision-job.yml.j2') | from_yaml }}"

    - name: Wait for workload client provisioning
      ansible.builtin.command:
        argv:
          - "{{ identity_kubectl_path }}"
          - --kubeconfig
          - "{{ identity_kubeconfig_path }}"
          - -n
          - "{{ identity_namespace }}"
          - wait
          - "job/identity-provision-{{ identity_run_suffix }}"
          - --for=condition=Complete
          - "--timeout={{ (identity_provision_job_active_deadline_seconds | int) + 300 }}s"
      changed_when: false

    - name: Apply the internal Gateway
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', item) | from_yaml_all | list }}"
      loop: [gateway.yml.j2]

    - name: Read existing Keycloak DNS records
      ansible.builtin.command:
        argv: [grep, -R, --fixed-strings, "{{ identity_hostname }}", /etc/dnsmasq.conf, /etc/dnsmasq.d]
      delegate_to: "{{ groups['routers'][0] }}"
      become: true
      changed_when: false
      failed_when: false
      register: identity_dns_records
      when: identity_dnsmasq_enabled | bool

    - name: Reject a Keycloak DNS collision outside the owned fragment
      ansible.builtin.assert:
        that: >-
          identity_dns_records.rc != 0 or
          (identity_dns_records.stdout_lines | reject('search', identity_dns_fragment_path) | list | length == 0)
        fail_msg: IDENTITY_DNS_CONFLICT
      when: identity_dnsmasq_enabled | bool

    - name: Install the Keycloak-only DNS fragment with rollback
      when: identity_dnsmasq_enabled | bool
      block:
        - name: Inspect the previous Keycloak DNS fragment
          ansible.builtin.stat:
            path: "{{ identity_dns_fragment_path }}"
          delegate_to: "{{ groups['routers'][0] }}"
          become: true
          register: identity_dns_fragment_stat

        - name: Back up the previous Keycloak DNS fragment
          ansible.builtin.copy:
            src: "{{ identity_dns_fragment_path }}"
            dest: /var/tmp/labweaver-keycloak-dns.conf.backup
            remote_src: true
            owner: root
            group: root
            mode: '0600'
          delegate_to: "{{ groups['routers'][0] }}"
          become: true
          when: identity_dns_fragment_stat.stat.exists

        - name: Write the Keycloak-only DNS fragment
          ansible.builtin.template:
            src: dnsmasq-keycloak.conf.j2
            dest: "{{ identity_dns_fragment_path }}"
            owner: root
            group: root
            mode: '0644'
          delegate_to: "{{ groups['routers'][0] }}"
          become: true

        - name: Validate dnsmasq before applying Keycloak DNS
          ansible.builtin.command: /usr/sbin/dnsmasq --test
          delegate_to: "{{ groups['routers'][0] }}"
          become: true
          changed_when: false

        - name: Restart dnsmasq after successful validation
          ansible.builtin.service: {name: dnsmasq, state: restarted}
          delegate_to: "{{ groups['routers'][0] }}"
          become: true
      rescue:
        - name: Restore the previous Keycloak DNS fragment
          ansible.builtin.copy:
            src: /var/tmp/labweaver-keycloak-dns.conf.backup
            dest: "{{ identity_dns_fragment_path }}"
            remote_src: true
            owner: root
            group: root
            mode: '0644'
          delegate_to: "{{ groups['routers'][0] }}"
          become: true
          when: identity_dns_fragment_stat.stat.exists | default(false)

        - name: Remove the newly introduced invalid DNS fragment
          ansible.builtin.file: {path: "{{ identity_dns_fragment_path }}", state: absent}
          delegate_to: "{{ groups['routers'][0] }}"
          become: true
          when: not (identity_dns_fragment_stat.stat.exists | default(false))

        - name: Restore dnsmasq after rollback
          ansible.builtin.service: {name: dnsmasq, state: restarted}
          delegate_to: "{{ groups['routers'][0] }}"
          become: true

        - name: Stop after failed Keycloak DNS validation
          ansible.builtin.fail: {msg: IDENTITY_DNS_VALIDATION_FAILED}

- name: Apply only the reviewed organization-directory reader mapping
  when:
    - not (identity_foundation_verify_only | bool)
    - identity_foundation_realm_roles_only | bool
  block:
    - name: Require the existing Keycloak workload before role-only provisioning
      ansible.builtin.command:
        argv:
          - "{{ identity_kubectl_path }}"
          - --kubeconfig
          - "{{ identity_kubeconfig_path }}"
          - -n
          - "{{ identity_namespace }}"
          - rollout
          - status
          - "deployment/{{ identity_name }}"
          - --timeout=5m
      changed_when: false

    - name: Create the restricted organization-directory role provisioning Job
      kubernetes.core.k8s:
        kubeconfig: "{{ identity_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'provision-job.yml.j2') | from_yaml }}"

    - name: Wait for organization-directory role provisioning
      ansible.builtin.command:
        argv:
          - "{{ identity_kubectl_path }}"
          - --kubeconfig
          - "{{ identity_kubeconfig_path }}"
          - -n
          - "{{ identity_namespace }}"
          - wait
          - "job/identity-provision-{{ identity_run_suffix }}"
          - --for=condition=Complete
          - "--timeout={{ (identity_provision_job_active_deadline_seconds | int) + 300 }}s"
      changed_when: false

- name: Wait for the identity Gateway
  ansible.builtin.command:
    argv:
      - "{{ identity_kubectl_path }}"
      - --kubeconfig
      - "{{ identity_kubeconfig_path }}"
      - -n
      - "{{ identity_namespace }}"
      - wait
      - gateway/identity-gateway
      - --for=condition=Programmed
      - --timeout=5m
  changed_when: false
  when: not (identity_foundation_realm_roles_only | bool)

- name: Verify the exact OIDC issuer over the internal CA
  ansible.builtin.shell: |
    set -euo pipefail
    ca_file=$(mktemp)
    trap 'rm -f "$ca_file"' EXIT
    {{ identity_kubectl_path }} \
      --kubeconfig {{ identity_kubeconfig_path | quote }} \
      -n {{ identity_namespace | quote }} get secret {{ identity_ca_secret_name | quote }} \
      -o jsonpath='{.data.tls\.crt}' | base64 -d > "$ca_file"
    curl --fail --silent --show-error --cacert "$ca_file" \
      --resolve {{ identity_hostname }}:443:{{ identity_gateway_vip }} \
      https://{{ identity_hostname }}/realms/{{ identity_realm }}/.well-known/openid-configuration \
      | grep -F '"issuer":"https://{{ identity_hostname }}/realms/{{ identity_realm }}"' >/dev/null
  args: {executable: /bin/bash}
  changed_when: false
  when: not (identity_foundation_realm_roles_only | bool)

# The browser reaches the advertised issuer through the public entry, whose TLS
# certificate comes from the public issuer rather than the identity CA, so this
# check uses the system trust store. It proves the hostname a user's browser is
# redirected to actually serves the configured issuer.
- name: Verify the exact OIDC issuer through the public entry
  ansible.builtin.shell: |
    set -euo pipefail
    curl --fail --silent --show-error \
      --resolve {{ identity_hostname }}:443:{{ identity_public_address }} \
      https://{{ identity_hostname }}/realms/{{ identity_realm }}/.well-known/openid-configuration \
      | grep -F '"issuer":"https://{{ identity_hostname }}/realms/{{ identity_realm }}"' >/dev/null
  args: {executable: /bin/bash}
  changed_when: false
  when:
    - identity_public_address | length > 0
    - not (identity_foundation_realm_roles_only | bool)

- name: Verify every service token identity without exposing credentials or tokens
  ansible.builtin.shell: |
    set -euo pipefail
    work_dir=$(mktemp -d)
    trap 'rm -rf "$work_dir"' EXIT
    chmod 0700 "$work_dir"
    {{ identity_kubectl_path }} \
      --kubeconfig {{ identity_kubeconfig_path | quote }} \
      -n {{ identity_namespace | quote }} get secret {{ identity_ca_secret_name | quote }} \
      -o jsonpath='{.data.tls\.crt}' | base64 -d > "$work_dir/ca.crt"
    {% for client in identity_service_clients %}
    {{ identity_kubectl_path }} \
      --kubeconfig {{ identity_kubeconfig_path | quote }} \
      -n {{ identity_namespace | quote }} get secret {{ client.secret_name | quote }} \
      -o jsonpath='{.data.client-secret}' | base64 -d > "$work_dir/client-secret-{{ client.client_id }}"
    chmod 0600 "$work_dir/client-secret-{{ client.client_id }}"
    {
      printf 'url = "https://{{ identity_hostname }}/realms/{{ identity_realm }}/protocol/openid-connect/token"\n'
      printf 'cacert = "%s"\n' "$work_dir/ca.crt"
      printf 'resolve = "{{ identity_hostname }}:443:{{ identity_gateway_vip }}"\n'
      printf 'request = "POST"\n'
      printf 'data = "grant_type=client_credentials"\n'
      printf 'data = "client_id={{ client.client_id }}"\n'
      printf 'data = "client_secret=%s"\n' "$(cat "$work_dir/client-secret-{{ client.client_id }}")"
      printf 'fail\n silent\n show-error\n'
    } > "$work_dir/curl-{{ client.client_id }}.conf"
    chmod 0600 "$work_dir/curl-{{ client.client_id }}.conf"
    curl --config "$work_dir/curl-{{ client.client_id }}.conf" > "$work_dir/token-{{ client.client_id }}.json"
    python3 - "$work_dir/token-{{ client.client_id }}.json" <<'PY'
    import base64
    import json
    import pathlib
    import sys

    token = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))["access_token"]
    payload = token.split(".")[1]
    payload += "=" * (-len(payload) % 4)
    claims = json.loads(base64.urlsafe_b64decode(payload))
    audience = claims.get("aud", [])
    if isinstance(audience, str):
        audience = [audience]
    expected_audiences = [
    {% for assignment in identity_service_role_assignments if assignment.caller == client.client_id %}
        "{{ identity_service_clients
           | selectattr('client_id', 'equalto', assignment.target)
           | map(attribute='audience')
           | first }}"{% if not loop.last %},{% endif %}
    {% endfor %}
    ]
    expected = {
        "iss": "https://{{ identity_hostname }}/realms/{{ identity_realm }}",
        "azp": "{{ client.client_id }}",
        "preferred_username": "service-account-{{ client.client_id }}",
    }
    if any(claims.get(key) != value for key, value in expected.items()):
        raise SystemExit(2)
    if not expected_audiences or any(expected not in audience for expected in expected_audiences):
        raise SystemExit(3)
    PY
    {% endfor %}
  args: {executable: /bin/bash}
  register: identity_token_claims_check
  changed_when: false
  failed_when: false
  no_log: true
  when: not (identity_foundation_realm_roles_only | bool)

- name: Reject an invalid service token identity
  ansible.builtin.assert:
    that: identity_token_claims_check.rc == 0
    fail_msg: IDENTITY_TOKEN_CLAIMS_INVALID
  no_log: true
  when: not (identity_foundation_realm_roles_only | bool)

- name: Create the root-only identity manifest directory
  ansible.builtin.file:
    path: "{{ identity_manifest_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: not (identity_foundation_realm_roles_only | bool)

- name: Publish the sanitized identity deployment manifest
  ansible.builtin.template:
    src: deployment-manifest.json.j2
    dest: "{{ identity_manifest_directory }}/IdentityFoundationDeploymentManifest.json"
    owner: root
    group: root
    mode: '0600'
  when: not (identity_foundation_realm_roles_only | bool)
