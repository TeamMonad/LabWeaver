---
identity_foundation_enabled: false
identity_foundation_verify_only: false
identity_namespace: keycloak-system # noqa: var-naming[no-role-prefix]
identity_name: labweaver-keycloak # noqa: var-naming[no-role-prefix]
identity_hostname: keycloak.labweaver.internal # noqa: var-naming[no-role-prefix]
identity_gateway_vip: 10.20.0.222 # noqa: var-naming[no-role-prefix]
identity_gateway_class: cilium # noqa: var-naming[no-role-prefix]
# Management subnet allowed to reach Keycloak directly and through the identity
# NetworkPolicy (identity-allow ingress). This covers the edge-router LAN for
# RHEL controllers and the v1 campus subnet for the Ubuntu cluster.
identity_admin_allowed_cidr: 10.20.0.0/16 # noqa: var-naming[no-role-prefix]
# Platform namespaces allowed to reach Keycloak from inside the cluster
# (identity-allow ingress + identity-gateway-ingress CNP). Leave empty for a
# demo/minimal deployment; production stacks must include labweaver-system.
identity_allow_platform_namespaces: [] # noqa: var-naming[no-role-prefix]
identity_realm: workloads # noqa: var-naming[no-role-prefix]
# Every LabWeaver service has one confidential client.  The client ID is also
# the audience used by that service's inbound verifier.  Secrets are supplied
# through the root-only locator and are copied into namespace-local Secrets;
# this role never invents or logs credentials.
identity_service_clients: # noqa: var-naming[no-role-prefix]
  - client_id: labweaver-access
    audience: labweaver-access
    secret_name: labweaver-access-client
    secret_key: access-client-secret
  - client_id: labweaver-agent
    audience: labweaver-agent
    secret_name: labweaver-agent-client
    secret_key: agent-client-secret
  - client_id: labweaver-control
    audience: labweaver-control
    secret_name: labweaver-control-client
    secret_key: control-client-secret
  - client_id: labweaver-environment
    audience: labweaver-environment
    secret_name: labweaver-environment-client
    secret_key: environment-client-secret
  - client_id: labweaver-evaluation
    audience: labweaver-evaluation
    secret_name: labweaver-evaluation-client
    secret_key: evaluation-client-secret
  - client_id: labweaver-resource
    audience: labweaver-resource
    secret_name: labweaver-resource-client
    secret_key: resource-client-secret
# Roles are client roles on the target audience.  Each assignment grants the
# named caller only the routes it actually invokes.
identity_service_role_assignments: # noqa: var-naming[no-role-prefix]
  - caller: labweaver-access
    target: labweaver-control
    roles: [access.control.forward]
  - caller: labweaver-access
    target: labweaver-environment
    roles: [access.environment.forward, access.environment.console, environment.owner.resolve, environment.endpoint.resolve, environment.console.resolve]
  - caller: labweaver-access
    target: labweaver-evaluation
    roles: [evaluation.api.invoke]
  - caller: labweaver-access
    target: labweaver-resource
    roles: [resource.api.invoke]
  - caller: labweaver-control
    target: labweaver-access
    roles: [access.authorization.decide]
  - caller: labweaver-control
    target: labweaver-agent
    roles: [agent.control.invoke]
  - caller: labweaver-control
    target: labweaver-environment
    roles: [environment.work.read]
  - caller: labweaver-control
    target: labweaver-evaluation
    roles: [evaluation.control.invoke]
  - caller: labweaver-environment
    target: labweaver-control
    roles: [control.agent_run.read]
  - caller: labweaver-evaluation
    target: labweaver-control
    roles: [control.authoring.read, control.llm_policy.read]
  - caller: labweaver-evaluation
    target: labweaver-environment
    roles: [evaluation.environment.freeze, environment:resolve_evaluation_execution_binding]
  - caller: labweaver-agent
    target: labweaver-environment
    roles: [environment.work.configure, environment:resolve_work_execution_binding]
  - caller: labweaver-evaluation
    target: labweaver-resource
    roles:
      - resource.task.create
      - resource.task.read
      - resource.task.claim
      - resource.task.ack
      - resource.task.release
      - resource.task.cancel
      - resource.usage.record
  - caller: labweaver-evaluation
    target: labweaver-agent
    roles: [agent.llm_review.create, agent.llm_review.read, agent.llm_review.cancel]
  - caller: labweaver-resource
    target: labweaver-environment
    roles: [resource.environment.manage]
  - caller: labweaver-environment
    target: labweaver-resource
    roles: [resource.usage.record]
  - caller: labweaver-environment
    target: labweaver-environment
    roles: [environment.console.execute]
  # The gateway is an access ingress workload.  It uses the access client for
  # the access-only audience and is therefore not an additional Keycloak
  # client.
  - caller: labweaver-access
    target: labweaver-access
    roles: [access.authorization.decide, access.metrics.read, access.ssh.authorize, access.session.manage]
  - caller: labweaver-evaluation
    target: labweaver-evaluation
    roles: [evaluation.step.complete]
identity_secret_locator_sha256: sha256:REPLACE_IDENTITY_SECRET_LOCATOR_SHA256 # noqa: var-naming[no-role-prefix]
identity_storage_class: local-path # noqa: var-naming[no-role-prefix]
identity_postgres_storage: 20Gi # noqa: var-naming[no-role-prefix]
identity_keycloak_replicas: 2 # noqa: var-naming[no-role-prefix]
identity_manifest_directory: /var/lib/labweaver/identity/manifests # noqa: var-naming[no-role-prefix]
identity_kubeconfig_path: /etc/kubernetes/admin.conf # noqa: var-naming[no-role-prefix]
identity_kubectl_path: /usr/bin/kubectl # noqa: var-naming[no-role-prefix]
identity_dns_fragment_path: /etc/dnsmasq.d/30-keycloak.conf # noqa: var-naming[no-role-prefix]
identity_ca_secret_name: labweaver-identity-root-ca # noqa: var-naming[no-role-prefix]
identity_ca_bundle_configmap_name: labweaver-identity-ca-bundle # noqa: var-naming[no-role-prefix]
identity_tls_secret_name: labweaver-keycloak-tls # noqa: var-naming[no-role-prefix]
identity_database_secret_name: labweaver-keycloak-database # noqa: var-naming[no-role-prefix]
identity_bootstrap_secret_name: labweaver-keycloak-bootstrap # noqa: var-naming[no-role-prefix]
# v1-style controllers have no dnsmasq; the Keycloak endpoint is resolved by
# Gateway VIP + curl --resolve during verification. RHEL routers keep the
# fragment-based DNS path enabled.
identity_dnsmasq_enabled: true # noqa: var-naming[no-role-prefix]
# RHEL controllers install the locked python3-kubernetes RPM; Debian-family
# controllers already run the pinned client from the ansible venv.
identity_controller_manage_python_kubernetes: true # noqa: var-naming[no-role-prefix]
