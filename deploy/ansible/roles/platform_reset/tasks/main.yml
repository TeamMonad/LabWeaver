---
- name: Validate destructive reset inputs
  ansible.builtin.assert:
    that:
      - platform_reset_run_id is match('^[a-z0-9][a-z0-9-]{2,62}$')
      - platform_reset_source_commit is match('^[0-9a-f]{40,64}$')
      - platform_reset_postgres_service_file | length > 0
      - platform_reset_nats_server | length > 0
      - platform_reset_nats_credentials_file | length > 0
      - platform_reset_minio_alias | length > 0
      - platform_reset_buildkit_address | length > 0
      - platform_reset_harbor_api | length > 0
      - platform_reset_harbor_username | length > 0
      - platform_reset_harbor_password | length > 0
      - platform_reset_keycloak_config | length > 0
      - platform_reset_keycloak_server | length > 0
      - platform_reset_keycloak_username | length > 0
      - platform_reset_keycloak_password | length > 0
      - platform_reset_keycloak_realm_file | length > 0
      - platform_reset_access_seed_file | length > 0
      - platform_reset_values_files | length > 0
      - platform_reset_rollback_probe_values_file | length > 0
      - platform_reset_configuration_bundle | length > 0
    fail_msg: PLATFORM_RESET_INPUT_INVALID

- name: Validate reset tools and controlled inputs
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ platform_reset_kubeconfig }}"
    - "{{ platform_reset_kubectl }}"
    - "{{ platform_reset_helm }}"
    - "{{ platform_reset_psql }}"
    - "{{ platform_reset_nats }}"
    - "{{ platform_reset_mc }}"
    - "{{ platform_reset_kcadm }}"
    - "{{ platform_reset_buildctl }}"
    - "{{ platform_reset_postgres_service_file }}"
    - "{{ platform_reset_nats_credentials_file }}"
    - "{{ platform_reset_keycloak_config }}"
  register: platform_reset_remote_required_paths

- name: Validate controller-owned reviewed inputs
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: >-
    {{ [platform_reset_chart_source, platform_reset_migration_catalog,
        platform_reset_configuration_manifest,
        platform_reset_keycloak_realm_file,
        platform_reset_access_seed_file,
        platform_reset_rollback_probe_values_file,
        platform_reset_configuration_bundle] + platform_reset_values_files }}
  register: platform_reset_controller_required_paths
  delegate_to: localhost
  become: false

- name: Reject missing reset tools or inputs
  ansible.builtin.assert:
    that:
      - platform_reset_remote_required_paths.results | map(attribute='stat.exists') | min
      - platform_reset_controller_required_paths.results | map(attribute='stat.exists') | min
    fail_msg: PLATFORM_RESET_REQUIRED_PATH_MISSING

- name: Hash the reviewed migration catalog
  ansible.builtin.stat:
    path: "{{ platform_reset_migration_catalog }}"
    checksum_algorithm: sha256
  register: platform_reset_migration_catalog_stat
  delegate_to: localhost
  become: false

- name: Hash the reviewed workload configuration bundle
  ansible.builtin.stat:
    path: "{{ platform_reset_configuration_bundle }}"
    checksum_algorithm: sha256
  register: platform_reset_configuration_bundle_stat
  delegate_to: localhost
  become: false

- name: Hash the reviewed workload configuration manifest
  ansible.builtin.stat:
    path: "{{ platform_reset_configuration_manifest }}"
    checksum_algorithm: sha256
  register: platform_reset_configuration_manifest_stat
  delegate_to: localhost
  become: false

- name: Parse the private Access identity seed
  ansible.builtin.set_fact:
    platform_reset_access_seed: >-
      {{ lookup('ansible.builtin.file', platform_reset_access_seed_file) | from_json }}
  no_log: true

- name: Validate the private Access identity seed boundary
  ansible.builtin.assert:
    that:
      - platform_reset_access_seed.apiVersion == 'deploy.labweaver.io/platform-access-seed/v1'
      - platform_reset_access_seed.courseMemberships | length >= 2
      - platform_reset_access_actor_ids | unique | length == platform_reset_access_actor_ids | length
      - platform_reset_access_subject_hashes | unique | length == platform_reset_access_subject_hashes | length
    fail_msg: PLATFORM_ACCESS_SEED_INVALID
  vars:
    platform_reset_access_actor_ids: >-
      {{ platform_reset_access_seed.courseMemberships | map(attribute='actorId') | list }}
    platform_reset_access_subject_hashes: >-
      {{ platform_reset_access_seed.courseMemberships | map(attribute='subjectSha256') | list }}
  no_log: true

- name: Validate every private Access membership seed
  ansible.builtin.assert:
    that:
      - item.actorId is match('^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
      - item.courseId is match('^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
      - item.subjectSha256 is match('^[0-9a-f]{64}$')
      - item.issuer is match('^https://[A-Za-z0-9._:/-]{1,512}$')
      - item.role in ['teacher', 'student', 'platform_admin']
    fail_msg: PLATFORM_ACCESS_MEMBERSHIP_INVALID
  loop: "{{ platform_reset_access_seed.courseMemberships }}"
  no_log: true

- name: Parse the reviewed workload configuration manifest
  ansible.builtin.set_fact:
    platform_reset_configuration_manifest_value: >-
      {{ lookup('ansible.builtin.file', platform_reset_configuration_manifest)
         | from_json }}

- name: Parse the reviewed workload configuration bundle
  ansible.builtin.set_fact:
    platform_reset_configuration_objects: >-
      {{ lookup('ansible.builtin.file', platform_reset_configuration_bundle)
         | from_yaml_all | list }}
  no_log: true

- name: Validate the workload configuration bundle boundary
  ansible.builtin.assert:
    that:
      - platform_reset_configuration_objects | length == (platform_reset_required_configmaps | length + platform_reset_required_secrets | length)
      - platform_reset_configuration_objects | map(attribute='apiVersion') | unique | list == ['v1']
      - platform_reset_configuration_objects | map(attribute='kind') | difference(['ConfigMap', 'Secret']) | length == 0
      - platform_reset_configuration_objects | map(attribute='metadata.namespace') | unique | list == [platform_reset_namespace]
      - platform_reset_configuration_manifest_value.apiVersion == 'deploy.labweaver.io/platform-bundle-manifest/v1'
      - platform_reset_configuration_manifest_value.namespace == platform_reset_namespace
      - platform_reset_configuration_manifest_value.configMaps.keys() | sort == platform_reset_required_configmaps | sort
      - platform_reset_configuration_manifest_value.secrets.keys() | sort == platform_reset_required_secrets | sort
      - >-
        platform_reset_configuration_objects
        | selectattr('kind', 'equalto', 'ConfigMap')
        | map(attribute='metadata.name') | sort
        == platform_reset_required_configmaps | sort
      - >-
        platform_reset_configuration_objects
        | selectattr('kind', 'equalto', 'Secret')
        | map(attribute='metadata.name') | sort
        == platform_reset_required_secrets | sort
    fail_msg: PLATFORM_CONFIGURATION_BUNDLE_INVALID
  no_log: true

- name: Validate every workload configuration key against the manifest
  ansible.builtin.assert:
    that:
      - item.data is defined
      - item.stringData is not defined
      - item.binaryData is not defined
      - item.data.keys() | sort == platform_reset_expected_configuration_keys | sort
      - item.kind != 'Secret' or item.type == 'Opaque'
    fail_msg: PLATFORM_CONFIGURATION_BUNDLE_KEYS_INVALID
  vars:
    platform_reset_expected_configuration_keys: >-
      {{ (platform_reset_configuration_manifest_value.configMaps
          if item.kind == 'ConfigMap'
          else platform_reset_configuration_manifest_value.secrets)[item.metadata.name] }}
  loop: "{{ platform_reset_configuration_objects }}"
  no_log: true

- name: Read target cluster UID
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kubectl }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - get
      - namespace
      - kube-system
      - -o
      - jsonpath={.metadata.uid}
  register: platform_reset_cluster_uid
  changed_when: false

- name: Bind confirmation to the exact cluster and reset run
  ansible.builtin.assert:
    that:
      - platform_reset_cluster_uid.stdout | trim | length > 0
      - platform_reset_confirmation == 'destroy-pre-release-data:' + (platform_reset_cluster_uid.stdout | trim) + ':' + platform_reset_run_id
    fail_msg: PLATFORM_RESET_CONFIRMATION_MISMATCH

- name: Probe PostgreSQL before any destructive action
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_psql }}"
      - service={{ platform_reset_postgres_service }}
      - --no-psqlrc
      - --tuples-only
      - --command
      - SELECT 1
  environment:
    PGSERVICEFILE: "{{ platform_reset_postgres_service_file }}"
  changed_when: false
  no_log: true

- name: Probe JetStream before any destructive action
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_nats }}"
      - --server
      - "{{ platform_reset_nats_server }}"
      - --creds
      - "{{ platform_reset_nats_credentials_file }}"
      - account
      - info
      - --json
  changed_when: false
  no_log: true

- name: Probe MinIO before any destructive action
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_mc }}"
      - ls
      - "{{ platform_reset_minio_alias }}"
      - --json
  changed_when: false
  no_log: true

- name: Probe BuildKit before any destructive action
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_buildctl }}"
      - --addr
      - "{{ platform_reset_buildkit_address }}"
      - debug
      - workers
  changed_when: false

- name: Probe Harbor before any destructive action
  ansible.builtin.uri:
    url: "{{ platform_reset_harbor_api }}/api/v2.0/systeminfo"
    user: "{{ platform_reset_harbor_username }}"
    password: "{{ platform_reset_harbor_password }}"
    force_basic_auth: true
    status_code: 200
    return_content: false
  no_log: true

- name: Authenticate Keycloak administration before any destructive action
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kcadm }}"
      - config
      - credentials
      - --server
      - "{{ platform_reset_keycloak_server }}"
      - --realm
      - "{{ platform_reset_keycloak_admin_realm }}"
      - --user
      - "{{ platform_reset_keycloak_username }}"
      - --password
      - "{{ platform_reset_keycloak_password }}"
      - --config
      - "{{ platform_reset_keycloak_config }}"
  changed_when: false
  no_log: true

- name: Create protected reset report directory
  ansible.builtin.file:
    path: "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inventory Helm releases without secret values
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_helm }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - list
      - --all-namespaces
      - --output
      - json
  register: platform_reset_helm_inventory
  changed_when: false

- name: Inventory Kyverno cluster policies
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kubectl }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - get
      - clusterpolicies.kyverno.io
      - -o
      - json
      - --ignore-not-found
  register: platform_reset_cluster_policies
  changed_when: false

- name: Inventory namespaced Kyverno policies
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kubectl }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - get
      - policies.kyverno.io
      - --all-namespaces
      - -o
      - json
      - --ignore-not-found
  register: platform_reset_namespaced_policies
  changed_when: false

- name: Derive the conservative Kyverno dependency inventory
  ansible.builtin.set_fact:
    platform_reset_cluster_policy_items: "{{ (platform_reset_cluster_policies.stdout | default('{\"items\":[]}') | from_json).items | default([]) }}"
    platform_reset_namespaced_policy_items: "{{ (platform_reset_namespaced_policies.stdout | default('{\"items\":[]}') | from_json).items | default([]) }}"

- name: Block removal when Kyverno has unowned dependencies
  ansible.builtin.assert:
    that:
      - platform_reset_cluster_policy_items | length == 0
      - >-
        platform_reset_namespaced_policy_items
        | rejectattr('metadata.namespace', 'in', platform_reset_namespaces)
        | list | length == 0
    fail_msg: KYVERNO_EXTERNAL_DEPENDENCY_DETECTED

- name: Persist the pre-destruction inventory
  ansible.builtin.copy:
    dest: "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/inventory.json"
    owner: root
    group: root
    mode: "0600"
    content: >-
      {{ {'schema_version': 'labweaver.platform-reset-inventory.v1',
          'run_id': platform_reset_run_id,
          'cluster_uid': platform_reset_cluster_uid.stdout | trim,
          'helm_releases': platform_reset_helm_inventory.stdout | from_json,
          'cluster_policy_names': platform_reset_cluster_policy_items | map(attribute='metadata.name') | list,
          'namespaced_policy_names': platform_reset_namespaced_policy_items | map(attribute='metadata.name') | list}
         | to_nice_json }}

- name: Uninstall the historical Private Sigstore release
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_helm }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - uninstall
      - private-sigstore
      - --namespace
      - sigstore-system
      - --ignore-not-found
      - --wait
  register: platform_reset_sigstore_uninstall
  changed_when: platform_reset_sigstore_uninstall.rc == 0

- name: Delete the historical Private Sigstore namespace and storage
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kubectl }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - delete
      - namespace
      - sigstore-system
      - --ignore-not-found=true
      - --wait=true
      - --timeout=10m
  register: platform_reset_sigstore_delete
  changed_when: "'deleted' in platform_reset_sigstore_delete.stdout"

- name: Uninstall the Kyverno release after dependency validation
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_helm }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - uninstall
      - kyverno
      - --namespace
      - kyverno
      - --ignore-not-found
      - --wait
  register: platform_reset_kyverno_uninstall
  changed_when: platform_reset_kyverno_uninstall.rc == 0

- name: Delete the Kyverno namespace
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kubectl }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - delete
      - namespace
      - kyverno
      - --ignore-not-found=true
      - --wait=true
      - --timeout=10m
  register: platform_reset_kyverno_delete
  changed_when: "'deleted' in platform_reset_kyverno_delete.stdout"

- name: Discover residual Kyverno CRDs
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kubectl }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - get
      - customresourcedefinitions.apiextensions.k8s.io
      - -o
      - json
  register: platform_reset_crds
  changed_when: false

- name: Derive exact residual Kyverno CRD names
  ansible.builtin.set_fact:
    platform_reset_kyverno_crd_names: >-
      {{ (platform_reset_crds.stdout | from_json).items
         | selectattr('spec.group', 'equalto', 'kyverno.io')
         | map(attribute='metadata.name') | list }}

- name: Delete exact residual Kyverno CRDs
  ansible.builtin.command:
    argv: >-
      {{ [platform_reset_kubectl, '--kubeconfig', platform_reset_kubeconfig,
          'delete', 'customresourcedefinitions.apiextensions.k8s.io']
          + platform_reset_kyverno_crd_names + ['--wait=true', '--timeout=10m'] }}
  when: platform_reset_kyverno_crd_names | length > 0
  changed_when: true

- name: Discover residual Kyverno admission webhooks
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kubectl }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - get
      - validatingwebhookconfigurations,mutatingwebhookconfigurations
      - -o
      - json
  register: platform_reset_webhooks
  changed_when: false

- name: Reject residual Kyverno admission webhooks
  ansible.builtin.assert:
    that: >-
      (platform_reset_webhooks.stdout | from_json).items
      | selectattr('metadata.name', 'search', 'kyverno') | list | length == 0
    fail_msg: KYVERNO_ADMISSION_WEBHOOK_REMAINS

- name: Delete exact LabWeaver namespaces and their pre-release data
  ansible.builtin.command:
    argv: >-
      {{ [platform_reset_kubectl, '--kubeconfig', platform_reset_kubeconfig,
          'delete', 'namespace'] + platform_reset_namespaces
          + ['--ignore-not-found=true', '--wait=true', '--timeout=15m'] }}
  register: platform_reset_namespace_delete
  changed_when: platform_reset_namespace_delete.stdout | length > 0

- name: Recreate exact LabWeaver namespace topology
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kubectl }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - create
      - namespace
      - "{{ item }}"
  loop: "{{ platform_reset_namespaces }}"
  register: platform_reset_namespace_create
  changed_when: true

- name: Label recreated namespaces as reset-owned
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kubectl }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - label
      - namespace
      - "{{ item }}"
      - labweaver.io/managed=true
      - "labweaver.io/reset-run={{ platform_reset_run_id }}"
      - --overwrite
  loop: "{{ platform_reset_namespaces }}"
  changed_when: true

- name: Apply the reviewed workload configuration bundle
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_reset_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  loop: "{{ platform_reset_configuration_objects }}"
  no_log: true

- name: Render the six-domain destructive database baseline
  ansible.builtin.template:
    src: baseline.sql.j2
    dest: "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/baseline.sql"
    owner: root
    group: root
    mode: "0600"

- name: Apply the six-domain destructive database baseline
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_psql }}"
      - service={{ platform_reset_postgres_service }}
      - --file
      - "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/baseline.sql"
  environment:
    PGSERVICEFILE: "{{ platform_reset_postgres_service_file }}"
  register: platform_reset_postgres_apply
  changed_when: true
  no_log: true

- name: Render reviewed Access service identities and demo memberships
  ansible.builtin.template:
    src: access-seed.sql.j2
    dest: "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/access-seed.sql"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Apply reviewed Access service identities and demo memberships
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_psql }}"
      - service={{ platform_reset_postgres_service }}
      - --no-psqlrc
      - --file
      - "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/access-seed.sql"
  environment:
    PGSERVICEFILE: "{{ platform_reset_postgres_service_file }}"
  changed_when: true
  no_log: true

- name: Verify exact Access service and course identity counts
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_psql }}"
      - service={{ platform_reset_postgres_service }}
      - --no-psqlrc
      - --tuples-only
      - --no-align
      - --command
      - >-
        SELECT (SELECT count(*) FROM access.service_identities WHERE state='active'),
               (SELECT count(*) FROM access.course_memberships WHERE state='active');
  environment:
    PGSERVICEFILE: "{{ platform_reset_postgres_service_file }}"
  register: platform_reset_access_seed_verify
  changed_when: false
  failed_when: >-
    platform_reset_access_seed_verify.stdout | trim
    != '2|' + (platform_reset_access_seed.courseMemberships | length | string)
  no_log: true

- name: Delete exact LabWeaver NATS streams
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_nats }}"
      - --server
      - "{{ platform_reset_nats_server }}"
      - --creds
      - "{{ platform_reset_nats_credentials_file }}"
      - stream
      - delete
      - "{{ item.name }}"
      - --force
  loop: "{{ platform_reset_nats_streams }}"
  register: platform_reset_nats_delete
  failed_when: platform_reset_nats_delete.rc != 0 and 'not found' not in platform_reset_nats_delete.stderr | lower
  changed_when: platform_reset_nats_delete.rc == 0
  no_log: true

- name: Recreate exact LabWeaver NATS streams
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_nats }}"
      - --server
      - "{{ platform_reset_nats_server }}"
      - --creds
      - "{{ platform_reset_nats_credentials_file }}"
      - stream
      - add
      - "{{ item.name }}"
      - --subjects
      - "{{ item.subjects }}"
      - --storage
      - file
      - --retention
      - limits
      - --max-age
      - "{{ item.max_age }}"
      - --discard
      - old
      - --defaults
  loop: "{{ platform_reset_nats_streams }}"
  changed_when: true
  no_log: true

- name: Delete exact LabWeaver MinIO bucket contents
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_mc }}"
      - rm
      - --recursive
      - --force
      - --versions
      - "{{ platform_reset_minio_alias }}/{{ platform_reset_minio_bucket }}"
  register: platform_reset_minio_delete
  failed_when: platform_reset_minio_delete.rc != 0 and 'does not exist' not in platform_reset_minio_delete.stderr | lower
  changed_when: platform_reset_minio_delete.rc == 0
  no_log: true

- name: Recreate the exact LabWeaver MinIO bucket
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_mc }}"
      - mb
      - --ignore-existing
      - "{{ platform_reset_minio_alias }}/{{ platform_reset_minio_bucket }}"
  changed_when: true
  no_log: true

- name: Enable immutable artifact bucket versioning
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_mc }}"
      - version
      - enable
      - "{{ platform_reset_minio_alias }}/{{ platform_reset_minio_bucket }}"
  changed_when: true
  no_log: true

- name: Look up the exact Harbor project
  ansible.builtin.uri:
    url: "{{ platform_reset_harbor_api }}/api/v2.0/projects?name={{ platform_reset_harbor_project | urlencode }}"
    user: "{{ platform_reset_harbor_username }}"
    password: "{{ platform_reset_harbor_password }}"
    force_basic_auth: true
    validate_certs: true
    return_content: true
  register: platform_reset_harbor_lookup
  no_log: true

- name: Delete the exact Harbor project and all pre-release images
  ansible.builtin.uri:
    url: "{{ platform_reset_harbor_api }}/api/v2.0/projects/{{ platform_reset_harbor_project | urlencode }}"
    method: DELETE
    user: "{{ platform_reset_harbor_username }}"
    password: "{{ platform_reset_harbor_password }}"
    force_basic_auth: true
    validate_certs: true
    status_code: [200, 202]
  when: platform_reset_harbor_lookup.json | length > 0
  no_log: true

- name: Recreate the private Harbor project
  ansible.builtin.uri:
    url: "{{ platform_reset_harbor_api }}/api/v2.0/projects"
    method: POST
    user: "{{ platform_reset_harbor_username }}"
    password: "{{ platform_reset_harbor_password }}"
    force_basic_auth: true
    validate_certs: true
    body_format: json
    body:
      project_name: "{{ platform_reset_harbor_project }}"
      metadata: {public: "false"}
    status_code: [201]
  no_log: true

- name: Authenticate the controlled Keycloak admin client
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kcadm }}"
      - config
      - credentials
      - --server
      - "{{ platform_reset_keycloak_server }}"
      - --realm
      - "{{ platform_reset_keycloak_admin_realm }}"
      - --user
      - "{{ platform_reset_keycloak_username }}"
      - --password
      - "{{ platform_reset_keycloak_password }}"
      - --config
      - "{{ platform_reset_keycloak_config }}"
  changed_when: false
  no_log: true

- name: Delete the exact Keycloak realm
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kcadm }}"
      - delete
      - "realms/{{ platform_reset_keycloak_realm }}"
      - --config
      - "{{ platform_reset_keycloak_config }}"
  register: platform_reset_keycloak_delete
  failed_when: platform_reset_keycloak_delete.rc != 0 and '404' not in platform_reset_keycloak_delete.stderr
  changed_when: platform_reset_keycloak_delete.rc == 0
  no_log: true

- name: Stage the reviewed Sprint 2 Keycloak realm
  ansible.builtin.copy:
    src: "{{ platform_reset_keycloak_realm_file }}"
    dest: "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/keycloak-realm.json"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Import the reviewed Sprint 2 Keycloak realm
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kcadm }}"
      - create
      - realms
      - --config
      - "{{ platform_reset_keycloak_config }}"
      - --file
      - "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/keycloak-realm.json"
  changed_when: true
  no_log: true

- name: Copy the reviewed Sprint 2 Helm chart
  ansible.builtin.copy:
    src: "{{ platform_reset_chart_source }}/"
    dest: "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/chart/"
    owner: root
    group: root
    mode: preserve

- name: Copy reviewed private values files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ platform_reset_values_files }}"
  no_log: true

- name: Copy the reviewed rollback probe values
  ansible.builtin.copy:
    src: "{{ platform_reset_rollback_probe_values_file }}"
    dest: "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/rollback-probe-values.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Build controlled Helm values arguments
  ansible.builtin.set_fact:
    platform_reset_remote_values_argv: >-
      {{ platform_reset_values_files
         | map('basename')
         | map('regex_replace', '^(.*)$', platform_reset_report_root + '/' + platform_reset_run_id + '/\\1')
         | map('regex_replace', '^(.*)$', '--values=\\1') | list }}

- name: Deploy the Sprint 2 profile atomically
  ansible.builtin.command:
    argv: >-
      {{ [platform_reset_helm, '--kubeconfig', platform_reset_kubeconfig,
          'upgrade', '--install', platform_reset_release_name,
          platform_reset_report_root + '/' + platform_reset_run_id + '/chart',
          '--namespace', platform_reset_namespace, '--atomic', '--wait',
          '--timeout', platform_reset_rollout_timeout]
          + platform_reset_remote_values_argv }}
  changed_when: true

- name: Read the first deployment revision
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_helm }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - status
      - "{{ platform_reset_release_name }}"
      - --namespace
      - "{{ platform_reset_namespace }}"
      - --output
      - json
  register: platform_reset_first_status
  changed_when: false

- name: Record the first deployment revision
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_helm }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - history
      - "{{ platform_reset_release_name }}"
      - --namespace
      - "{{ platform_reset_namespace }}"
      - --max
      - "1"
      - --output
      - json
  register: platform_reset_first_revision_raw
  changed_when: false

- name: Normalize the first deployment revision
  ansible.builtin.set_fact:
    platform_reset_first_revision_value: "{{ (platform_reset_first_revision_raw.stdout | from_json | first).revision }}"

- name: Deploy the identical Sprint 2 profile a second time
  ansible.builtin.command:
    argv: >-
      {{ [platform_reset_helm, '--kubeconfig', platform_reset_kubeconfig,
          'upgrade', '--install', platform_reset_release_name,
          platform_reset_report_root + '/' + platform_reset_run_id + '/chart',
          '--namespace', platform_reset_namespace, '--atomic', '--wait',
          '--timeout', platform_reset_rollout_timeout]
          + platform_reset_remote_values_argv }}
  changed_when: true

- name: Read the second deployment revision
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_helm }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - history
      - "{{ platform_reset_release_name }}"
      - --namespace
      - "{{ platform_reset_namespace }}"
      - --max
      - "1"
      - --output
      - json
  register: platform_reset_second_revision_raw
  changed_when: false

- name: Normalize deployment revisions for the report
  ansible.builtin.set_fact:
    platform_reset_first_revision:
      stdout: "{{ platform_reset_first_revision_value }}"
    platform_reset_second_revision:
      stdout: "{{ (platform_reset_second_revision_raw.stdout | from_json | first).revision }}"

- name: Exercise atomic rollback with reviewed invalid readiness values
  ansible.builtin.command:
    argv: >-
      {{ [platform_reset_helm, '--kubeconfig', platform_reset_kubeconfig,
          'upgrade', platform_reset_release_name,
          platform_reset_report_root + '/' + platform_reset_run_id + '/chart',
          '--namespace', platform_reset_namespace, '--atomic', '--wait',
          '--timeout', '2m'] + platform_reset_remote_values_argv
          + ['--values', platform_reset_report_root + '/' + platform_reset_run_id + '/rollback-probe-values.yml'] }}
  register: platform_reset_rollback_probe
  failed_when: false
  changed_when: false

- name: Require the rollback probe to fail closed
  ansible.builtin.assert:
    that: platform_reset_rollback_probe.rc != 0
    fail_msg: PLATFORM_ROLLBACK_PROBE_DID_NOT_FAIL

- name: Verify the release recovered after the failed upgrade
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_helm }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - status
      - "{{ platform_reset_release_name }}"
      - --namespace
      - "{{ platform_reset_namespace }}"
      - --output
      - json
  register: platform_reset_rollback_status
  changed_when: false

- name: Require a deployed release after atomic rollback
  ansible.builtin.assert:
    that: (platform_reset_rollback_status.stdout | from_json).info.status == 'deployed'
    fail_msg: PLATFORM_ATOMIC_ROLLBACK_FAILED

- name: Verify every Sprint 2 workload rollout
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kubectl }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - --namespace
      - "{{ platform_reset_namespace }}"
      - rollout
      - status
      - "deployment/{{ item }}"
      - "--timeout={{ platform_reset_rollout_timeout }}"
  loop: "{{ platform_reset_workloads }}"
  changed_when: false

- name: Read back the exact Sprint 2 deployment set
  ansible.builtin.command:
    argv:
      - "{{ platform_reset_kubectl }}"
      - --kubeconfig
      - "{{ platform_reset_kubeconfig }}"
      - --namespace
      - "{{ platform_reset_namespace }}"
      - get
      - deployments
      - -l
      - app.kubernetes.io/instance={{ platform_reset_release_name }}
      - -o
      - json
  register: platform_reset_deployment_readback
  changed_when: false

- name: Require the exact Sprint 2 deployment set
  ansible.builtin.assert:
    that:
      - >-
        (platform_reset_deployment_readback.stdout | from_json).items
        | map(attribute='metadata.name') | sort
        == platform_reset_workloads | sort
      - (platform_reset_first_status.stdout | from_json).info.status == 'deployed'
    fail_msg: PLATFORM_DEPLOYMENT_READBACK_FAILED

- name: Hash the pre-destruction inventory
  ansible.builtin.stat:
    path: "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/inventory.json"
    checksum_algorithm: sha256
  register: platform_reset_inventory_stat

- name: Persist the sanitized reset and deployment report
  ansible.builtin.template:
    src: reset-report.json.j2
    dest: "{{ platform_reset_report_root }}/{{ platform_reset_run_id }}/report.json"
    owner: root
    group: root
    mode: "0600"
