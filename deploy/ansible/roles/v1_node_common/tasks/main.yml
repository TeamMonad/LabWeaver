---
# Ubuntu 22.04 node preparation for LabWeaver v1 cluster.
# Replaces the Rocky-specific rocky_common role for Debian-family nodes.
- name: Install Ubuntu Kubernetes node prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - tar
      - conntrack
      - socat
      - ethtool
      - qemu-guest-agent
      - nfs-common
      - lvm2
      - chrony
      - iproute2
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: Enable time sync (chrony); qemu-guest-agent stays installed but is not
    started on bare-metal v1 nodes (no virtio channel, service dependency fails)
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started

- name: Discover installed services before disabling UFW
  ansible.builtin.service_facts:

- name: Disable UFW when installed
  ansible.builtin.systemd_service:
    name: ufw
    enabled: false
    state: stopped
  when: "'ufw.service' in ansible_facts.services"

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Comment swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\s+swap\s+.*)$'
    replace: '# \1'

- name: Disable swap image on Ubuntu (dase uses /swap.img)
  ansible.builtin.command: swapoff -a
  changed_when: false
  when: ansible_swaptotal_mb | default(0) | int > 0

# Commenting /etc/fstab is not enough: systemd-gpt-auto-generator activates a
# GPT swap partition on every boot even without an fstab entry. Kubelet then
# refuses to start with "running with swap on is not supported". Mask the
# discovered swap units so the generator cannot re-activate them.
- name: Discover swap units
  ansible.builtin.command:
    argv: [systemctl, list-units, --type=swap, --all, --no-legend, --plain]
  changed_when: false
  register: v1_swap_units

- name: Read the enablement of each swap unit
  ansible.builtin.command:
    argv: [systemctl, is-enabled, "{{ item }}"]
  loop: "{{ v1_swap_units.stdout_lines | map('split') | map('first') | list }}"
  changed_when: false
  failed_when: false
  register: v1_swap_enablement

- name: Mask swap units so swap cannot be re-enabled on reboot
  ansible.builtin.command:
    argv: [systemctl, mask, "{{ item.item }}"]
  loop: "{{ v1_swap_enablement.results }}"
  when: item.stdout != 'masked'
  changed_when: true

- name: Read the active swap state
  ansible.builtin.command:
    argv: [cat, /proc/swaps]
  changed_when: false
  register: v1_swap_state

- name: Fail when swap is still active after masking
  ansible.builtin.assert:
    that:
      - v1_swap_state.stdout_lines | length == 1
    fail_msg: V1_SWAP_STILL_ACTIVE
    success_msg: V1_SWAP_DISABLED

- name: Configure Kubernetes kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'
    content: "overlay\nbr_netfilter\n"

- name: Load Kubernetes kernel modules
  ansible.builtin.command: modprobe {{ item }}
  changed_when: false
  loop: [overlay, br_netfilter]

- name: Configure Kubernetes sysctls
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: '1' }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: '1' }
    - { name: net.ipv4.ip_forward, value: '1' }
    - { name: fs.inotify.max_user_instances, value: '8192' }
    - { name: fs.inotify.max_user_watches, value: '1048576' }

- name: Set unique Kubernetes node hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: ansible_hostname != inventory_hostname

- name: Manage 127.0.1.1 entry to match the node hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+.*$'
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present

- name: Manage the LabWeaver v1 node /etc/hosts block
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# BEGIN labweaver-v1 nodes"
    block: |
      {% for node in groups['k8s_cluster'] %}
      {{ hostvars[node].ansible_host }} {{ node }}
      {% endfor %}
    state: present

- name: Verify node hostname
  ansible.builtin.command: hostname
  changed_when: false
  register: v1_hostname
