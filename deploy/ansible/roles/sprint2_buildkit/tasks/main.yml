---
- name: Load immutable Sprint 2 BuildKit identity
  ansible.builtin.set_fact:
    sprint2_buildkit_lock: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../versions.lock.yml') | from_yaml }}

- name: Validate Sprint 2 BuildKit inputs
  ansible.builtin.assert:
    that:
      - sprint2_buildkit_enabled | bool
      - sprint2_buildkit_namespace == 'labweaver-build'
      - sprint2_buildkit_bundle | length > 0
      - sprint2_buildkit_storage_class | length > 0
      - sprint2_buildkit_registry_cidr is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$')
      - sprint2_buildkit_operator_client_path == '/home/rocky/.config/labweaver/buildkit'
      - sprint2_buildkit_lock.sprint2_foundation.buildkit_rootless is match('^[^\s]+@sha256:[0-9a-f]{64}$')
    fail_msg: SPRINT2_BUILDKIT_INPUT_INVALID

- name: Inspect controlled BuildKit inputs
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ sprint2_buildkit_bundle }}"
    - "{{ sprint2_buildkit_manifest }}"
  register: sprint2_buildkit_inputs
  delegate_to: localhost
  become: false

- name: Reject missing BuildKit inputs
  ansible.builtin.assert:
    that:
      - sprint2_buildkit_inputs.results | map(attribute='stat.exists') | min
      - sprint2_buildkit_inputs.results | map(attribute='stat.isreg') | min
    fail_msg: SPRINT2_BUILDKIT_INPUT_MISSING

- name: Parse reviewed BuildKit bundle and manifest
  ansible.builtin.set_fact:
    sprint2_buildkit_objects: >-
      {{ lookup('ansible.builtin.file', sprint2_buildkit_bundle) | from_yaml_all | list }}
    sprint2_buildkit_manifest_value: >-
      {{ lookup('ansible.builtin.file', sprint2_buildkit_manifest) | from_json }}
    sprint2_buildkit_bundle_sha256: >-
      {{ lookup('ansible.builtin.file', sprint2_buildkit_bundle) | hash('sha256') }}
  no_log: true

- name: Validate BuildKit object boundary
  ansible.builtin.assert:
    that:
      - sprint2_buildkit_manifest_value.apiVersion == 'deploy.labweaver.io/sprint2-bundle-manifest/v1'
      - sprint2_buildkit_manifest_value.namespace == sprint2_buildkit_namespace
      - sprint2_buildkit_objects | length == 2
      - sprint2_buildkit_objects | map(attribute='apiVersion') | unique | list == ['v1']
      - sprint2_buildkit_objects | map(attribute='metadata.namespace') | unique | list == [sprint2_buildkit_namespace]
      - sprint2_buildkit_objects | selectattr('kind', 'equalto', 'ConfigMap') | map(attribute='metadata.name') | list == ['buildkit-config']
      - sprint2_buildkit_objects | selectattr('kind', 'equalto', 'Secret') | map(attribute='metadata.name') | list == ['buildkit-server-secrets']
    fail_msg: SPRINT2_BUILDKIT_BUNDLE_INVALID
  no_log: true

- name: Validate every BuildKit key against the manifest
  ansible.builtin.assert:
    that:
      - item.data is defined
      - item.stringData is not defined
      - item.binaryData is not defined
      - item.data.keys() | sort == sprint2_buildkit_expected_keys | sort
      - item.kind != 'Secret' or item.type == 'Opaque'
    fail_msg: SPRINT2_BUILDKIT_BUNDLE_KEYS_INVALID
  vars:
    sprint2_buildkit_expected_keys: >-
      {{ (sprint2_buildkit_manifest_value.configMaps
          if item.kind == 'ConfigMap'
          else sprint2_buildkit_manifest_value.secrets)[item.metadata.name] }}
  loop: "{{ sprint2_buildkit_objects }}"
  no_log: true

- name: Select reviewed BuildKit configuration
  ansible.builtin.set_fact:
    sprint2_buildkit_configuration: >-
      {{ (sprint2_buildkit_objects
          | selectattr('kind', 'equalto', 'ConfigMap')
          | first).data['buildkitd.toml'] }}
  no_log: true

- name: Require the approved rootless BuildKit boundary
  ansible.builtin.assert:
    that:
      - "'rootless = true' in sprint2_buildkit_configuration"
      - "'noProcessSandbox = true' in sprint2_buildkit_configuration"
      - "'tcp://0.0.0.0:1234' in sprint2_buildkit_configuration"
      - "'/etc/buildkit/tls/ca.crt' in sprint2_buildkit_configuration"
      - "'/etc/buildkit/tls/registry-ca.crt' in sprint2_buildkit_configuration"
    fail_msg: SPRINT2_BUILDKIT_CONFIGURATION_INVALID
  no_log: true

- name: Read the retained Harbor nginx service for cluster-local access
  kubernetes.core.k8s_info:
    kubeconfig: "{{ sprint2_buildkit_kubeconfig }}"
    api_version: v1
    kind: Service
    namespace: harbor
    name: harbor
  register: sprint2_buildkit_harbor_service

- name: Bind the retained Harbor service identity
  ansible.builtin.set_fact:
    sprint2_buildkit_harbor_service_ip: >-
      {{ sprint2_buildkit_harbor_service.resources[0].spec.clusterIP
         if sprint2_buildkit_harbor_service.resources | length == 1 else '' }}

- name: Reject a missing or invalid retained Harbor service
  ansible.builtin.assert:
    that:
      - sprint2_buildkit_harbor_service.resources | length == 1
      - sprint2_buildkit_harbor_service.resources[0].metadata.labels['app.kubernetes.io/managed-by'] | default('') == 'Helm'
      - sprint2_buildkit_harbor_service.resources[0].spec.ports | selectattr('port', 'equalto', 443) | list | length == 1
      - sprint2_buildkit_harbor_service_ip is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: SPRINT2_BUILDKIT_HARBOR_SERVICE_INVALID

- name: Inspect the generated BuildKit operator client inputs
  ansible.builtin.stat:
    path: "{{ sprint2_buildkit_bundle | dirname }}/build-executor-client/{{ item }}"
  loop: [ca.crt, tls.crt, tls.key]
  register: sprint2_buildkit_operator_client_inputs
  delegate_to: localhost
  become: false

- name: Reject missing BuildKit operator client inputs
  ansible.builtin.assert:
    that:
      - sprint2_buildkit_operator_client_inputs.results | map(attribute='stat.exists') | min
      - sprint2_buildkit_operator_client_inputs.results | map(attribute='stat.isreg') | min
      - sprint2_buildkit_operator_client_inputs.results | map(attribute='stat.mode') | select('match', '^0?600$') | list | length == 3
    fail_msg: SPRINT2_BUILDKIT_OPERATOR_CLIENT_INVALID
  no_log: true

- name: Create the protected BuildKit operator client directory
  ansible.builtin.file:
    path: "{{ sprint2_buildkit_operator_client_path }}"
    state: directory
    owner: rocky
    group: rocky
    mode: '0700'

- name: Install the current BuildKit operator mTLS client
  ansible.builtin.copy:
    src: "{{ sprint2_buildkit_bundle | dirname }}/build-executor-client/{{ item }}"
    dest: "{{ sprint2_buildkit_operator_client_path }}/{{ item }}"
    owner: rocky
    group: rocky
    mode: '0600'
  loop: [ca.crt, tls.crt, tls.key]
  no_log: true

- name: Reconcile the dedicated BuildKit namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ sprint2_buildkit_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ sprint2_buildkit_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver-infrastructure
          labweaver.io/infrastructure: "true"
          labweaver.io/security-exception: rootless-buildkit-no-process-sandbox
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted

- name: Apply reviewed BuildKit configuration
  kubernetes.core.k8s:
    kubeconfig: "{{ sprint2_buildkit_kubeconfig }}"
    state: present
    definition: "{{ item }}"
  loop: "{{ sprint2_buildkit_objects }}"
  no_log: true

- name: Reconcile rootless BuildKit workload
  kubernetes.core.k8s:
    kubeconfig: "{{ sprint2_buildkit_kubeconfig }}"
    state: present
    definition: "{{ item }}"
  loop: >-
    {{ lookup('ansible.builtin.template', 'workloads.yml.j2') | from_yaml_all | list }}

- name: Read rootless BuildKit deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ sprint2_buildkit_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ sprint2_buildkit_namespace }}"
    name: buildkit
  register: sprint2_buildkit_deployment
  until: >-
    sprint2_buildkit_deployment.resources | length == 1 and
    sprint2_buildkit_deployment.resources[0].status.readyReplicas | default(0, true) | int == 1 and
    sprint2_buildkit_deployment.resources[0].status.updatedReplicas | default(0, true) | int == 1
  retries: "{{ sprint2_buildkit_rollout_retries }}"
  delay: "{{ sprint2_buildkit_rollout_delay }}"

- name: Verify rootless BuildKit security and immutable image readback
  ansible.builtin.assert:
    that:
      - sprint2_buildkit_deployment.resources[0].spec.template.spec.containers | length == 1
      - sprint2_buildkit_deployment.resources[0].spec.template.spec.containers[0].image == sprint2_buildkit_lock.sprint2_foundation.buildkit_rootless
      - not (sprint2_buildkit_deployment.resources[0].spec.template.spec.containers[0].securityContext.privileged | default(false))
      - (sprint2_buildkit_deployment.resources[0].spec.template.spec.hostNetwork | default(false)) == false
      - sprint2_buildkit_deployment.resources[0].spec.template.spec.volumes | selectattr('hostPath', 'defined') | list | length == 0
      - sprint2_buildkit_deployment.resources[0].spec.template.spec.securityContext.seccompProfile.type == 'Unconfined'
      - sprint2_buildkit_deployment.resources[0].spec.template.spec.containers[0].securityContext.appArmorProfile.type == 'Unconfined'
    fail_msg: SPRINT2_BUILDKIT_READBACK_INVALID
