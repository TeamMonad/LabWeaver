platform_application_domains: [control, access, environment, agent, evaluation, resource]
# Exact migration-1 identities observed from the retained pre-reset Sprint 2
# database. They are accepted without rewriting history; new installations
# still record the catalog hash, and every later migration remains exact-only.
platform_application_retained_baseline_sha256:
  access: b57bc3d29605a9986c211df809e6bcc391b987c846f647c66bb7a5d3600780c4
  agent: 96f87d22cad7b0638aa48151c91fd8ae2ad46b786610a8979902ec51fd899b9e
  control: d6849ba453cace3cb7806d918b24ac3f923ca93283bbebb6b2a6fccaaf736f4b
  environment: 925bbcef2003f0f2764ebbb8b4304081b3287218ed5d03e5e803120386e60f69
  evaluation: 5f1cf9d27b0bf4976d86dc23a7d65adbf8ac107ee6786ccf5db81d664adce884
  resource: 3096083438fbb06d20c13a012663fbde4ad2f787771449adf1c52ca91696f380
platform_application_runtime_passwords: {}
platform_application_postgres_service_file: "{{ lookup('ansible.builtin.env', 'LABWEAVER_POSTGRES_SERVICE_FILE') }}"
platform_application_postgres_client_certificate_file: "{{ lookup('ansible.builtin.env', 'LABWEAVER_POSTGRES_CLIENT_CERTIFICATE_FILE') }}"
platform_application_postgres_client_private_key_file: "{{ lookup('ansible.builtin.env', 'LABWEAVER_POSTGRES_CLIENT_PRIVATE_KEY_FILE') }}"
platform_application_postgres_service: "{{ lookup('ansible.builtin.env', 'LABWEAVER_POSTGRES_SERVICE') | default('platform-admin', true) }}"
platform_application_postgres_database: labweaver
platform_application_postgres_forward_enabled: "{{ lookup('ansible.builtin.env', 'LABWEAVER_POSTGRES_FORWARD_ENABLED') | default('false', true) | bool }}"
platform_application_postgres_forward_service_name: labweaver-postgres-forward.service
platform_application_postgres_forward_namespace: labweaver-data
platform_application_postgres_forward_kubernetes_service: postgres
platform_application_postgres_forward_port: 15432
platform_application_nats_server: ""
platform_application_nats_controller_address: ""
platform_application_nats_controller_port: 4222
platform_application_nats_credentials_file: ""
platform_application_nats_ca_file: ""
platform_application_nats_client_certificate_file: ""
platform_application_nats_client_private_key_file: ""
platform_application_nats_streams:
  - {name: LABWEAVER_AGENT_EVENTS, subjects: ["labweaver.agent.>"], max_age: 24h}
  - {name: LABWEAVER_CONTROL_COMMANDS, subjects: ["labweaver.control.agent_build.requested.v1"], max_age: 24h}
  - name: LABWEAVER_ENVIRONMENT_COMMANDS
    subjects:
      - labweaver.environment.instance.>
      - labweaver.environment.command.quarantine.v1
    adopted_subjects:
      - labweaver.environment.instance.lifecycle_requested.v1
    max_age: 24h
  - name: LABWEAVER_RELEASES
    subjects:
      - labweaver.control.environment_template_release.>
      - labweaver.environment.release.quarantine.v1
    adopted_subjects:
      - labweaver.control.environment_template_release.>
    max_age: 168h
  - {name: LABWEAVER_ACCESS, subjects: ["labweaver.access.>"], max_age: 24h}
  - {name: LABWEAVER_SUBMISSION, subjects: ["labweaver.evaluation.submission.>"], max_age: 168h}
platform_application_nats_consumers:
  - name: control-agent-run-projection-v1
    stream: LABWEAVER_AGENT_EVENTS
    filters: ["labweaver.agent.run.>"]
  - name: control-agent-build-projection-v1
    stream: LABWEAVER_AGENT_EVENTS
    filters:
      - labweaver.agent.build.completed.v1
      - labweaver.agent.build.failed.v1
  - name: agent-build-command-v1
    stream: LABWEAVER_CONTROL_COMMANDS
    filters: [labweaver.control.agent_build.requested.v1]
  - name: environment-service-v1
    stream: LABWEAVER_ENVIRONMENT_COMMANDS
    filters: [labweaver.environment.instance.lifecycle_requested.v1]
  - name: access-environment-state-v1
    stream: LABWEAVER_ENVIRONMENT_COMMANDS
    filters: [labweaver.environment.instance.state_changed.v1]
  - name: environment-release-v1
    stream: LABWEAVER_RELEASES
    filters:
      - labweaver.control.environment_template_release.published.v1
      - labweaver.control.environment_template_release.withdrawn.v1
