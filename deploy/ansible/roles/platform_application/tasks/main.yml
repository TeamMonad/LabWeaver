---
- name: Load the immutable Sprint 2 application identities
  ansible.builtin.set_fact:
    platform_application_lock: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../versions.lock.yml') | from_yaml }}

- name: Load the reviewed private application variable locator
  ansible.builtin.include_vars:
    file: "{{ platform_application_vars_file }}"
    name: platform_application_reviewed_vars
  when: platform_application_vars_file | length > 0
  no_log: true

- name: Apply reviewed private application variables
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ platform_application_reviewed_vars | default({}) | dict2items }}"
  when: platform_application_reviewed_vars is defined
  no_log: true

- name: Validate non-destructive application inputs
  ansible.builtin.assert:
    that:
      - platform_application_run_id is match('^[a-z0-9][a-z0-9-]{2,62}$')
      - platform_application_source_commit is match('^[0-9a-f]{40,64}$')
      - platform_application_package_manifest | length > 0
      - platform_application_postgres_service_file | length > 0
      - platform_application_postgres_client_certificate_file | length > 0
      - platform_application_postgres_client_private_key_file | length > 0
      - platform_application_postgres_database is match('^[a-z][a-z0-9_]{0,62}$')
      - platform_application_nats_server | length > 0
      - platform_application_nats_credentials_file | length > 0
      - platform_application_nats_ca_file | length > 0
      - platform_application_nats_client_certificate_file | length > 0
      - platform_application_nats_client_private_key_file | length > 0
      - platform_application_minio_alias | length > 0
      - platform_application_minio_endpoint is match('^https://[^/]+(?::[0-9]+)?/?$')
      - platform_application_minio_username | length > 0
      - platform_application_minio_password | length > 0
      - platform_application_minio_ca_file | length > 0
      - platform_application_harbor_api | length > 0
      - platform_application_harbor_registry is match('^[a-z0-9][a-z0-9.-]+(?::[0-9]+)?$')
      - platform_application_harbor_endpoint_address is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - platform_application_harbor_ca_file | length > 0
      - platform_application_keycloak_config | length > 0
      - platform_application_keycloak_server | length > 0
      - platform_application_keycloak_username | length > 0
      - platform_application_keycloak_password | length > 0
      - platform_application_keycloak_realm_file | length > 0
      - platform_application_keycloak_ca_file | length > 0
      - platform_application_keycloak_hostname is match('^[a-z0-9][a-z0-9.-]+$')
      - platform_application_keycloak_endpoint_address is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - platform_application_lock.platform_vm_base.registry_url is match('^docker://[^@]+@sha256:[0-9a-f]{64}$')
      - platform_application_lock.platform_vm_base.disk_sha256 is match('^[0-9a-f]{64}$')
      - platform_application_lock.platform_vm_base.binding == 'ubuntu-24.04-v1'
      - platform_application_lock.platform_vm_base.artifact_id is match('^[0-9a-f-]{36}$')
      - platform_application_lock.platform_vm_base.format in ['qcow2', 'raw']
      - platform_application_lock.platform_vm_base.capacity_bytes | int > 0
      - platform_application_lock.platform_vm_base.data_source_name == 'ubuntu-lab-base-v1'
      - platform_application_lock.platform_vm_base.storage_class_name == 'local-path'
      - platform_application_keycloak_truststore_password | length >= 16
      - platform_application_access_seed_file | length > 0
      - platform_application_values_files | length > 0
      - platform_application_configuration_bundle | length > 0
      - platform_application_runtime_passwords.keys() | sort == platform_application_domains | sort
      - platform_application_runtime_passwords.values() | map('length') | min >= 24
      - (platform_application_portal_route_namespace | length == 0) == (platform_application_portal_route_name | length == 0)
      - >-
        platform_application_portal_route_name | length == 0 or
        (platform_application_portal_gateway_name | length > 0 and
         platform_application_portal_hostname is match('^[a-z0-9][a-z0-9.-]+$') and
         platform_application_portal_tls_certificate_file | length > 0 and
         platform_application_portal_tls_key_file | length > 0 and
         platform_application_portal_tls_ca_file | length > 0)
      - >-
        not platform_application_object_store_route_enabled or
        (platform_application_portal_route_name | length > 0 and
         platform_application_minio_bucket is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$') and
         platform_application_object_store_service_name is match('^[a-z]([-a-z0-9]*[a-z0-9])?$') and
         platform_application_object_store_service_port | int == 9000 and
         platform_application_object_store_backend_hostname is match('^[a-z0-9][a-z0-9.-]+$') and
         platform_application_object_store_external_cidr is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/32$'))
      - platform_application_portal_route_name | length > 0
      - platform_application_ssh_load_balancer_ip is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - platform_application_ssh_shared_ip_key is match('^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$')
    fail_msg: PLATFORM_APPLICATION_INPUT_INVALID

- name: Validate retained baseline identity allowances
  ansible.builtin.assert:
    that:
      - platform_application_retained_baseline_sha256.keys() | difference(platform_application_domains) | length == 0
      - item.value is match('^[0-9a-f]{64}$')
    fail_msg: PLATFORM_APPLICATION_RETAINED_BASELINE_IDENTITY_INVALID
  loop: "{{ platform_application_retained_baseline_sha256 | dict2items }}"

- name: Validate remote application tools and credentials
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - "{{ platform_application_kubeconfig }}"
    - "{{ platform_application_kubectl }}"
    - "{{ platform_application_helm }}"
    - "{{ platform_application_psql }}"
    - "{{ platform_application_nats }}"
    - "{{ platform_application_mc }}"
    - "{{ platform_application_kcadm }}"
    - "{{ platform_application_keytool }}"
    - "{{ platform_application_postgres_service_file }}"
    - "{{ platform_application_postgres_client_certificate_file }}"
    - "{{ platform_application_postgres_client_private_key_file }}"
    - "{{ platform_application_nats_credentials_file }}"
    - "{{ platform_application_nats_ca_file }}"
    - "{{ platform_application_nats_client_certificate_file }}"
    - "{{ platform_application_nats_client_private_key_file }}"
    - "{{ platform_application_keycloak_config }}"
    - "{{ platform_application_keycloak_ca_file }}"
    - "{{ platform_application_minio_ca_file }}"
    - "{{ platform_application_harbor_ca_file }}"
  register: platform_application_remote_inputs

- name: Report missing remote application locators before blocking
  ansible.builtin.debug:
    msg: "PLATFORM_APPLICATION_MISSING_REMOTE_LOCATOR={{ item.item }}"
  loop: "{{ platform_application_remote_inputs.results }}"
  when: not item.stat.exists

- name: Validate the PostgreSQL port-forward contract
  ansible.builtin.assert:
    that:
      - platform_application_postgres_forward_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - platform_application_postgres_forward_kubernetes_service is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - platform_application_postgres_forward_hostname is match('^[a-z0-9][a-z0-9.-]+$')
      - platform_application_postgres_forward_service_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?\\.service$')
      - platform_application_postgres_forward_port | int > 1024
      - platform_application_postgres_forward_port | int < 65536
    fail_msg: PLATFORM_APPLICATION_POSTGRES_FORWARD_INPUT_INVALID
  when: platform_application_postgres_forward_enabled | bool

- name: Install the persistent PostgreSQL port-forward
  ansible.builtin.template:
    src: postgres-port-forward.service.j2
    dest: /etc/systemd/system/{{ platform_application_postgres_forward_service_name }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart the adopted PostgreSQL port-forward
  when: platform_application_postgres_forward_enabled | bool

- name: Apply the PostgreSQL port-forward before database adoption
  ansible.builtin.meta: flush_handlers
  when: platform_application_postgres_forward_enabled | bool

- name: Require the adopted PostgreSQL port-forward endpoint
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ platform_application_postgres_forward_port }}"
    state: started
    timeout: 30
  when: platform_application_postgres_forward_enabled | bool

- name: Validate the NATS port-forward contract
  ansible.builtin.assert:
    that:
      - platform_application_nats_forward_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - platform_application_nats_forward_kubernetes_service is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - platform_application_nats_forward_hostname is match('^[a-z0-9][a-z0-9.-]+$')
      - platform_application_nats_forward_hostname == 'nats.labweaver-data.svc'
      - platform_application_nats_forward_address == '127.0.0.1'
      - platform_application_nats_forward_address is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - platform_application_nats_forward_service_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?\\.service$')
      - platform_application_nats_forward_port | int > 1024
      - platform_application_nats_forward_port | int < 65536
    fail_msg: PLATFORM_APPLICATION_NATS_FORWARD_INPUT_INVALID
  when: platform_application_nats_forward_enabled | bool

- name: Install the persistent NATS port-forward
  ansible.builtin.template:
    src: nats-port-forward.service.j2
    dest: /etc/systemd/system/{{ platform_application_nats_forward_service_name }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart the adopted NATS port-forward
  when: platform_application_nats_forward_enabled | bool

- name: Apply the NATS port-forward before JetStream adoption
  ansible.builtin.meta: flush_handlers
  when: platform_application_nats_forward_enabled | bool

- name: Require the adopted NATS port-forward endpoint
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ platform_application_nats_forward_port }}"
    state: started
    timeout: 30
  when: platform_application_nats_forward_enabled | bool

- name: Validate the MinIO port-forward contract
  ansible.builtin.assert:
    that:
      - platform_application_minio_forward_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - platform_application_minio_forward_kubernetes_service is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - platform_application_minio_forward_hostname is match('^[a-z0-9][a-z0-9.-]+$')
      - platform_application_minio_forward_hostname == 'minio.labweaver-data.svc'
      - platform_application_minio_forward_address == '127.0.0.1'
      - platform_application_minio_forward_address is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - platform_application_minio_forward_service_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?\.service$')
      - platform_application_minio_forward_port | int > 1024
      - platform_application_minio_forward_port | int < 65536
    fail_msg: PLATFORM_APPLICATION_MINIO_FORWARD_INPUT_INVALID
  when: platform_application_minio_forward_enabled | bool

- name: Install the persistent MinIO port-forward
  ansible.builtin.template:
    src: minio-port-forward.service.j2
    dest: /etc/systemd/system/{{ platform_application_minio_forward_service_name }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart the adopted MinIO port-forward
  when: platform_application_minio_forward_enabled | bool

- name: Apply the MinIO port-forward before bucket adoption
  ansible.builtin.meta: flush_handlers
  when: platform_application_minio_forward_enabled | bool

- name: Require the adopted MinIO port-forward endpoint
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ platform_application_minio_forward_port }}"
    state: started
    timeout: 30
  when: platform_application_minio_forward_enabled | bool

- name: Validate controller-owned reviewed inputs
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop: >-
    {{ [platform_application_package_manifest, platform_application_chart_source,
        platform_application_migration_catalog,
        platform_application_configuration_manifest,
        platform_application_configuration_bundle,
        platform_application_keycloak_realm_file,
        platform_application_access_seed_file,
        platform_application_nats_credential_validator] + platform_application_values_files
       + ([platform_application_portal_tls_certificate_file,
           platform_application_portal_tls_key_file,
           platform_application_portal_tls_ca_file]
          if platform_application_portal_route_name | length > 0 else []) }}
  register: platform_application_controller_inputs
  delegate_to: localhost
  become: false

- name: Reject missing application inputs
  ansible.builtin.assert:
    that:
      - platform_application_remote_inputs.results | map(attribute='stat.exists') | min
      - platform_application_controller_inputs.results | map(attribute='stat.exists') | min
    fail_msg: PLATFORM_APPLICATION_REQUIRED_PATH_MISSING

- name: Parse immutable package and private configuration
  ansible.builtin.set_fact:
    platform_application_package: >-
      {{ lookup('ansible.builtin.file', platform_application_package_manifest) | from_json }}
    platform_application_configuration_manifest_value: >-
      {{ lookup('ansible.builtin.file', platform_application_configuration_manifest) | from_json }}
    platform_application_configuration_objects: >-
      {{ lookup('ansible.builtin.file', platform_application_configuration_bundle)
         | from_yaml_all | list }}
    platform_application_access_seed: >-
      {{ lookup('ansible.builtin.file', platform_application_access_seed_file) | from_json }}
    platform_application_configuration_bundle_sha256: >-
      sha256:{{ platform_application_controller_inputs.results[4].stat.checksum }}
  no_log: true

- name: Parse Access Service role configuration from the reviewed bundle
  ansible.builtin.set_fact:
    platform_application_access_configuration: >-
      {{ (
        platform_application_configuration_objects
        | selectattr('kind', 'equalto', 'ConfigMap')
        | selectattr('metadata.name', 'equalto', 'access-service-config')
        | first
      ).data['config.yaml']
         | from_yaml_all
         | selectattr('oidc', 'defined')
         | first }}
  no_log: true

- name: Require the current Access Service configuration schema before mutation
  ansible.builtin.assert:
    that:
      - platform_application_access_configuration.grants is mapping
      - platform_application_access_configuration.grants.max_console_sessions is defined
      - platform_application_access_configuration.grants.environment_state_stream == 'LABWEAVER_ENVIRONMENT_COMMANDS'
      - platform_application_access_configuration.grants.environment_state_consumer == 'access-environment-state-v1'
    fail_msg: PLATFORM_APPLICATION_ACCESS_CONFIGURATION_SCHEMA_INVALID
  no_log: true

- name: Select reviewed NATS and Evaluation configuration objects
  ansible.builtin.set_fact:
    platform_application_control_secret_objects: >-
      {{ platform_application_configuration_objects
         | selectattr('kind', 'equalto', 'Secret')
         | selectattr('metadata.name', 'equalto', 'control-service-secrets')
         | list }}
    platform_application_evaluation_config_objects: >-
      {{ platform_application_configuration_objects
         | selectattr('kind', 'equalto', 'ConfigMap')
         | selectattr('metadata.name', 'equalto', 'evaluation-service-config')
         | list }}
  no_log: true

- name: Parse reviewed Evaluation configuration and NATS CA binding
  ansible.builtin.set_fact:
    platform_application_evaluation_configuration: >-
      {{ (platform_application_evaluation_config_objects | first).data['config.yaml']
         | from_yaml }}
    platform_application_bundle_nats_ca_sha256: >-
      {{ ((platform_application_control_secret_objects | first).data['nats-ca.pem']
          | b64decode) | hash('sha256') }}
    platform_application_remote_nats_ca_sha256: >-
      {{ (platform_application_remote_inputs.results
          | selectattr('item', 'equalto', platform_application_nats_ca_file)
          | map(attribute='stat.checksum')
          | first) }}
  no_log: true

- name: Require reviewed configuration bindings before any cluster mutation
  ansible.builtin.assert:
    that:
      - platform_application_control_secret_objects | length == 1
      - platform_application_evaluation_config_objects | length == 1
      - platform_application_bundle_nats_ca_sha256 == platform_application_remote_nats_ca_sha256
      - platform_application_evaluation_configuration.coordinator.workerRegistryPullConfigFile is string
      - platform_application_evaluation_configuration.coordinator.workerRegistryPullConfigFile is match('^/etc/labweaver/secrets/[^/]+$')
    fail_msg: PLATFORM_APPLICATION_CONFIGURATION_BINDING_INVALID
  no_log: true

- name: Validate immutable package identity
  ansible.builtin.assert:
    that:
      - platform_application_package.schema_version == 'platform-image-package-manifest.v1'
      - platform_application_package.source_commit == platform_application_source_commit
      - platform_application_package.overall == 'passed'
      - platform_application_package.images | length == 7
      - platform_application_package.images | map(attribute='component') | sort == platform_application_components | sort
      - platform_application_package.images | map(attribute='component') | unique | length == 7
      - platform_application_package.images | map(attribute='reference') | select('match', '^[^@]+@sha256:[0-9a-f]{64}$') | list | length == 7
      - platform_application_package.images | map(attribute='scan.critical') | map('int') | max == 0
    fail_msg: PLATFORM_APPLICATION_PACKAGE_INVALID

- name: Bind the evaluation freeze worker to the immutable package image
  ansible.builtin.set_fact:
    platform_application_evaluation_configuration_object: >-
      {{
        platform_application_configuration_objects
        | selectattr('kind', 'equalto', 'ConfigMap')
        | selectattr('metadata.name', 'equalto', 'evaluation-service-config')
        | first
      }}
    platform_application_evaluation_worker_image: >-
      {{
        (
          platform_application_package.images
          | selectattr('component', 'equalto', 'evaluation-service')
          | first
        ).reference
      }}
  no_log: true

- name: Require the evaluation freeze worker package binding
  ansible.builtin.assert:
    that:
      - platform_application_evaluation_worker_image is match('^[^@]+@sha256:[0-9a-f]{64}$')
      - >-
        (
          platform_application_evaluation_configuration_object.data['config.yaml']
          | from_yaml
        ).coordinator.workerImage is match('^[^@]+@sha256:[0-9a-f]{64}$')
    fail_msg: PLATFORM_APPLICATION_EVALUATION_WORKER_IMAGE_INVALID
  no_log: true

- name: Validate private configuration object boundary
  ansible.builtin.assert:
    that:
      - >-
        platform_application_configuration_objects | length ==
        (platform_application_required_configmaps | length +
         platform_application_required_secrets | length)
      - platform_application_configuration_objects | map(attribute='apiVersion') | unique | list == ['v1']
      - platform_application_configuration_objects | map(attribute='kind') | difference(['ConfigMap', 'Secret']) | length == 0
      - platform_application_configuration_objects | map(attribute='metadata.namespace') | unique | list == [platform_application_namespace]
      - platform_application_configuration_manifest_value.apiVersion == 'deploy.labweaver.io/platform-bundle-manifest/v1'
      - platform_application_configuration_manifest_value.namespace == platform_application_namespace
      - platform_application_configuration_manifest_value.configMaps.keys() | sort == platform_application_required_configmaps | sort
      - platform_application_configuration_manifest_value.secrets.keys() | sort == platform_application_required_secrets | sort
    fail_msg: PLATFORM_APPLICATION_CONFIGURATION_INVALID
  no_log: true

- name: Require canonical platform administrator role binding
  ansible.builtin.assert:
    that:
      - platform_application_access_configuration.oidc.role_claim_path == ['realm_access', 'roles']
      - platform_application_access_configuration.oidc.role_mappings.platform_admin == 'platform_admin'
      - platform_application_access_configuration.oidc.role_mappings['platform-admin'] == 'platform_admin'
    fail_msg: PLATFORM_APPLICATION_OIDC_ROLE_MAPPING_INVALID
  no_log: true

- name: Validate every private configuration key
  ansible.builtin.assert:
    that:
      - item.data is defined
      - item.stringData is not defined
      - item.binaryData is not defined
      - item.data.keys() | sort == platform_application_expected_keys | sort
      - item.kind != 'Secret' or item.type == 'Opaque'
    fail_msg: PLATFORM_APPLICATION_CONFIGURATION_KEYS_INVALID
  vars:
    platform_application_expected_keys: >-
      {{ (platform_application_configuration_manifest_value.configMaps
          if item.kind == 'ConfigMap'
          else platform_application_configuration_manifest_value.secrets)[item.metadata.name] }}
  loop: "{{ platform_application_configuration_objects }}"
  no_log: true

- name: Bind the Environment and container executor configuration
  ansible.builtin.set_fact:
    platform_application_environment_providers: >-
      {{ ((platform_application_configuration_objects
           | selectattr('kind', 'equalto', 'ConfigMap')
           | selectattr('metadata.name', 'equalto', 'environment-service-config')
           | first).data['providers.json']) | from_json }}
    platform_application_container_executor_configuration: >-
      {{ ((platform_application_configuration_objects
           | selectattr('kind', 'equalto', 'ConfigMap')
           | selectattr('metadata.name', 'equalto', 'container-executor-config')
           | first).data['config.yaml']) | from_yaml }}
  no_log: true

- name: Require one shared namespaced Harbor pull-secret identity
  ansible.builtin.assert:
    that:
      - platform_application_environment_providers | selectattr('providerKind', 'equalto', 'container') | list | length == 1
      - >-
        (platform_application_environment_providers
         | selectattr('providerKind', 'equalto', 'container')
         | first).imagePullSecretName == 'harbor-course-pull'
      - >-
        (platform_application_environment_providers
         | selectattr('providerKind', 'equalto', 'container')
         | first).imageRepositoryPrefix ==
        platform_application_harbor_registry + '/' + platform_application_harbor_project
      - platform_application_container_executor_configuration.executor.registryPullSecretName == 'harbor-course-pull'
    fail_msg: PLATFORM_APPLICATION_CONTAINER_IMAGE_IDENTITY_MISMATCH
  no_log: true

- name: Bind the Control event configuration for retained stream validation
  ansible.builtin.set_fact:
    platform_application_control_configuration: >-
      {{ (platform_application_configuration_objects
          | selectattr('kind', 'equalto', 'ConfigMap')
          | selectattr('metadata.name', 'equalto', 'control-service-config')
          | first).data['config.yaml'] | from_yaml }}
  no_log: true

- name: Require Control quarantine subjects to belong to the retained Agent stream
  ansible.builtin.assert:
    that:
      - platform_application_control_configuration.nats.stream_name == 'LABWEAVER_AGENT_EVENTS'
      - platform_application_control_configuration.nats.quarantine_subject is match('^labweaver\.agent\.')
      - platform_application_control_configuration.nats.build_quarantine_subject is match('^labweaver\.agent\.')
      - platform_application_control_configuration.nats.quarantine_subject != platform_application_control_configuration.nats.build_quarantine_subject
    fail_msg: PLATFORM_APPLICATION_CONTROL_QUARANTINE_STREAM_MISMATCH
  no_log: true

- name: Bind the Control NATS credential for permission validation
  ansible.builtin.set_fact:
    platform_application_control_nats_credentials: >-
      {{ ((platform_application_configuration_objects
           | selectattr('kind', 'equalto', 'Secret')
           | selectattr('metadata.name', 'equalto', 'control-service-secrets')
           | first).data['nats.creds']) | b64decode }}
  no_log: true

- name: Require Control to publish both retained quarantine subjects
  ansible.builtin.command:
    argv:
      - python3
      - "{{ platform_application_nats_credential_validator }}"
      - --allow-pub
      - "{{ platform_application_control_configuration.nats.quarantine_subject }}"
      - --allow-pub
      - "{{ platform_application_control_configuration.nats.build_quarantine_subject }}"
    stdin: "{{ platform_application_control_nats_credentials }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  no_log: true

- name: Validate private Access seed boundary
  ansible.builtin.assert:
    that:
      - platform_application_access_seed.apiVersion == 'deploy.labweaver.io/platform-access-seed/v1'
      - platform_application_access_seed.courseMemberships | length >= 2
      - >-
        platform_application_access_seed.courseMemberships
        | map(attribute='actorId') | unique | length
        == platform_application_access_seed.courseMemberships | length
      - >-
        platform_application_access_seed.courseMemberships
        | map(attribute='subjectSha256') | unique | length
        == platform_application_access_seed.courseMemberships | length
    fail_msg: PLATFORM_APPLICATION_ACCESS_SEED_INVALID
  no_log: true

- name: Validate every private Access membership seed
  ansible.builtin.assert:
    that:
      - item.actorId is match('^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
      - item.courseId is match('^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
      - item.subjectSha256 is match('^[0-9a-f]{64}$')
      - item.issuer is match('^https://[A-Za-z0-9._:/-]{1,512}$')
      - item.role in ['teacher', 'student', 'platform_admin']
    fail_msg: PLATFORM_APPLICATION_ACCESS_MEMBERSHIP_INVALID
  loop: "{{ platform_application_access_seed.courseMemberships }}"
  no_log: true

- name: Read target cluster UID
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kubectl }}"
      - --kubeconfig
      - "{{ platform_application_kubeconfig }}"
      - get
      - namespace
      - kube-system
      - -o
      - jsonpath={.metadata.uid}
  register: platform_application_cluster_uid
  check_mode: false
  changed_when: false

- name: Create bounded application report directory
  ansible.builtin.file:
    path: "{{ platform_application_report_root }}/{{ platform_application_run_id }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Resolve retained headless data-service endpoints
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kubectl }}"
      - --kubeconfig
      - "{{ platform_application_kubeconfig }}"
      - --namespace
      - "{{ platform_application_data_namespace }}"
      - get
      - endpointslice
      - --selector
      - "kubernetes.io/service-name={{ item }}"
      - --output=jsonpath={.items[0].endpoints[0].addresses[0]}
  loop: "{{ platform_application_data_services }}"
  register: platform_application_data_endpoints
  check_mode: false
  changed_when: false

- name: Require one valid retained endpoint per data service
  ansible.builtin.assert:
    that:
      - platform_application_data_endpoints.results | length == platform_application_data_services | length
      - >-
        platform_application_data_endpoints.results
        | selectattr('stdout', 'match', '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
        | list | length
        == platform_application_data_services | length
    fail_msg: PLATFORM_APPLICATION_DATA_ENDPOINT_INVALID

- name: Bind controller tools to retained service identities
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} LABWEAVER PLATFORM ADOPTED SERVICES"
    block: |
      {% for result in platform_application_data_endpoints.results %}
      {{ result.stdout }} {{ result.item }}.{{ platform_application_data_namespace }}.svc
      {% endfor %}
      {{ platform_application_harbor_endpoint_address }} {{ platform_application_harbor_registry }}
      {{ platform_application_keycloak_endpoint_address }} {{ platform_application_keycloak_hostname }}

- name: Apply the explicitly approved controller-side NATS transport override
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '^[0-9.]+\s+nats\.labweaver-data\.svc$'
    replace: >-
      {{ (platform_application_nats_forward_address
          if platform_application_nats_forward_enabled | bool
          else platform_application_nats_controller_address)
         ~ ' ' ~ platform_application_nats_forward_hostname }}
  when: >-
    platform_application_nats_forward_enabled | bool
    or platform_application_nats_controller_address | length > 0

- name: Apply the explicitly approved controller-side MinIO transport override
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '^[0-9.]+\s+minio\.labweaver-data\.svc$'
    replace: >-
      {{ (platform_application_minio_forward_address
          if platform_application_minio_forward_enabled | bool
          else platform_application_minio_controller_address)
         ~ ' ' ~ platform_application_minio_forward_hostname }}
  when: >-
    platform_application_minio_forward_enabled | bool
    or platform_application_minio_controller_address | length > 0

- name: Bind the effective MinIO administration endpoint
  ansible.builtin.set_fact:
    platform_application_minio_effective_endpoint: >-
      {{ ('https://' ~ platform_application_minio_forward_hostname ~ ':' ~
          (platform_application_minio_forward_port | string) ~ '/')
         if platform_application_minio_forward_enabled | bool
         else (('https://' ~ platform_application_minio_forward_hostname ~ ':' ~
                (platform_application_minio_controller_port | string) ~ '/')
               if platform_application_minio_controller_address | length > 0
               else platform_application_minio_endpoint) }}

- name: Create isolated MinIO administration configuration
  ansible.builtin.file:
    path: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/mc"
    state: directory
    owner: root
    group: root
    mode: "0700"
  check_mode: false

- name: Authenticate retained MinIO administration
  # mc parses any argument starting with '-' as a flag, which breaks aliases
  # whose secret key begins with '-' (generated credentials may do so). Pre-seed
  # the isolated mc config instead of passing the key through the CLI.
  ansible.builtin.copy:
    dest: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/mc/config.json"
    owner: root
    group: root
    mode: "0600"
    content: >-
      {{ {'version': '10', 'aliases': {platform_application_minio_alias: {
           'url': platform_application_minio_effective_endpoint,
           'accessKey': platform_application_minio_username,
           'secretKey': platform_application_minio_password,
           'api': 'S3v4',
           'path': 'on'}}} | to_nice_json }}
  no_log: true
  check_mode: false

- name: Probe retained PostgreSQL database identity
  ansible.builtin.slurp:
    src: "{{ platform_application_postgres_service_file }}"
  register: platform_application_postgres_service_source
  no_log: true

- name: Bind effective PostgreSQL service identity
  ansible.builtin.set_fact:
    platform_application_postgres_effective_service_file: >-
      {{ platform_application_report_root }}/{{ platform_application_run_id }}/postgres-service.conf

- name: Bind PostgreSQL service through the adopted controller forward
  ansible.builtin.copy:
    dest: "{{ platform_application_postgres_effective_service_file }}"
    owner: root
    group: root
    mode: "0600"
    content: >-
      {{ (platform_application_postgres_service_source.content | b64decode)
         | regex_replace('(?m)^hostaddr=.*\\n?', '')
         | regex_replace('(?m)^port=.*$', 'port=' ~ (platform_application_postgres_forward_port | string))
         | regex_replace('(?m)^host=.*$', 'hostaddr=127.0.0.1' ~ '\\n' ~
             'host=' ~ platform_application_postgres_forward_hostname) }}
  when: platform_application_postgres_forward_enabled | bool
  no_log: true

- name: Bind PostgreSQL service without a controller forward
  ansible.builtin.set_fact:
    platform_application_postgres_effective_service_file: "{{ platform_application_postgres_service_file }}"
  when: not (platform_application_postgres_forward_enabled | bool)

- name: Probe retained PostgreSQL database identity
  ansible.builtin.command:
    argv:
      - "{{ platform_application_psql }}"
      - "service={{ platform_application_postgres_service }}"
      - --no-psqlrc
      - --tuples-only
      - --command
      - SELECT current_database()
  environment:
    PGSERVICEFILE: "{{ platform_application_postgres_effective_service_file }}"
    PGSSLCERT: "{{ platform_application_postgres_client_certificate_file }}"
    PGSSLKEY: "{{ platform_application_postgres_client_private_key_file }}"
  register: platform_application_postgres_identity
  check_mode: false
  changed_when: false
  retries: 6
  delay: 2
  until: platform_application_postgres_identity.rc == 0
  no_log: true

- name: Require the exact Sprint 2 PostgreSQL database
  ansible.builtin.assert:
    that:
      - platform_application_postgres_identity.stdout | trim == platform_application_postgres_database
    fail_msg: PLATFORM_APPLICATION_POSTGRES_DATABASE_IDENTITY_MISMATCH

- name: Render non-destructive six-domain baseline adoption
  ansible.builtin.template:
    src: baseline-adopt.sql.j2
    dest: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/baseline-adopt.sql"
    owner: root
    group: root
    mode: "0600"

- name: Apply or verify exact six-domain baseline
  ansible.builtin.command:
    argv:
      - "{{ platform_application_psql }}"
      - "service={{ platform_application_postgres_service }}"
      - --no-psqlrc
      - "--set=lw_control_password={{ platform_application_runtime_passwords.control }}"
      - "--set=lw_access_password={{ platform_application_runtime_passwords.access }}"
      - "--set=lw_environment_password={{ platform_application_runtime_passwords.environment }}"
      - "--set=lw_agent_password={{ platform_application_runtime_passwords.agent }}"
      - "--set=lw_evaluation_password={{ platform_application_runtime_passwords.evaluation }}"
      - "--set=lw_resource_password={{ platform_application_runtime_passwords.resource }}"
      - --file
      - "{{ platform_application_report_root }}/{{ platform_application_run_id }}/baseline-adopt.sql"
  environment:
    PGSERVICEFILE: "{{ platform_application_postgres_effective_service_file }}"
    PGSSLCERT: "{{ platform_application_postgres_client_certificate_file }}"
    PGSSLKEY: "{{ platform_application_postgres_client_private_key_file }}"
  changed_when: true
  register: platform_application_baseline_apply
  retries: 6
  delay: 2
  until: platform_application_baseline_apply.rc == 0
  no_log: true

- name: Render conflict-detecting Access seed adoption
  ansible.builtin.template:
    src: access-seed-adopt.sql.j2
    dest: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/access-seed-adopt.sql"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Apply or verify Access service identities and memberships
  ansible.builtin.command:
    argv:
      - "{{ platform_application_psql }}"
      - "service={{ platform_application_postgres_service }}"
      - --no-psqlrc
      - --file
      - "{{ platform_application_report_root }}/{{ platform_application_run_id }}/access-seed-adopt.sql"
  environment:
    PGSERVICEFILE: "{{ platform_application_postgres_effective_service_file }}"
    PGSSLCERT: "{{ platform_application_postgres_client_certificate_file }}"
    PGSSLKEY: "{{ platform_application_postgres_client_private_key_file }}"
  changed_when: true
  register: platform_application_access_seed_apply
  retries: 6
  delay: 2
  until: platform_application_access_seed_apply.rc == 0
  no_log: true

- name: Bind controller NATS probe endpoint
  ansible.builtin.set_fact:
    platform_application_nats_probe_server: >-
      {{ ('tls://nats.labweaver-data.svc:' ~ platform_application_nats_controller_port)
         if platform_application_nats_forward_enabled | bool
            or platform_application_nats_controller_address | length > 0
         else platform_application_nats_server }}

- name: Probe retained JetStream
  ansible.builtin.command:
    argv:
      - "{{ platform_application_nats }}"
      - --server
      - "{{ platform_application_nats_probe_server }}"
      - --creds
      - "{{ platform_application_nats_credentials_file }}"
      - --tlsca
      - "{{ platform_application_nats_ca_file }}"
      - --tlscert
      - "{{ platform_application_nats_client_certificate_file }}"
      - --tlskey
      - "{{ platform_application_nats_client_private_key_file }}"
      - account
      - info
  check_mode: false
  changed_when: false

- name: Inspect exact Sprint 2 streams without mutation
  ansible.builtin.command:
    argv:
      - "{{ platform_application_nats }}"
      - --server
      - "{{ platform_application_nats_probe_server }}"
      - --creds
      - "{{ platform_application_nats_credentials_file }}"
      - --tlsca
      - "{{ platform_application_nats_ca_file }}"
      - --tlscert
      - "{{ platform_application_nats_client_certificate_file }}"
      - --tlskey
      - "{{ platform_application_nats_client_private_key_file }}"
      - stream
      - info
      - "{{ item.name }}"
      - --json
  loop: "{{ platform_application_nats_streams }}"
  register: platform_application_stream_info_before
  check_mode: false
  failed_when: false
  changed_when: false

- name: Create only missing Sprint 2 streams
  ansible.builtin.command:
    argv:
      - "{{ platform_application_nats }}"
      - --server
      - "{{ platform_application_nats_probe_server }}"
      - --creds
      - "{{ platform_application_nats_credentials_file }}"
      - --tlsca
      - "{{ platform_application_nats_ca_file }}"
      - --tlscert
      - "{{ platform_application_nats_client_certificate_file }}"
      - --tlskey
      - "{{ platform_application_nats_client_private_key_file }}"
      - stream
      - add
      - "{{ item.item.name }}"
      - --subjects
      - "{{ item.item.subjects | join(',') }}"
      - --storage
      - file
      - --retention
      - limits
      - --max-age
      - "{{ item.item.max_age }}"
      - --discard
      - old
      - --defaults
  loop: "{{ platform_application_stream_info_before.results }}"
  when: item.rc != 0
  changed_when: true

- name: Expand only the explicitly adopted Environment lifecycle stream
  ansible.builtin.command:
    argv:
      - "{{ platform_application_nats }}"
      - --server
      - "{{ platform_application_nats_probe_server }}"
      - --creds
      - "{{ platform_application_nats_credentials_file }}"
      - --tlsca
      - "{{ platform_application_nats_ca_file }}"
      - --tlscert
      - "{{ platform_application_nats_client_certificate_file }}"
      - --tlskey
      - "{{ platform_application_nats_client_private_key_file }}"
      - stream
      - edit
      - "{{ item.item.name }}"
      - --subjects
      - "{{ item.item.subjects | join(',') }}"
      - --force
  loop: "{{ platform_application_stream_info_before.results }}"
  when:
    - item.rc == 0
    - item.item.adopted_subjects is defined
    - ((item.stdout | from_json).config.subjects | sort) == (item.item.adopted_subjects | sort)
  changed_when: true

- name: Read back exact Sprint 2 streams
  ansible.builtin.command:
    argv:
      - "{{ platform_application_nats }}"
      - --server
      - "{{ platform_application_nats_probe_server }}"
      - --creds
      - "{{ platform_application_nats_credentials_file }}"
      - --tlsca
      - "{{ platform_application_nats_ca_file }}"
      - --tlscert
      - "{{ platform_application_nats_client_certificate_file }}"
      - --tlskey
      - "{{ platform_application_nats_client_private_key_file }}"
      - stream
      - info
      - "{{ item.name }}"
      - --json
  loop: "{{ platform_application_nats_streams }}"
  register: platform_application_stream_info_after
  check_mode: false
  failed_when: false
  changed_when: false

- name: Reject failed Sprint 2 stream readback outside check mode
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: PLATFORM_APPLICATION_STREAM_READBACK_FAILED
  loop: "{{ platform_application_stream_info_after.results }}"
  when: not ansible_check_mode
  no_log: true

- name: Validate retained or created stream identities
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json).config.name == item.item.name
      - ((item.stdout | from_json).config.subjects | sort) == (item.item.subjects | sort)
      - (item.stdout | from_json).config.storage == 'file'
      - (item.stdout | from_json).config.retention == 'limits'
      - (item.stdout | from_json).config.discard == 'old'
    fail_msg: PLATFORM_APPLICATION_STREAM_CONFLICT
  loop: "{{ platform_application_stream_info_after.results }}"
  when: item.rc == 0
  no_log: true

- name: Inspect exact Sprint 2 durable consumers without mutation
  ansible.builtin.command:
    argv:
      - "{{ platform_application_nats }}"
      - --server
      - "{{ platform_application_nats_probe_server }}"
      - --creds
      - "{{ platform_application_nats_credentials_file }}"
      - --tlsca
      - "{{ platform_application_nats_ca_file }}"
      - --tlscert
      - "{{ platform_application_nats_client_certificate_file }}"
      - --tlskey
      - "{{ platform_application_nats_client_private_key_file }}"
      - consumer
      - info
      - "{{ item.stream }}"
      - "{{ item.name }}"
      - --json
  loop: "{{ platform_application_nats_consumers }}"
  register: platform_application_consumer_info_before
  check_mode: false
  failed_when: false
  changed_when: false

- name: Create only missing Sprint 2 durable consumers
  ansible.builtin.command:
    argv: >-
      {{ [platform_application_nats,
          '--server', platform_application_nats_probe_server,
          '--creds', platform_application_nats_credentials_file,
          '--tlsca', platform_application_nats_ca_file,
          '--tlscert', platform_application_nats_client_certificate_file,
          '--tlskey', platform_application_nats_client_private_key_file,
          'consumer', 'add', item.item.stream, item.item.name]
         + (item.item.filters | map('regex_replace', '^', '--filter=') | list)
         + ['--ack', 'explicit', '--deliver', 'all', '--pull',
            '--replay', 'instant', '--max-deliver', '10', '--defaults'] }}
  loop: "{{ platform_application_consumer_info_before.results }}"
  when: item.rc != 0
  changed_when: true

- name: Read back exact Sprint 2 durable consumers
  ansible.builtin.command:
    argv:
      - "{{ platform_application_nats }}"
      - --server
      - "{{ platform_application_nats_probe_server }}"
      - --creds
      - "{{ platform_application_nats_credentials_file }}"
      - --tlsca
      - "{{ platform_application_nats_ca_file }}"
      - --tlscert
      - "{{ platform_application_nats_client_certificate_file }}"
      - --tlskey
      - "{{ platform_application_nats_client_private_key_file }}"
      - consumer
      - info
      - "{{ item.stream }}"
      - "{{ item.name }}"
      - --json
  loop: "{{ platform_application_nats_consumers }}"
  register: platform_application_consumer_info_after
  check_mode: false
  failed_when: false
  changed_when: false

- name: Reject failed Sprint 2 consumer readback outside check mode
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: PLATFORM_APPLICATION_CONSUMER_READBACK_FAILED
  loop: "{{ platform_application_consumer_info_after.results }}"
  when: not ansible_check_mode
  no_log: true

- name: Validate retained or created consumer identities
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json).name == item.item.name
      - (item.stdout | from_json).stream_name == item.item.stream
      - (item.stdout | from_json).config.durable_name == item.item.name
      - (item.stdout | from_json).config.ack_policy == 'explicit'
      - >-
        (((item.stdout | from_json).config.filter_subjects | default([]))
          + ([((item.stdout | from_json).config.filter_subject)]
             if ((item.stdout | from_json).config.filter_subject | default('') | length > 0)
             else [])) | sort == item.item.filters | sort
    fail_msg: PLATFORM_APPLICATION_CONSUMER_CONFLICT
  loop: "{{ platform_application_consumer_info_after.results }}"
  when: item.rc == 0
  no_log: true

- name: Inspect the immutable artifact bucket without mutation
  ansible.builtin.command:
    argv:
      - "{{ platform_application_mc }}"
      - ls
      - "{{ platform_application_minio_alias }}/{{ platform_application_minio_bucket }}"
  register: platform_application_minio_bucket_before
  check_mode: false
  changed_when: false
  failed_when: false
  environment:
    MC_CONFIG_DIR: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/mc"
    SSL_CERT_FILE: "{{ platform_application_minio_ca_file }}"
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    ALL_PROXY: ""
    all_proxy: ""
  no_log: true

- name: Create the immutable artifact bucket only when missing
  ansible.builtin.command:
    argv:
      - "{{ platform_application_mc }}"
      - mb
      - --ignore-existing
      - "{{ platform_application_minio_alias }}/{{ platform_application_minio_bucket }}"
  changed_when: false
  register: platform_application_minio_bucket_create
  when: platform_application_minio_bucket_before.rc != 0
  environment:
    MC_CONFIG_DIR: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/mc"
    SSL_CERT_FILE: "{{ platform_application_minio_ca_file }}"
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    ALL_PROXY: ""
    all_proxy: ""
  no_log: false

- name: Enable versioning without removing existing objects
  ansible.builtin.command:
    argv:
      - "{{ platform_application_mc }}"
      - version
      - enable
      - "{{ platform_application_minio_alias }}/{{ platform_application_minio_bucket }}"
  changed_when: false
  environment:
    MC_CONFIG_DIR: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/mc"
    SSL_CERT_FILE: "{{ platform_application_minio_ca_file }}"
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    ALL_PROXY: ""
    all_proxy: ""
  no_log: true

- name: Verify immutable artifact bucket versioning
  ansible.builtin.command:
    argv:
      - "{{ platform_application_mc }}"
      - version
      - info
      - "{{ platform_application_minio_alias }}/{{ platform_application_minio_bucket }}"
      - --json
  register: platform_application_minio_version
  check_mode: false
  environment:
    MC_CONFIG_DIR: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/mc"
    SSL_CERT_FILE: "{{ platform_application_minio_ca_file }}"
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    http_proxy: ""
    https_proxy: ""
    ALL_PROXY: ""
    all_proxy: ""
  changed_when: false
  failed_when: >-
    platform_application_minio_version.rc != 0 or
    (platform_application_minio_version.stdout | from_json).status != 'success' or
    (platform_application_minio_version.stdout | from_json).versioning.status != 'Enabled'

- name: Load the retained Harbor project-admin credential locator
  ansible.builtin.slurp:
    src: "{{ platform_application_harbor_admin_password_file }}"
  register: platform_application_harbor_admin_password_raw
  changed_when: false
  no_log: true

- name: Validate the retained Harbor project-admin credential
  ansible.builtin.assert:
    that:
      - platform_application_harbor_admin_password_file | length > 0
      - platform_application_harbor_admin_password_raw.content | length > 0
    fail_msg: LW_HARBOR_PROJECT_ADMIN_CREDENTIAL_MISSING

- name: Inspect the adopted Harbor project without mutation
  ansible.builtin.uri:
    url: "{{ platform_application_harbor_api }}/api/v2.0/projects?name={{ platform_application_harbor_project | urlencode }}"
    user: "{{ platform_application_harbor_admin_username }}"
    password: "{{ platform_application_harbor_admin_password_raw.content | b64decode | trim }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ platform_application_harbor_ca_file }}"
    return_content: true
  check_mode: false
  register: platform_application_harbor_project_info
  failed_when: platform_application_harbor_project_info.status != 200 or platform_application_harbor_project_info.json | length > 1
  no_log: true

- name: Create the adopted Harbor project only when missing
  ansible.builtin.uri:
    url: "{{ platform_application_harbor_api }}/api/v2.0/projects"
    method: POST
    user: "{{ platform_application_harbor_admin_username }}"
    password: "{{ platform_application_harbor_admin_password_raw.content | b64decode | trim }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ platform_application_harbor_ca_file }}"
    body_format: json
    body:
      project_name: "{{ platform_application_harbor_project }}"
      public: false
    status_code: [201, 409]
  when: platform_application_harbor_project_info.json | length == 0
  no_log: true

- name: Verify adopted private Harbor project identity
  ansible.builtin.uri:
    url: "{{ platform_application_harbor_api }}/api/v2.0/projects?name={{ platform_application_harbor_project | urlencode }}"
    user: "{{ platform_application_harbor_admin_username }}"
    password: "{{ platform_application_harbor_admin_password_raw.content | b64decode | trim }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ platform_application_harbor_ca_file }}"
    return_content: true
  check_mode: false
  register: platform_application_harbor_project_verified
  failed_when: >-
    platform_application_harbor_project_verified.status != 200 or
    platform_application_harbor_project_verified.json | length != 1 or
    platform_application_harbor_project_verified.json[0].name != platform_application_harbor_project
  no_log: true

- name: Load the adopted Harbor CA for Kubernetes nodes
  ansible.builtin.slurp:
    src: "{{ platform_application_harbor_ca_file }}"
  register: platform_application_harbor_ca_bundle
  changed_when: false
  no_log: true

- name: Probe the retained Kubernetes node CA trust implementation
  ansible.builtin.shell:
    cmd: |
      export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      if command -v update-ca-trust >/dev/null 2>&1; then
        printf 'rhel\n'
      elif command -v update-ca-certificates >/dev/null 2>&1; then
        printf 'debian\n'
      else
        printf 'unsupported\n'
        exit 127
      fi
  register: platform_application_ca_trust_probes
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ groups['k8s_cluster'] }}"
  check_mode: false
  changed_when: false

- name: Require a supported Kubernetes node CA trust implementation
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim in ['rhel', 'debian']
    fail_msg: PLATFORM_APPLICATION_CA_TRUST_IMPLEMENTATION_UNSUPPORTED
  loop: "{{ platform_application_ca_trust_probes.results }}"

- name: Bind the retained Kubernetes node CA trust layout
  ansible.builtin.set_fact:
    platform_application_node_ca_trust_anchors_dir: >-
      {{ '/etc/pki/ca-trust/source/anchors'
         if (item.stdout | trim) == 'rhel'
         else '/usr/local/share/ca-certificates' }}
    platform_application_node_ca_trust_refresh_argv: >-
      {{ ['update-ca-trust', 'extract']
         if (item.stdout | trim) == 'rhel'
         else ['update-ca-certificates'] }}
  delegate_to: "{{ item.item }}"
  delegate_facts: true
  loop: "{{ platform_application_ca_trust_probes.results }}"

- name: Create system CA trust directories on every Kubernetes node
  ansible.builtin.file:
    path: "{{ hostvars[item].platform_application_node_ca_trust_anchors_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: "{{ item }}"
  loop: "{{ groups['k8s_cluster'] }}"

- name: Create Harbor container runtime trust directories on every Kubernetes node
  ansible.builtin.file:
    path: "/etc/containers/certs.d/{{ platform_application_harbor_registry }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: "{{ item }}"
  loop: "{{ groups['k8s_cluster'] }}"

- name: Install the adopted Harbor CA in every Kubernetes node system trust
  ansible.builtin.copy:
    dest: "{{ hostvars[item].platform_application_node_ca_trust_anchors_dir }}/labweaver-harbor.crt"
    owner: root
    group: root
    mode: "0644"
    content: "{{ platform_application_harbor_ca_bundle.content | b64decode }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['k8s_cluster'] }}"
  notify: Refresh Kubernetes node Harbor trust
  no_log: true

- name: Install the adopted Harbor CA for every Kubernetes container runtime
  ansible.builtin.copy:
    dest: "/etc/containers/certs.d/{{ platform_application_harbor_registry }}/ca.crt"
    owner: root
    group: root
    mode: "0644"
    content: "{{ platform_application_harbor_ca_bundle.content | b64decode }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['k8s_cluster'] }}"
  no_log: true

- name: Apply changed Kubernetes node Harbor trust before workload rollout
  ansible.builtin.meta: flush_handlers

- name: Bind the reviewed Keycloak hostname to its retained Gateway address
  ansible.builtin.copy:
    dest: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak.hosts"
    mode: "0600"
    content: |
      {{ platform_application_keycloak_endpoint_address }} {{ platform_application_keycloak_hostname }}
  check_mode: false

- name: Stage the reviewed Keycloak realm on the execution host
  ansible.builtin.copy:
    src: "{{ platform_application_keycloak_realm_file }}"
    dest: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak-realm.json"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  check_mode: false

- name: Build an isolated Keycloak administration truststore
  ansible.builtin.command:
    argv:
      - "{{ platform_application_keytool }}"
      - -importcert
      - -noprompt
      - -storetype
      - PKCS12
      - -alias
      - labweaver-keycloak-ca
      - -file
      - "{{ platform_application_keycloak_ca_file }}"
      - -keystore
      - "{{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak-truststore.p12.tmp"
      - -storepass
      - "{{ platform_application_keycloak_truststore_password }}"
  check_mode: false
  changed_when: true
  no_log: true

- name: Atomically publish the Keycloak administration truststore
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - -f
      - "{{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak-truststore.p12.tmp"
      - "{{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak-truststore.p12"
  check_mode: false
  changed_when: true
  no_log: true

- name: Bind Keycloak administration to the isolated truststore
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kcadm }}"
      - config
      - truststore
      - "{{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak-truststore.p12"
      - --trustpass
      - "{{ platform_application_keycloak_truststore_password }}"
      - --config
      - "{{ platform_application_keycloak_config }}"
  check_mode: false
  changed_when: false
  no_log: true

- name: Authenticate retained Keycloak administration
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kcadm }}"
      - config
      - credentials
      - --server
      - "{{ platform_application_keycloak_server }}"
      - --realm
      - "{{ platform_application_keycloak_admin_realm }}"
      - --user
      - "{{ platform_application_keycloak_username }}"
      - --password
      - "{{ platform_application_keycloak_password }}"
      - --config
      - "{{ platform_application_keycloak_config }}"
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak.hosts"
  register: platform_application_keycloak_authentication
  check_mode: false
  changed_when: false
  failed_when: >-
    platform_application_keycloak_authentication.rc != 0 or
    platform_application_keycloak_authentication.stderr is search('HTTP [45][0-9][0-9]')
  no_log: true

- name: Load the isolated Keycloak administration session
  ansible.builtin.slurp:
    src: "{{ platform_application_keycloak_config }}"
  register: platform_application_keycloak_session_file
  changed_when: false
  no_log: true

- name: Bind the authenticated master-realm token explicitly
  ansible.builtin.set_fact:
    platform_application_keycloak_admin_token: >-
      {{
        ((platform_application_keycloak_session_file.content | b64decode | from_json)
          .get('endpoints', {})
          .get(platform_application_keycloak_server, {})
          .get(platform_application_keycloak_admin_realm, {})
          .get('token', ''))
      }}
  no_log: true

- name: Require a usable Keycloak administration token
  ansible.builtin.assert:
    that:
      - platform_application_keycloak_admin_token is string
      - platform_application_keycloak_admin_token.split('.') | length == 3
    fail_msg: PLATFORM_APPLICATION_KEYCLOAK_ADMIN_TOKEN_INVALID
  no_log: true

- name: Require retained Keycloak realm-management authorization
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kcadm }}"
      - get
      - users
      - --realm
      - "{{ platform_application_keycloak_admin_realm }}"
      - --limit
      - "1"
      - --fields
      - id,username
      - --token
      - "{{ platform_application_keycloak_admin_token }}"
      - --config
      - "{{ platform_application_keycloak_config }}"
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak.hosts"
  register: platform_application_keycloak_authorization
  check_mode: false
  changed_when: false
  failed_when: >-
    platform_application_keycloak_authorization.rc != 0 or
    platform_application_keycloak_authorization.stderr is search('HTTP [45][0-9][0-9]')
  no_log: true

- name: Inspect retained Sprint 2 Keycloak realm
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kcadm }}"
      - get
      - "realms/{{ platform_application_keycloak_realm }}"
      - --token
      - "{{ platform_application_keycloak_admin_token }}"
      - --config
      - "{{ platform_application_keycloak_config }}"
  register: platform_application_keycloak_realm_before
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak.hosts"
  failed_when: false
  check_mode: false
  changed_when: false
  no_log: true

- name: Import reviewed realm only when absent
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kcadm }}"
      - create
      - realms
      - --token
      - "{{ platform_application_keycloak_admin_token }}"
      - --config
      - "{{ platform_application_keycloak_config }}"
      - --file
      - "{{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak-realm.json"
  when: platform_application_keycloak_realm_before.rc != 0
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak.hosts"
  changed_when: true
  no_log: true

- name: Add missing reviewed Sprint 2 identities without replacing the realm
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kcadm }}"
      - create
      - partialImport
      - --realm
      - "{{ platform_application_keycloak_realm }}"
      - --set
      - ifResourceExists=SKIP
      - --token
      - "{{ platform_application_keycloak_admin_token }}"
      - --config
      - "{{ platform_application_keycloak_config }}"
      - --file
      - "{{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak-realm.json"
  when: platform_application_keycloak_realm_before.rc == 0
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak.hosts"
  changed_when: true
  no_log: true

- name: Load the reviewed Sprint 2 identity seed
  ansible.builtin.slurp:
    src: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak-realm.json"
  register: platform_application_keycloak_seed_file
  changed_when: false
  no_log: true

- name: Bind the reviewed Sprint 2 identity seed
  ansible.builtin.set_fact:
    platform_application_keycloak_seed: >-
      {{ platform_application_keycloak_seed_file.content | b64decode | from_json }}
  no_log: true

- name: Require managed client and user credentials in the reviewed identity seed
  ansible.builtin.assert:
    that:
      - >-
        platform_application_keycloak_seed.clients
        | selectattr('clientId', 'equalto', platform_application_keycloak_client_id)
        | list
        | length == 1
      - >-
        platform_application_keycloak_required_users
        | difference(platform_application_keycloak_seed.users | map(attribute='username') | list)
        | length == 0
      - >-
        (platform_application_keycloak_seed.users
          | selectattr('username', 'equalto', item)
          | first).credentials
        | selectattr('type', 'equalto', 'password')
        | list
        | length == 1
      - >-
        (platform_application_keycloak_seed.users
          | selectattr('username', 'equalto', item)
          | first).firstName | default('') | length > 0
      - >-
        (platform_application_keycloak_seed.users
          | selectattr('username', 'equalto', item)
          | first).lastName | default('') | length > 0
      - >-
        (platform_application_keycloak_seed.users
          | selectattr('username', 'equalto', item)
          | first).email | default('') | length > 0
      - >-
        (platform_application_keycloak_seed.users
          | selectattr('username', 'equalto', item)
          | first).emailVerified | default(false) | bool
    fail_msg: PLATFORM_APPLICATION_KEYCLOAK_SEED_INVALID
  loop: "{{ platform_application_keycloak_required_users }}"
  no_log: true

- name: Read back Sprint 2 Keycloak realm
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kcadm }}"
      - get
      - "realms/{{ platform_application_keycloak_realm }}"
      - --token
      - "{{ platform_application_keycloak_admin_token }}"
      - --config
      - "{{ platform_application_keycloak_config }}"
  register: platform_application_keycloak_realm_after
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak.hosts"
  check_mode: false
  changed_when: false
  no_log: true

- name: Require exact active Keycloak realm identity
  ansible.builtin.assert:
    that:
      - (platform_application_keycloak_realm_after.stdout | from_json).realm == platform_application_keycloak_realm
      - (platform_application_keycloak_realm_after.stdout | from_json).enabled | bool
      - (platform_application_keycloak_realm_after.stdout | from_json).sslRequired in ['external', 'all']
    fail_msg: PLATFORM_APPLICATION_KEYCLOAK_REALM_INVALID
  no_log: true

- name: Read back Sprint 2 Keycloak client
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kcadm }}"
      - get
      - clients
      - --realm
      - "{{ platform_application_keycloak_realm }}"
      - --query
      - "clientId={{ platform_application_keycloak_client_id }}"
      - --fields
      - id,clientId,enabled
      - --token
      - "{{ platform_application_keycloak_admin_token }}"
      - --config
      - "{{ platform_application_keycloak_config }}"
  register: platform_application_keycloak_client
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak.hosts"
  check_mode: false
  changed_when: false
  no_log: true

- name: Read back Sprint 2 Keycloak roles
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kcadm }}"
      - get
      - roles
      - --realm
      - "{{ platform_application_keycloak_realm }}"
      - --fields
      - name
      - --token
      - "{{ platform_application_keycloak_admin_token }}"
      - --config
      - "{{ platform_application_keycloak_config }}"
  register: platform_application_keycloak_roles
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak.hosts"
  check_mode: false
  changed_when: false
  no_log: true

- name: Read back Sprint 2 Keycloak users
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kcadm }}"
      - get
      - users
      - --realm
      - "{{ platform_application_keycloak_realm }}"
      - --fields
      - id,username,enabled
      - --token
      - "{{ platform_application_keycloak_admin_token }}"
      - --config
      - "{{ platform_application_keycloak_config }}"
  register: platform_application_keycloak_users
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak.hosts"
  check_mode: false
  changed_when: false
  no_log: true

- name: Refresh retained Keycloak administration before managed identity updates
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kcadm }}"
      - config
      - credentials
      - --server
      - "{{ platform_application_keycloak_server }}"
      - --realm
      - "{{ platform_application_keycloak_admin_realm }}"
      - --user
      - "{{ platform_application_keycloak_username }}"
      - --password
      - "{{ platform_application_keycloak_password }}"
      - --config
      - "{{ platform_application_keycloak_config }}"
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ platform_application_report_root }}/{{ platform_application_run_id }}/keycloak.hosts"
  register: platform_application_keycloak_refresh
  check_mode: false
  changed_when: false
  failed_when: >-
    platform_application_keycloak_refresh.rc != 0 or
    platform_application_keycloak_refresh.stderr is search('HTTP [45][0-9][0-9]')
  no_log: true

- name: Load the refreshed isolated Keycloak administration session
  ansible.builtin.slurp:
    src: "{{ platform_application_keycloak_config }}"
  register: platform_application_keycloak_refreshed_session_file
  changed_when: false
  no_log: true

- name: Bind the refreshed Keycloak administration token explicitly
  ansible.builtin.set_fact:
    platform_application_keycloak_admin_token: >-
      {{
        ((platform_application_keycloak_refreshed_session_file.content | b64decode | from_json)
          .get('endpoints', {})
          .get(platform_application_keycloak_server, {})
          .get(platform_application_keycloak_admin_realm, {})
          .get('token', ''))
      }}
  no_log: true

- name: Require the refreshed Keycloak administration token
  ansible.builtin.assert:
    that:
      - platform_application_keycloak_admin_token is string
      - platform_application_keycloak_admin_token.split('.') | length == 3
    fail_msg: PLATFORM_APPLICATION_KEYCLOAK_REFRESHED_TOKEN_INVALID
  no_log: true

- name: Reconcile the managed Sprint 2 OIDC client without replacing the realm
  ansible.builtin.uri:
    url: >-
      {{ platform_application_keycloak_server }}/admin/realms/{{ platform_application_keycloak_realm
      }}/clients/{{ (platform_application_keycloak_client.stdout | from_json | first).id }}
    method: PUT
    headers:
      Authorization: "Bearer {{ platform_application_keycloak_admin_token }}"
    body_format: json
    body: >-
      {{ platform_application_keycloak_seed.clients
        | selectattr('clientId', 'equalto', platform_application_keycloak_client_id)
        | first }}
    ca_path: "{{ platform_application_keycloak_ca_file }}"
    status_code: 204
    return_content: false
  no_log: true

- name: Reconcile managed Sprint 2 demo credentials without replacing the realm
  ansible.builtin.uri:
    url: >-
      {{ platform_application_keycloak_server }}/admin/realms/{{ platform_application_keycloak_realm
      }}/users/{{ item.id }}/reset-password
    method: PUT
    headers:
      Authorization: "Bearer {{ platform_application_keycloak_admin_token }}"
    body_format: json
    body:
      type: password
      temporary: false
      value: >-
        {{ ((platform_application_keycloak_seed.users
          | selectattr('username', 'equalto', item.username)
          | first).credentials
          | selectattr('type', 'equalto', 'password')
          | first).value }}
    ca_path: "{{ platform_application_keycloak_ca_file }}"
    status_code: 204
    return_content: false
  loop: >-
    {{ platform_application_keycloak_users.stdout | from_json
      | selectattr('username', 'in', platform_application_keycloak_required_users)
      | list }}
  loop_control:
    label: "{{ item.username }}"
  no_log: true

- name: Reconcile managed Sprint 2 demo profiles without replacing the realm
  ansible.builtin.uri:
    url: >-
      {{ platform_application_keycloak_server }}/admin/realms/{{ platform_application_keycloak_realm
      }}/users/{{ item.id }}
    method: PUT
    headers:
      Authorization: "Bearer {{ platform_application_keycloak_admin_token }}"
    body_format: json
    body:
      id: "{{ item.id }}"
      username: "{{ item.username }}"
      enabled: true
      firstName: >-
        {{ (platform_application_keycloak_seed.users
          | selectattr('username', 'equalto', item.username)
          | first).firstName }}
      lastName: >-
        {{ (platform_application_keycloak_seed.users
          | selectattr('username', 'equalto', item.username)
          | first).lastName }}
      email: >-
        {{ (platform_application_keycloak_seed.users
          | selectattr('username', 'equalto', item.username)
          | first).email }}
      emailVerified: true
      requiredActions: >-
        {{ (platform_application_keycloak_seed.users
          | selectattr('username', 'equalto', item.username)
          | first).requiredActions | default([]) }}
    ca_path: "{{ platform_application_keycloak_ca_file }}"
    status_code: 204
    return_content: false
  loop: >-
    {{ platform_application_keycloak_users.stdout | from_json
      | selectattr('username', 'in', platform_application_keycloak_required_users)
      | list }}
  loop_control:
    label: "{{ item.username }}"
  no_log: true

- name: Require the reviewed Sprint 2 identity surface
  ansible.builtin.assert:
    that:
      - platform_application_keycloak_client.stdout | from_json | length == 1
      - (platform_application_keycloak_client.stdout | from_json | first).clientId == platform_application_keycloak_client_id
      - (platform_application_keycloak_client.stdout | from_json | first).enabled | bool
      - >-
        platform_application_keycloak_required_roles
        | difference(platform_application_keycloak_roles.stdout
          | from_json | map(attribute='name') | list)
        | length == 0
      - >-
        platform_application_keycloak_required_users
        | difference(platform_application_keycloak_users.stdout
          | from_json | selectattr('enabled') | map(attribute='username') | list)
        | length == 0
    fail_msg: PLATFORM_APPLICATION_KEYCLOAK_SURFACE_INVALID
  no_log: true

- name: Reconcile application namespace without deleting retained state
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ platform_application_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver
          labweaver.io/managed: "true"
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted

- name: Read the immutable Sprint 2 VM base DataVolume
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    namespace: "{{ platform_application_namespace }}"
    name: "{{ platform_application_lock.platform_vm_base.seed_data_volume_name }}"
  register: platform_application_vm_base_dv

- name: Reject a conflicting Sprint 2 VM base DataVolume
  ansible.builtin.assert:
    that:
      - platform_application_vm_base_dv.resources | length <= 1
      - >-
        platform_application_vm_base_dv.resources | length == 0 or
        platform_application_vm_base_dv.resources[0].spec.source.registry.url ==
        platform_application_lock.platform_vm_base.registry_url
      - >-
        platform_application_vm_base_dv.resources | length == 0 or
        platform_application_vm_base_dv.resources[0].spec.storage.storageClassName ==
        platform_application_lock.platform_vm_base.storage_class_name
      - >-
        platform_application_vm_base_dv.resources | length == 0 or
        platform_application_vm_base_dv.resources[0].metadata.annotations['labweaver.io/disk-sha256'] ==
        platform_application_lock.platform_vm_base.disk_sha256
    fail_msg: PLATFORM_VM_BASE_DATAVOLUME_CONFLICT

- name: Import the immutable Sprint 2 VM base disk when absent
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    definition:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: "{{ platform_application_lock.platform_vm_base.seed_data_volume_name }}"
        namespace: "{{ platform_application_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver
          labweaver.io/sprint: platform
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
          labweaver.io/source-release: "{{ platform_application_lock.platform_vm_base.release }}"
          labweaver.io/source-registry: "{{ platform_application_lock.platform_vm_base.registry_url }}"
          labweaver.io/disk-sha256: "{{ platform_application_lock.platform_vm_base.disk_sha256 }}"
      spec:
        source:
          registry:
            url: "{{ platform_application_lock.platform_vm_base.registry_url }}"
            pullMethod: node
        storage:
          storageClassName: "{{ platform_application_lock.platform_vm_base.storage_class_name }}"
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: "{{ platform_application_lock.platform_vm_base.storage_request }}"
  when: platform_application_vm_base_dv.resources | length == 0

- name: Reconcile immediate binding for the immutable Sprint 2 VM base
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    definition:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: "{{ platform_application_lock.platform_vm_base.seed_data_volume_name }}"
        namespace: "{{ platform_application_namespace }}"
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"

- name: Wait for the immutable Sprint 2 VM base claim
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ platform_application_namespace }}"
    name: "{{ platform_application_lock.platform_vm_base.seed_data_volume_name }}"
  register: platform_application_vm_base_claim
  until: platform_application_vm_base_claim.resources | length == 1
  retries: 30
  delay: 2

- name: Reconcile immediate binding on the immutable Sprint 2 VM base claim
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ platform_application_lock.platform_vm_base.seed_data_volume_name }}"
        namespace: "{{ platform_application_namespace }}"
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"

- name: Wait for the immutable Sprint 2 VM base import
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    namespace: "{{ platform_application_namespace }}"
    name: "{{ platform_application_lock.platform_vm_base.seed_data_volume_name }}"
  register: platform_application_vm_base_ready
  until: >-
    platform_application_vm_base_ready.resources | length == 1 and
    platform_application_vm_base_ready.resources[0].status.phase | default('') == 'Succeeded'
  retries: 120
  delay: 5

- name: Read the immutable Sprint 2 VM base DataSource
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataSource
    namespace: "{{ platform_application_namespace }}"
    name: "{{ platform_application_lock.platform_vm_base.data_source_name }}"
  register: platform_application_vm_base_source

- name: Reject a conflicting Sprint 2 VM base DataSource
  ansible.builtin.assert:
    that:
      - platform_application_vm_base_source.resources | length <= 1
      - >-
        platform_application_vm_base_source.resources | length == 0 or
        (platform_application_vm_base_source.resources[0].spec.source.pvc.name ==
         platform_application_lock.platform_vm_base.seed_data_volume_name and
         platform_application_vm_base_source.resources[0].spec.source.pvc.namespace ==
         platform_application_namespace)
    fail_msg: PLATFORM_VM_BASE_DATASOURCE_CONFLICT

- name: Publish the immutable Sprint 2 VM base DataSource when absent
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    definition:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataSource
      metadata:
        name: "{{ platform_application_lock.platform_vm_base.data_source_name }}"
        namespace: "{{ platform_application_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver
          labweaver.io/sprint: platform
        annotations:
          labweaver.io/source-release: "{{ platform_application_lock.platform_vm_base.release }}"
          labweaver.io/source-registry: "{{ platform_application_lock.platform_vm_base.registry_url }}"
          labweaver.io/disk-sha256: "{{ platform_application_lock.platform_vm_base.disk_sha256 }}"
      spec:
        source:
          pvc:
            name: "{{ platform_application_lock.platform_vm_base.seed_data_volume_name }}"
            namespace: "{{ platform_application_namespace }}"
  when: platform_application_vm_base_source.resources | length == 0

- name: Read back the immutable Sprint 2 VM base DataSource
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataSource
    namespace: "{{ platform_application_namespace }}"
    name: "{{ platform_application_lock.platform_vm_base.data_source_name }}"
  register: platform_application_vm_base_source_readback

- name: Require the immutable Sprint 2 VM base identity
  ansible.builtin.assert:
    that:
      - platform_application_vm_base_source_readback.resources | length == 1
      - platform_application_vm_base_source_readback.resources[0].spec.source.pvc.name == platform_application_lock.platform_vm_base.seed_data_volume_name
      - platform_application_vm_base_source_readback.resources[0].spec.source.pvc.namespace == platform_application_namespace
      - >-
        platform_application_vm_base_source_readback.resources[0]
        .metadata.annotations['labweaver.io/source-registry'] ==
        platform_application_lock.platform_vm_base.registry_url
      - >-
        platform_application_vm_base_source_readback.resources[0]
        .metadata.annotations['labweaver.io/disk-sha256'] ==
        platform_application_lock.platform_vm_base.disk_sha256
    fail_msg: PLATFORM_VM_BASE_IDENTITY_INVALID

- name: Reconcile the application Harbor pull credential
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ platform_application_image_pull_secret_name }}"
        namespace: "{{ platform_application_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver
          labweaver.io/sprint: platform
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{ {'auths': {platform_application_harbor_registry: {
               'username': platform_application_harbor_username,
               'password': platform_application_harbor_password,
               'auth': (platform_application_harbor_username + ':' + platform_application_harbor_password)
                 | b64encode}}} | to_json | b64encode }}
  no_log: true

- name: Reconcile the application portal TLS credential
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ platform_application_portal_tls_secret_name }}"
        namespace: "{{ platform_application_portal_route_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver
          labweaver.io/sprint: platform
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ lookup('ansible.builtin.file', platform_application_portal_tls_certificate_file) | b64encode }}"
        tls.key: "{{ lookup('ansible.builtin.file', platform_application_portal_tls_key_file) | b64encode }}"
  when: platform_application_portal_route_name | length > 0
  no_log: true

- name: Install the Sprint 2 portal authority on the retained router
  ansible.builtin.copy:
    src: "{{ platform_application_portal_tls_ca_file }}"
    dest: >-
      {{ hostvars[groups['routers'] | first].platform_application_node_ca_trust_anchors_dir
         }}/labweaver-platform-portal.crt
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ groups['routers'] | first }}"
  become: true
  notify: Refresh retained router trust
  when: platform_application_portal_route_name | length > 0

- name: Apply retained router trust before portal verification
  ansible.builtin.meta: flush_handlers
  when: platform_application_portal_route_name | length > 0

- name: Inspect the retained application Gateway
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    namespace: "{{ platform_application_portal_route_namespace }}"
    name: "{{ platform_application_portal_gateway_name }}"
  register: platform_application_portal_gateway
  when: platform_application_portal_route_name | length > 0

- name: Label the reviewed portal namespace for bounded Gateway routes
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ platform_application_portal_route_namespace }}"
        labels:
          labweaver.io/gateway-routes: allowed
  when: platform_application_portal_route_name | length > 0

- name: Require exactly one retained application Gateway
  ansible.builtin.assert:
    that:
      - platform_application_portal_gateway.resources | length == 1
    fail_msg: PLATFORM_APPLICATION_PORTAL_GATEWAY_MISSING
  when: platform_application_portal_route_name | length > 0

- name: Select an existing Sprint 2 HTTPS listener
  ansible.builtin.set_fact:
    platform_application_portal_gateway_listener: >-
      {{ platform_application_portal_gateway.resources[0].spec.listeners
         | selectattr('name', 'equalto', platform_application_portal_gateway_listener_name)
         | list }}
  when: platform_application_portal_route_name | length > 0

- name: Add the bounded Sprint 2 HTTPS listener when absent
  kubernetes.core.k8s_json_patch:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    namespace: "{{ platform_application_portal_route_namespace }}"
    name: "{{ platform_application_portal_gateway_name }}"
    patch:
      - op: add
        path: /spec/listeners/-
        value:
          name: "{{ platform_application_portal_gateway_listener_name }}"
          protocol: HTTPS
          port: 443
          hostname: "{{ platform_application_portal_hostname }}"
          tls:
            mode: Terminate
            certificateRefs:
              - group: ""
                kind: Secret
                name: "{{ platform_application_portal_tls_secret_name }}"
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  labweaver.io/gateway-routes: allowed
  when:
    - platform_application_portal_route_name | length > 0
    - platform_application_portal_gateway_listener | length == 0

- name: Read back the retained application Gateway after listener adoption
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    namespace: "{{ platform_application_portal_route_namespace }}"
    name: "{{ platform_application_portal_gateway_name }}"
  register: platform_application_portal_gateway_after
  when: platform_application_portal_route_name | length > 0

- name: Require the exact bounded Sprint 2 HTTPS listener
  ansible.builtin.assert:
    that:
      - platform_application_portal_gateway_listener_after | length == 1
      - platform_application_portal_gateway_listener_after[0].protocol == 'HTTPS'
      - platform_application_portal_gateway_listener_after[0].port | int == 443
      - platform_application_portal_gateway_listener_after[0].hostname == platform_application_portal_hostname
      - platform_application_portal_gateway_listener_after[0].tls.mode == 'Terminate'
      - platform_application_portal_gateway_listener_after[0].tls.certificateRefs | length == 1
      - platform_application_portal_gateway_listener_after[0].tls.certificateRefs[0].name == platform_application_portal_tls_secret_name
      - platform_application_portal_gateway_listener_after[0].allowedRoutes.namespaces.from == 'Selector'
      - >-
        platform_application_portal_gateway_listener_after[0].allowedRoutes.namespaces.selector.matchLabels['labweaver.io/gateway-routes']
        == 'allowed'
    fail_msg: PLATFORM_APPLICATION_PORTAL_GATEWAY_CONFLICT
  vars:
    platform_application_portal_gateway_listener_after: >-
      {{ platform_application_portal_gateway_after.resources[0].spec.listeners
         | selectattr('name', 'equalto', platform_application_portal_gateway_listener_name)
         | list }}
  when: platform_application_portal_route_name | length > 0

- name: Persist the MetalLB sharing key on the retained application Gateway
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    merge_type: merge
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: "{{ platform_application_portal_gateway_name }}"
        namespace: "{{ platform_application_portal_route_namespace }}"
      spec:
        infrastructure:
          annotations:
            metallb.io/allow-shared-ip: "{{ platform_application_ssh_shared_ip_key }}"
  when: platform_application_ssh_load_balancer_ip | length > 0

- name: Read the retained application Gateway load balancer Service
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: v1
    kind: Service
    namespace: "{{ platform_application_portal_route_namespace }}"
    label_selectors:
      - "gateway.networking.k8s.io/gateway-name={{ platform_application_portal_gateway_name }}"
  register: platform_application_gateway_services
  when: platform_application_ssh_load_balancer_ip | length > 0

- name: Require the retained Gateway to own the reviewed shared address
  ansible.builtin.assert:
    that:
      - platform_application_gateway_services.resources | length == 1
      - platform_application_gateway_services.resources[0].spec.type == 'LoadBalancer'
      - platform_application_gateway_services.resources[0].status.loadBalancer.ingress | length == 1
      - platform_application_gateway_services.resources[0].status.loadBalancer.ingress[0].ip == platform_application_ssh_load_balancer_ip
    fail_msg: PLATFORM_APPLICATION_SSH_SHARED_IP_CONFLICT
  when: platform_application_ssh_load_balancer_ip | length > 0

- name: Reconcile the sharing key on the retained Gateway Service
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    merge_type: merge
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ platform_application_gateway_services.resources[0].metadata.name }}"
        namespace: "{{ platform_application_portal_route_namespace }}"
        annotations:
          metallb.io/allow-shared-ip: "{{ platform_application_ssh_shared_ip_key }}"
  when: platform_application_ssh_load_balancer_ip | length > 0

- name: Apply reviewed application configuration without namespace reset
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    apply: true
    definition: "{{ item }}"
  loop: "{{ platform_application_configuration_objects }}"
  when: item.metadata.name != 'evaluation-service-config'
  no_log: true

- name: Apply the package-bound evaluation configuration
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata: >-
        {{ platform_application_evaluation_configuration_object.metadata }}
      data:
        config.yaml: >-
          {{
            (
              platform_application_evaluation_configuration_object.data['config.yaml']
              | from_yaml
              | combine(
                  {
                    'coordinator': (
                      (
                        platform_application_evaluation_configuration_object.data['config.yaml']
                        | from_yaml
                      ).coordinator
                      | combine(
                          {
                            'workerImage':
                              platform_application_evaluation_worker_image
                          }
                        )
                    )
                  }
                )
              | to_nice_yaml(indent=2, sort_keys=false)
            )
          }}
        worker.yaml: >-
          {{
            platform_application_evaluation_configuration_object.data['worker.yaml']
          }}
  no_log: true

- name: Reconcile the evaluation worker namespace without deleting retained state
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ platform_application_evaluation_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver
          labweaver.io/managed: "true"
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted

- name: Reconcile the permanent evaluation runner namespace default deny
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: oj-runner-default-deny
        namespace: "{{ platform_application_evaluation_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver
          app.kubernetes.io/managed-by: ansible
          labweaver.io/sprint: platform
      spec:
        podSelector: {}
        policyTypes: [Ingress, Egress]
        ingress: []
        egress: []

- name: Read back the permanent evaluation runner namespace default deny
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: "{{ platform_application_evaluation_namespace }}"
    name: oj-runner-default-deny
  register: platform_application_evaluation_default_deny

- name: Require the permanent evaluation runner namespace default deny
  ansible.builtin.assert:
    that:
      - >-
        (
          ansible_check_mode and
          platform_application_evaluation_default_deny.resources | length == 0
        ) or
        (
          platform_application_evaluation_default_deny.resources | length == 1 and
          platform_application_evaluation_default_deny.resources[0].spec.podSelector == {} and
          platform_application_evaluation_default_deny.resources[0].spec.policyTypes | sort == ['Egress', 'Ingress'] and
          platform_application_evaluation_default_deny.resources[0].spec.ingress | default([]) == [] and
          platform_application_evaluation_default_deny.resources[0].spec.egress | default([]) == []
        )
    fail_msg: PLATFORM_APPLICATION_EVALUATION_DEFAULT_DENY_INVALID

- name: Reconcile the permanent ansible probe namespace default deny
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ansible-probe-default-deny
        namespace: "{{ platform_application_evaluation_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver
          app.kubernetes.io/managed-by: ansible
          labweaver.io/sprint: platform
      spec:
        podSelector: {}
        policyTypes: [Ingress, Egress]
        ingress: []
        egress: []

- name: Read back the permanent ansible probe namespace default deny
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: "{{ platform_application_evaluation_namespace }}"
    name: ansible-probe-default-deny
  register: platform_application_probe_default_deny

- name: Require the permanent ansible probe namespace default deny
  ansible.builtin.assert:
    that:
      - >-
        (
          ansible_check_mode and
          platform_application_probe_default_deny.resources | length == 0
        ) or
        (
          platform_application_probe_default_deny.resources | length == 1 and
          platform_application_probe_default_deny.resources[0].spec.podSelector == {} and
          platform_application_probe_default_deny.resources[0].spec.policyTypes | sort == ['Egress', 'Ingress'] and
          platform_application_probe_default_deny.resources[0].spec.ingress | default([]) == [] and
          platform_application_probe_default_deny.resources[0].spec.egress | default([]) == []
        )
    fail_msg: PLATFORM_APPLICATION_PROBE_DEFAULT_DENY_INVALID

- name: Require the evaluation worker to use the platform image pull identity
  ansible.builtin.assert:
    that:
      - platform_application_evaluation_pull_secret_name == platform_application_image_pull_secret_name
    fail_msg: PLATFORM_APPLICATION_EVALUATION_REGISTRY_PULL_CONFIG_INVALID
  no_log: true

- name: Reconcile the evaluation freeze worker registry pull secret
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ platform_application_evaluation_pull_secret_name }}"
        namespace: "{{ platform_application_evaluation_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver
          app.kubernetes.io/managed-by: ansible
          labweaver.io/sprint: platform
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{ {'auths': {platform_application_harbor_registry: {
               'username': platform_application_harbor_username,
               'password': platform_application_harbor_password,
               'auth': (platform_application_harbor_username + ':' + platform_application_harbor_password)
                 | b64encode}}} | to_json | b64encode }}
  no_log: true

- name: Reconcile the retained MinIO transport policy for Sprint 2 platform clients
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: admin-probes
        namespace: "{{ platform_application_data_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver
          labweaver.io/sprint: platform
      spec:
        endpointSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [postgres, nats, minio]
        ingress:
          - fromEntities: [host, remote-node]
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
                  - port: "4222"
                    protocol: TCP
                  - port: "9000"
                    protocol: TCP
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ platform_application_namespace }}"
                  app.kubernetes.io/name: control-service
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ platform_application_namespace }}"
                  app.kubernetes.io/name: agent-service
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ platform_application_namespace }}"
                  app.kubernetes.io/name: build-executor
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ platform_application_namespace }}"
                  app.kubernetes.io/name: environment-service
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ platform_application_namespace }}"
                  app.kubernetes.io/name: container-executor
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ platform_application_namespace }}"
                  app.kubernetes.io/name: evaluation-service
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ platform_application_namespace }}"
                  app.kubernetes.io/name: kubevirt-executor
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ platform_application_evaluation_namespace }}"
                  app.kubernetes.io/name: evaluation-freeze-worker
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
                  - port: "4222"
                    protocol: TCP
                  - port: "9000"
                    protocol: TCP
          # Browser uploads terminate at the Web nginx object-store proxy. Give
          # that exact workload access only to MinIO rather than adding it to
          # the broader owner-service transport rule above.
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ platform_application_namespace }}"
                  app.kubernetes.io/name: web
            toPorts:
              - ports:
                  - port: "9000"
                    protocol: TCP

- name: Inspect the retained CDI clone source network policy
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: "{{ platform_application_namespace }}"
    name: cdi-clone-source
  register: platform_application_cdi_clone_source_policy

- name: Require the retained CDI clone source network policy to match the chart
  ansible.builtin.assert:
    that:
      - platform_application_cdi_clone_source_policy.resources | length <= 1
      - >-
        platform_application_cdi_clone_source_policy.resources | length == 0
        or
        platform_application_cdi_clone_source_policy.resources[0].spec.podSelector.matchLabels
        == {'cdi.kubevirt.io': 'cdi-clone-source'}
      - >-
        platform_application_cdi_clone_source_policy.resources | length == 0
        or
        platform_application_cdi_clone_source_policy.resources[0].spec.policyTypes
        == ['Egress']
      - >-
        platform_application_cdi_clone_source_policy.resources | length == 0
        or
        platform_application_cdi_clone_source_policy.resources[0].spec.egress | length == 2
      - >-
        platform_application_cdi_clone_source_policy.resources | length == 0
        or
        platform_application_cdi_clone_source_policy.resources[0].spec.egress[0].to[0].namespaceSelector.matchLabels
        == {'kubernetes.io/metadata.name': 'kube-system'}
      - >-
        platform_application_cdi_clone_source_policy.resources | length == 0
        or
        platform_application_cdi_clone_source_policy.resources[0].spec.egress[0].to[0].podSelector.matchLabels
        == {'k8s-app': 'kube-dns'}
      - >-
        platform_application_cdi_clone_source_policy.resources | length == 0
        or
        platform_application_cdi_clone_source_policy.resources[0].spec.egress[1].to[0].namespaceSelector.matchLabels
        == {'labweaver.io/environment': 'true'}
      - >-
        platform_application_cdi_clone_source_policy.resources | length == 0
        or
        platform_application_cdi_clone_source_policy.resources[0].spec.egress[1].to[0].podSelector.matchLabels
        == {'cdi.kubevirt.io': 'cdi-upload-server'}
    fail_msg: PLATFORM_APPLICATION_CDI_CLONE_SOURCE_POLICY_CONFLICT

- name: Adopt the exact retained CDI clone source network policy into the Helm release
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    state: present
    merge_type: merge
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: cdi-clone-source
        namespace: "{{ platform_application_namespace }}"
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: "{{ platform_application_release_name }}"
          meta.helm.sh/release-namespace: "{{ platform_application_namespace }}"
  when: platform_application_cdi_clone_source_policy.resources | length == 1

- name: Copy reviewed Sprint 2 Helm chart
  ansible.builtin.copy:
    src: "{{ platform_application_chart_source }}/"
    dest: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/chart/"
    owner: root
    group: root
    mode: preserve

- name: Copy reviewed private values files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ platform_application_values_files }}"
  no_log: true

- name: Build immutable Helm arguments
  ansible.builtin.set_fact:
    platform_application_values_argv: >-
      {%- set values = [] -%}
      {%- for values_file in platform_application_values_files -%}
      {%- set _ = values.append(
        '--values=' + platform_application_report_root + '/' + platform_application_run_id
        + '/' + (values_file | basename)) -%}
      {%- endfor -%}
      {{ values }}
    platform_application_image_argv: >-
      {%- set values = [
        '--set-string',
        'imagePullSecrets[0].name=' + platform_application_image_pull_secret_name,
        '--set-string',
        'deploymentIdentity.configurationBundleSha256=' + platform_application_configuration_bundle_sha256
      ] -%}
      {%- for image in platform_application_package.images -%}
      {%- set _ = values.extend(['--set-string', 'images.' + (image.component | replace('-', '_')) + '=' + image.reference]) -%}
      {%- endfor -%}
      {{ values }}
    platform_application_route_argv: >-
      {%- set values = [] -%}
      {%- if platform_application_portal_route_name | length > 0 -%}
      {%- set _ = values.extend([
        '--set', 'portalRoute.enabled=true',
        '--set-string', 'portalRoute.namespace=' + platform_application_portal_route_namespace,
        '--set-string', 'portalRoute.name=' + platform_application_portal_route_name,
        '--set-string', 'portalRoute.hostname=' + platform_application_portal_hostname,
        '--set-string', 'portalRoute.gatewayName=' + platform_application_portal_gateway_name,
        '--set-string', 'portalRoute.gatewaySectionName=' + platform_application_portal_gateway_listener_name
      ]) -%}
      {%- endif -%}
      {%- if platform_application_object_store_route_enabled -%}
      {%- set _ = values.extend([
        '--set', 'objectStoreRoute.enabled=true',
        '--set-string', 'objectStoreRoute.namespace=' + platform_application_data_namespace,
        '--set-string', 'objectStoreRoute.serviceName=' + platform_application_object_store_service_name,
        '--set', 'objectStoreRoute.servicePort=' + (platform_application_object_store_service_port | string),
        '--set-string', 'objectStoreRoute.pathPrefix=/' + platform_application_minio_bucket,
        '--set-string', 'objectStoreRoute.backendHostname=' + platform_application_object_store_backend_hostname,
        '--set-file', 'objectStoreRoute.caCertificate=' + platform_application_minio_ca_file,
        '--set-string', 'workloads.control-service.externalEgress[0].cidr=' + platform_application_object_store_external_cidr,
        '--set', 'workloads.control-service.externalEgress[0].ports[0]=443'
      ]) -%}
      {%- endif -%}
      {%- if platform_application_ssh_load_balancer_ip | length > 0 -%}
      {%- set _ = values.extend([
        '--set', 'sshGatewayService.enabled=true',
        '--set-string', 'sshGatewayService.loadBalancerIP=' + platform_application_ssh_load_balancer_ip,
        '--set-string', 'sshGatewayService.sharedIPKey=' + platform_application_ssh_shared_ip_key
      ]) -%}
      {%- endif -%}
      {{ values }}

- name: Atomically deploy the immutable Sprint 2 profile
  ansible.builtin.command:
    argv: >-
      {{ [platform_application_helm, '--kubeconfig', platform_application_kubeconfig,
          'upgrade', '--install', platform_application_release_name,
          platform_application_report_root + '/' + platform_application_run_id + '/chart',
          '--namespace', platform_application_namespace, '--take-ownership', '--atomic', '--wait',
          '--timeout', platform_application_rollout_timeout]
          + platform_application_values_argv + platform_application_image_argv
          + platform_application_route_argv }}
  changed_when: true

- name: Deploy the identical profile a second time
  ansible.builtin.command:
    argv: >-
      {{ [platform_application_helm, '--kubeconfig', platform_application_kubeconfig,
          'upgrade', '--install', platform_application_release_name,
          platform_application_report_root + '/' + platform_application_run_id + '/chart',
          '--namespace', platform_application_namespace, '--take-ownership', '--atomic', '--wait',
          '--timeout', platform_application_rollout_timeout]
          + platform_application_values_argv + platform_application_image_argv
          + platform_application_route_argv }}
  changed_when: true

- name: Verify every Sprint 2 workload rollout
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kubectl }}"
      - --kubeconfig
      - "{{ platform_application_kubeconfig }}"
      - --namespace
      - "{{ platform_application_namespace }}"
      - rollout
      - status
      - "deployment/{{ item }}"
      - "--timeout={{ platform_application_rollout_timeout }}"
  loop: "{{ platform_application_workloads }}"
  when: not ansible_check_mode
  check_mode: false
  changed_when: false

- name: Read back exact deployment image set
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kubectl }}"
      - --kubeconfig
      - "{{ platform_application_kubeconfig }}"
      - --namespace
      - "{{ platform_application_namespace }}"
      - get
      - deployments
      - -l
      - app.kubernetes.io/instance={{ platform_application_release_name }}
      - -o
      - json
  register: platform_application_deployments
  when: not ansible_check_mode
  check_mode: false
  changed_when: false

- name: Require exact workload count and digest-only images
  ansible.builtin.assert:
    that:
      - (platform_application_deployments.stdout | from_json)['items'] | length == platform_application_workloads | length
      - (platform_application_deployments.stdout | from_json)['items'] | map(attribute='metadata.name') | sort == platform_application_workloads | sort
      - >-
        (platform_application_deployments.stdout | from_json)['items']
        | map(attribute='spec.template.spec.containers') | map('first')
        | map(attribute='image')
        | select('match', '^.+@sha256:[0-9a-f]{64}$') | list | length
        == platform_application_workloads | length
    fail_msg: PLATFORM_APPLICATION_DEPLOYMENT_READBACK_INVALID
  when: not ansible_check_mode

- name: Read back the adopted portal route
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kubectl }}"
      - --kubeconfig
      - "{{ platform_application_kubeconfig }}"
      - --namespace
      - "{{ platform_application_portal_route_namespace }}"
      - get
      - httproute
      - "{{ platform_application_portal_route_name }}"
      - --output=json
  register: platform_application_portal_route
  when:
    - platform_application_portal_route_name | length > 0
    - not ansible_check_mode
  check_mode: false
  changed_when: false

- name: Require the adopted portal route accepted and resolved
  ansible.builtin.assert:
    that:
      - >-
        (platform_application_portal_route.stdout | from_json).status.parents
        | map(attribute='conditions') | flatten
        | selectattr('type', 'equalto', 'Accepted')
        | selectattr('status', 'equalto', 'True') | list | length > 0
      - >-
        (platform_application_portal_route.stdout | from_json).status.parents
        | map(attribute='conditions') | flatten
        | selectattr('type', 'equalto', 'ResolvedRefs')
        | selectattr('status', 'equalto', 'True') | list | length > 0
    fail_msg: PLATFORM_APPLICATION_PORTAL_ROUTE_INVALID
  when:
    - platform_application_portal_route_name | length > 0
    - not ansible_check_mode

- name: Read back the object store web proxy configuration
  ansible.builtin.command:
    argv:
      - "{{ platform_application_kubectl }}"
      - --kubeconfig
      - "{{ platform_application_kubeconfig }}"
      - --namespace
      - "{{ platform_application_namespace }}"
      - get
      - configmap
      - "{{ platform_application_release_name }}-object-store-ca"
      - --output=json
  register: platform_application_object_store_proxy
  when:
    - platform_application_object_store_route_enabled
    - not ansible_check_mode
  check_mode: false
  changed_when: false

- name: Require the verified object store web proxy configuration
  ansible.builtin.assert:
    that:
      - (platform_application_object_store_proxy.stdout | from_json).data['ca.crt'] | length > 0
      - "'proxy_ssl_verify on;' in (platform_application_object_store_proxy.stdout | from_json).data['object-store.conf']"
      - "'proxy_request_buffering off;' in (platform_application_object_store_proxy.stdout | from_json).data['object-store.conf']"
      - "'proxy_set_header Host $http_host;' in (platform_application_object_store_proxy.stdout | from_json).data['object-store.conf']"
    fail_msg: PLATFORM_APPLICATION_OBJECT_STORE_ROUTE_INVALID
  when:
    - platform_application_object_store_route_enabled
    - not ansible_check_mode

- name: Wait for the OpenSSH Gateway shared load balancer address
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_application_kubeconfig }}"
    api_version: v1
    kind: Service
    namespace: "{{ platform_application_namespace }}"
    name: openssh-gateway
  register: platform_application_ssh_service
  until:
    - platform_application_ssh_service.resources | length == 1
    - platform_application_ssh_service.resources[0].status.loadBalancer.ingress | default([]) | length == 1
    - platform_application_ssh_service.resources[0].status.loadBalancer.ingress[0].ip | default('') == platform_application_ssh_load_balancer_ip
  retries: 30
  delay: 2
  when:
    - platform_application_ssh_load_balancer_ip | length > 0
    - not ansible_check_mode

- name: Require the exact OpenSSH Gateway shared Service contract
  ansible.builtin.assert:
    that:
      - platform_application_ssh_service.resources[0].spec.type == 'LoadBalancer'
      - platform_application_ssh_service.resources[0].spec.externalTrafficPolicy == 'Cluster'
      - platform_application_ssh_service.resources[0].metadata.annotations['metallb.io/allow-shared-ip'] == platform_application_ssh_shared_ip_key
      - platform_application_ssh_service.resources[0].spec.ports | selectattr('port', 'equalto', 2222) | list | length == 1
    fail_msg: PLATFORM_APPLICATION_SSH_LOAD_BALANCER_INVALID
  when:
    - platform_application_ssh_load_balancer_ip | length > 0
    - not ansible_check_mode

- name: Read final Helm revision
  ansible.builtin.command:
    argv:
      - "{{ platform_application_helm }}"
      - --kubeconfig
      - "{{ platform_application_kubeconfig }}"
      - history
      - "{{ platform_application_release_name }}"
      - --namespace
      - "{{ platform_application_namespace }}"
      - --max
      - "1"
      - --output
      - json
  register: platform_application_helm_history
  check_mode: false
  changed_when: false

- name: Hash application identity inputs
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - "{{ platform_application_package_manifest }}"
    - "{{ platform_application_migration_catalog }}"
    - "{{ platform_application_configuration_manifest }}"
    - "{{ platform_application_configuration_bundle }}"
  register: platform_application_identity_inputs
  delegate_to: localhost
  become: false

- name: Write sanitized non-destructive adoption report
  ansible.builtin.template:
    src: application-report.json.j2
    dest: "{{ platform_application_report_root }}/{{ platform_application_run_id }}/application-report.json"
    owner: root
    group: root
    mode: "0600"
