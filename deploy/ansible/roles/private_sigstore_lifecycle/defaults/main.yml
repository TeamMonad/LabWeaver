---
private_sigstore_lifecycle_namespace: "{{ private_sigstore_namespace | default('sigstore-system') }}"
private_sigstore_lifecycle_kubeconfig_path: "{{ private_sigstore_kubeconfig_path | default('/etc/kubernetes/admin.conf') }}"
private_sigstore_lifecycle_kubectl_path: "{{ private_sigstore_kubectl_path | default('/usr/bin/kubectl') }}"
private_sigstore_lifecycle_report_directory: /var/lib/labweaver/private-sigstore/reports
private_sigstore_lifecycle_backup_provider: "{{ private_sigstore_backup_provider | default('private-sigstore-backup') }}"
private_sigstore_lifecycle_restore_provider: "{{ private_sigstore_restore_provider | default('private-sigstore-restore') }}"
private_sigstore_lifecycle_rotation_provider: "{{ private_sigstore_rotation_provider | default('private-sigstore-rotate') }}"
private_sigstore_lifecycle_verify_provider: "{{ private_sigstore_verify_provider | default('private-sigstore-verify') }}"
private_sigstore_lifecycle_dr_provider: "{{ private_sigstore_dr_provider | default('private-sigstore-disaster-recovery') }}"
private_sigstore_lifecycle_trust_bundle_sha256: "{{ private_sigstore_trust_bundle_sha256 }}"
private_sigstore_lifecycle_workload_identity_policy_sha256: "{{ private_sigstore_workload_identity_policy_sha256 }}"
private_sigstore_lifecycle_tuf_root_version: "{{ private_sigstore_tuf_root_version }}"
private_sigstore_lifecycle_expected_tuf_root_sha256: "{{ private_sigstore_expected_tuf_root_sha256 }}"
