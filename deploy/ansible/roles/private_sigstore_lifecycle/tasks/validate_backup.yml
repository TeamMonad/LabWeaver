---
- name: Read pre-change backup manifest without logging it
  ansible.builtin.slurp:
    src: "{{ sigstore_lifecycle_backup_locator }}"
  register: sigstore_prechange_backup_raw
  no_log: true

- name: Bind pre-change backup to the current execution
  ansible.builtin.assert:
    that:
      - (sigstore_prechange_backup_raw.content | b64decode | from_json).schema_version == 'private-sigstore-backup.v1'
      - (sigstore_prechange_backup_raw.content | b64decode | from_json).run_id == sigstore_testflight_run_id
      - (sigstore_prechange_backup_raw.content | b64decode | from_json).commit_sha == sigstore_lifecycle_commit_sha
      - (sigstore_prechange_backup_raw.content | b64decode | from_json).cluster_uid == sigstore_lifecycle_cluster_uid.stdout
      - (sigstore_prechange_backup_raw.content | b64decode | from_json).inventory_sha256 == sigstore_lifecycle_inventory_hash
      - (sigstore_prechange_backup_raw.content | b64decode | from_json).component_lock_sha256 == sigstore_lifecycle_component_lock_hash
      - (sigstore_prechange_backup_raw.content | b64decode | from_json).deployment_manifest_sha256 == sigstore_lifecycle_manifest_hash
      - (sigstore_prechange_backup_raw.content | b64decode | from_json).artifact_sha256 is match('^sha256:[0-9a-f]{64}$')
    fail_msg: SIGSTORE_PRECHANGE_BACKUP_IDENTITY_INVALID
  no_log: true
