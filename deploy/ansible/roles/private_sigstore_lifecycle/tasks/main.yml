---
- name: Bind Private Sigstore lifecycle execution identity
  ansible.builtin.set_fact:
    sigstore_lifecycle_run_id: "{{ lookup('env', 'LABWEAVER_RUN_ID') }}"
    sigstore_testflight_run_id: "{{ lookup('env', 'LABWEAVER_TESTFLIGHT_RUN_ID') }}"
    sigstore_lifecycle_commit_sha: "{{ lookup('env', 'LABWEAVER_COMMIT_SHA') }}"
    sigstore_lifecycle_controller_id: "{{ lookup('env', 'LABWEAVER_CONTROLLER_ID') }}"
    sigstore_lifecycle_inventory_hash: "{{ lookup('env', 'LABWEAVER_INVENTORY_HASH') }}"
    sigstore_lifecycle_component_lock_hash: "{{ lookup('env', 'LABWEAVER_COMPONENT_LOCK_HASH') }}"
    sigstore_lifecycle_manifest_hash: "{{ lookup('env', 'LABWEAVER_DEPLOYMENT_MANIFEST_HASH') }}"
    sigstore_lifecycle_backup_locator: "{{ lookup('env', 'LABWEAVER_SIGSTORE_BACKUP_LOCATOR') }}"
    sigstore_lifecycle_secret_locator: "{{ lookup('env', 'LABWEAVER_SIGSTORE_SECRET_LOCATOR') }}"
    sigstore_lifecycle_tuf_locator: "{{ lookup('env', 'LABWEAVER_SIGSTORE_TUF_ROOT_LOCATOR') }}"
    sigstore_lifecycle_lock: "{{ (lookup('file', playbook_dir ~ '/../../versions.lock.yml') | from_yaml).private_sigstore }}"

- name: Initialize lifecycle image digest identity
  ansible.builtin.set_fact:
    sigstore_lifecycle_image_digests: {}

- name: Bind lifecycle image digests without mutable repository names
  ansible.builtin.set_fact:
    sigstore_lifecycle_image_digests: >-
      {{ sigstore_lifecycle_image_digests
         | combine({item.key: (item.value.split('@') | last)}) }}
  loop: "{{ sigstore_lifecycle_lock.images | dict2items }}"

- name: Reject missing or unbound lifecycle inputs
  ansible.builtin.assert:
    that:
      - private_sigstore_lifecycle_action in ['backup', 'restore', 'rotate', 'verify', 'cleanup', 'disaster-recovery']
      - sigstore_lifecycle_run_id is match('^infra-[a-z0-9-]+$')
      - sigstore_testflight_run_id is match('^testflight-[a-z0-9-]+$')
      - sigstore_lifecycle_commit_sha is match('^[0-9a-f]{40,64}$')
      - sigstore_lifecycle_controller_id | length > 0
      - sigstore_lifecycle_inventory_hash is match('^sha256:[0-9a-f]{64}$')
      - sigstore_lifecycle_component_lock_hash is match('^sha256:[0-9a-f]{64}$')
      - sigstore_lifecycle_manifest_hash is match('^sha256:[0-9a-f]{64}$')
      - sigstore_lifecycle_backup_locator | length > 0
      - sigstore_lifecycle_secret_locator | length > 0
      - sigstore_lifecycle_tuf_locator | length > 0
      - sigstore_lifecycle_lock.scaffold_chart_archive_sha256 is match('^sha256:[0-9a-f]{64}$')
      - sigstore_lifecycle_lock.images.values() | reject('match', '^.+@sha256:[0-9a-f]{64}$') | list | length == 0
      - private_sigstore_lifecycle_trust_bundle_sha256 is match('^sha256:[0-9a-f]{64}$')
      - private_sigstore_lifecycle_workload_identity_policy_sha256 is match('^sha256:[0-9a-f]{64}$')
      - private_sigstore_lifecycle_expected_tuf_root_sha256 is match('^sha256:[0-9a-f]{64}$')
      - private_sigstore_lifecycle_tuf_root_version | int > 0
    fail_msg: SIGSTORE_LIFECYCLE_IDENTITY_INVALID

- name: Read adopted cluster UID
  ansible.builtin.command:
    argv:
      - "{{ private_sigstore_lifecycle_kubectl_path }}"
      - --kubeconfig
      - "{{ private_sigstore_lifecycle_kubeconfig_path }}"
      - get
      - namespace
      - kube-system
      - --output
      - jsonpath={.metadata.uid}
  changed_when: false
  register: sigstore_lifecycle_cluster_uid

- name: Require existing Private Sigstore namespace
  ansible.builtin.command:
    argv:
      - "{{ private_sigstore_lifecycle_kubectl_path }}"
      - --kubeconfig
      - "{{ private_sigstore_lifecycle_kubeconfig_path }}"
      - get
      - namespace
      - "{{ private_sigstore_lifecycle_namespace }}"
  changed_when: false

- name: Validate sensitive locators without reading their content
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ sigstore_lifecycle_secret_locator }}"
    - "{{ sigstore_lifecycle_tuf_locator }}"
  register: sigstore_lifecycle_locators
  no_log: true

- name: Reject missing sensitive locators
  ansible.builtin.assert:
    that: sigstore_lifecycle_locators.results | map(attribute='stat.exists') | select('equalto', false) | list | length == 0
    fail_msg: SIGSTORE_LIFECYCLE_LOCATOR_MISSING
  no_log: true

- name: Execute cleanup with a run-scoped allowlist
  ansible.builtin.include_tasks: cleanup.yml
  when: private_sigstore_lifecycle_action == 'cleanup'

- name: Execute backup provider
  ansible.builtin.include_tasks: provider.yml
  vars:
    sigstore_provider_action: backup
    sigstore_provider_cronjob: "{{ private_sigstore_lifecycle_backup_provider }}"
  when: private_sigstore_lifecycle_action == 'backup'

- name: Validate backup manifest identity
  ansible.builtin.include_tasks: validate_backup.yml
  when: private_sigstore_lifecycle_action == 'backup'

- name: Execute verify provider
  ansible.builtin.include_tasks: provider.yml
  vars:
    sigstore_provider_action: verify
    sigstore_provider_cronjob: "{{ private_sigstore_lifecycle_verify_provider }}"
  when: private_sigstore_lifecycle_action == 'verify'

- name: Create mandatory pre-change backup
  ansible.builtin.include_tasks: provider.yml
  vars:
    sigstore_provider_action: backup
    sigstore_provider_cronjob: "{{ private_sigstore_lifecycle_backup_provider }}"
  when: private_sigstore_lifecycle_action in ['restore', 'rotate', 'disaster-recovery']

- name: Validate pre-change backup identity
  ansible.builtin.include_tasks: validate_backup.yml
  when: private_sigstore_lifecycle_action in ['restore', 'rotate', 'disaster-recovery']

- name: Execute restore provider
  ansible.builtin.include_tasks: provider.yml
  vars:
    sigstore_provider_action: restore
    sigstore_provider_cronjob: "{{ private_sigstore_lifecycle_restore_provider }}"
  when: private_sigstore_lifecycle_action == 'restore'

- name: Execute rotation provider without root-key generation
  ansible.builtin.include_tasks: provider.yml
  vars:
    sigstore_provider_action: rotate
    sigstore_provider_cronjob: "{{ private_sigstore_lifecycle_rotation_provider }}"
  when: private_sigstore_lifecycle_action == 'rotate'

- name: Execute disaster-recovery provider
  ansible.builtin.include_tasks: provider.yml
  vars:
    sigstore_provider_action: disaster-recovery
    sigstore_provider_cronjob: "{{ private_sigstore_lifecycle_dr_provider }}"
  when: private_sigstore_lifecycle_action == 'disaster-recovery'
