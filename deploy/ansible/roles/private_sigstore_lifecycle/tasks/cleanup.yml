---
- name: Build cleanup plan for current TestFlight run
  ansible.builtin.command:
    argv:
      - "{{ private_sigstore_lifecycle_kubectl_path }}"
      - --kubeconfig
      - "{{ private_sigstore_lifecycle_kubeconfig_path }}"
      - --namespace
      - "{{ private_sigstore_lifecycle_namespace }}"
      - get
      - jobs,pods,configmaps
      - --selector
      - labweaver.io/testflight-run={{ sigstore_testflight_run_id }}
      - --output
      - name
  changed_when: false
  register: sigstore_cleanup_plan

- name: Reject cleanup plan outside temporary resource allowlist
  ansible.builtin.assert:
    that:
      - sigstore_cleanup_plan.stdout_lines | reject('match', '^(job\.batch|pod|configmap)/') | list | length == 0
    fail_msg: SIGSTORE_CLEANUP_SCOPE_VIOLATION

- name: Delete only current-run temporary resources
  ansible.builtin.command:
    argv:
      - "{{ private_sigstore_lifecycle_kubectl_path }}"
      - --kubeconfig
      - "{{ private_sigstore_lifecycle_kubeconfig_path }}"
      - --namespace
      - "{{ private_sigstore_lifecycle_namespace }}"
      - delete
      - jobs,pods,configmaps
      - --selector
      - labweaver.io/testflight-run={{ sigstore_testflight_run_id }}
      - --ignore-not-found=true
      - --wait=true
  register: sigstore_cleanup_delete
  changed_when: "'deleted' in sigstore_cleanup_delete.stdout"

- name: Verify cleanup completed
  ansible.builtin.command:
    argv:
      - "{{ private_sigstore_lifecycle_kubectl_path }}"
      - --kubeconfig
      - "{{ private_sigstore_lifecycle_kubeconfig_path }}"
      - --namespace
      - "{{ private_sigstore_lifecycle_namespace }}"
      - get
      - jobs,pods,configmaps
      - --selector
      - labweaver.io/testflight-run={{ sigstore_testflight_run_id }}
      - --output
      - name
  changed_when: false
  register: sigstore_cleanup_remaining
  failed_when: sigstore_cleanup_remaining.stdout_lines | length > 0

- name: Create lifecycle report directory
  ansible.builtin.file:
    path: "{{ private_sigstore_lifecycle_report_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write identity-bound cleanup report
  ansible.builtin.template:
    src: lifecycle-report.json.j2
    dest: "{{ private_sigstore_lifecycle_report_directory }}/{{ sigstore_testflight_run_id }}-cleanup.json"
    owner: root
    group: root
    mode: "0640"
