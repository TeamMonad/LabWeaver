---
- name: Refresh control-plane system trust after a Harbor CA change
  ansible.builtin.command: "{{ labweaver_ca_trust_refresh_command }}"
  changed_when: true

- name: Refresh router system trust after a Harbor CA change
  ansible.builtin.command: "{{ labweaver_ca_trust_refresh_command }}"
  delegate_to: "{{ groups['routers'][0] }}"
  changed_when: true
