---
# One-shot audit + cleanup of old-cluster residue on v1 workers (97/158).
# The audit record is written BEFORE any destructive action and the playbook
# refuses to clean unless labweaver_v1_cleanup_old_cluster=true is supplied.
# Approved destructive operation under issue #148 (2026-08-07).
- name: Inventorize old-cluster residue
  ansible.builtin.shell: "{{ item }}"
  changed_when: false
  failed_when: false
  register: v1_residue_inventory
  loop:
    - "kubeadm version 2>/dev/null || true"
    - "systemctl is-active kubelet crio 2>/dev/null || true"
    - "ls -la /etc/kubernetes 2>/dev/null || true"
    - "ls /etc/kubernetes/manifests 2>/dev/null || true"
    - "ip -br link 2>/dev/null | grep -E 'cilium|lxc|docker' || true"
    - "ls -la /etc/cni/net.d 2>/dev/null || true"
    - "command -v lxc >/dev/null && lxc list --format json 2>/dev/null || echo 'no-lxc-cli'"

- name: Ensure the root-owned v1 audit directory exists
  ansible.builtin.file:
    path: /var/lib/labweaver/.private/v1
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Record residue audit (root-owned, before cleanup)
  ansible.builtin.copy:
    dest: "/var/lib/labweaver/.private/v1/residue-audit-{{ ansible_date_time.iso8601_basic_short }}-{{ inventory_hostname }}.json"
    mode: '0600'
    owner: root
    group: root
    content: "{{ v1_residue_inventory.results | to_nice_json }}"

- name: Refuse to clean without explicit approval
  ansible.builtin.assert:
    that: labweaver_v1_cleanup_old_cluster | default(false) | bool
    fail_msg: >-
      V1_RESIDUE_CLEANUP_NOT_APPROVED: audit recorded, no destructive action.
      Re-run with -e labweaver_v1_cleanup_old_cluster=true after confirming
      the audited residue (LXD containers are inventoried, never removed).

- name: Stop old kubelet and CRI-O
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  ignore_errors: true
  loop: [kubelet, crio]

- name: Reset old kubeadm state
  ansible.builtin.command: >-
    kubeadm reset -f --cri-socket unix:///var/run/crio/crio.sock
  changed_when: false
  failed_when: false

- name: Kill surviving old-cluster container processes (control plane, Cilium,
    KubeVirt, etcd, conmon) - CRI-O stop/purge alone does not kill them.
    Bracket patterns avoid pkill matching the task's own wrapper shell.
  ansible.builtin.shell: "{{ item }} || true"
  changed_when: false
  loop:
    - "pkill -9 -f '[c]onmon'"
    - "pkill -9 -f '[k]ube-apiserver'"
    - "pkill -9 -f '[k]ube-controller'"
    - "pkill -9 -f '[k]ube-scheduler'"
    - "pkill -9 -f '[k]ube-proxy'"
    - "pkill -9 -f '[c]ilium-agent'"
    - "pkill -9 -f '[c]ilium-envoy'"
    - "pkill -9 -f '[c]ilium-health'"
    - "pkill -9 -f '[v]irt-operator'"
    - "pkill -9 -f '[v]irt-api'"
    - "pkill -9 -f '[v]irt-controller'"
    - "pkill -9 -f '[b]in/etcd'"

- name: Wait for processes to exit
  ansible.builtin.pause:
    seconds: 3

- name: Unmount old container runtime mounts (shm / cilium cgroup)
  ansible.builtin.shell: >-
    for m in $(mount 2>/dev/null | grep -E 'overlay-containers|run/cilium'
    | awk '{print $3}'); do umount -l "$m" 2>/dev/null || true; done
  changed_when: false

- name: Remove old pod logs, cilium runtime dir and stale container run dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/log/pods
    - /run/cilium
    - /run/containers/storage/overlay-containers

- name: Remove leftover network namespaces
  ansible.builtin.shell: >-
    for ns in /var/run/netns/*; do [ -e "$ns" ] &&
    ip netns del "$(basename $ns)" 2>/dev/null || true; done
  changed_when: false

- name: Remove old cluster directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes
    - /var/lib/kubelet
    - /var/lib/crio
    - /etc/cni/net.d
    - /var/lib/cni
    - /var/lib/etcd
    - /var/lib/kube-proxy
    - /etc/containers

- name: Remove leftover Cilium / docker interfaces
  ansible.builtin.shell: "ip link del {{ item }} 2>/dev/null || true"
  changed_when: false
  loop: [cilium_net, cilium_host, cilium_vxlan, cilium_health, docker0]

- name: Fail closed if any Cilium interface survives
  ansible.builtin.shell: "ip -br link 2>/dev/null | grep -cE 'cilium' || true"
  changed_when: false
  register: v1_cilium_after
  failed_when: (v1_cilium_after.stdout | trim | int) != 0
  loop: [once]

- name: Fail closed if old-cluster processes survive
  ansible.builtin.shell: >-
    ps aux | grep -E 'kube-apiserver|cilium-agent|virt-controller|bin/etcd'
    | grep -v grep | wc -l
  changed_when: false
  register: v1_procs_after
  failed_when: (v1_procs_after.stdout | trim | int) != 0
  loop: [once]

- name: Purge old Kubernetes/CRI-O packages for a fresh pinned install
  ansible.builtin.apt:
    name: [kubeadm, kubelet, kubectl, cri-o, cri-o-runc, cri-tools]
    state: absent
    purge: true
    allow_change_held_packages: true
  ignore_errors: true

- name: Verify residue is gone
  ansible.builtin.shell: "{{ item }}"
  changed_when: false
  failed_when: false
  register: v1_residue_after
  loop:
    - "systemctl is-active kubelet crio 2>/dev/null || true"
    - "ls /etc/kubernetes 2>/dev/null || echo gone"
    - "ls /var/lib/kubelet 2>/dev/null || echo gone"
    - "ip -br link 2>/dev/null | grep -E 'cilium|lxc|docker' || echo none"

- name: Record cleanup result
  ansible.builtin.copy:
    dest: "/var/lib/labweaver/.private/v1/residue-cleanup-{{ ansible_date_time.iso8601_basic_short }}-{{ inventory_hostname }}.json"
    mode: '0600'
    owner: root
    group: root
    content: "{{ v1_residue_after.results | to_nice_json }}"
