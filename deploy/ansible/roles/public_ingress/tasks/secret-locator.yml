---
- name: Read the Bundle ACME locator on the controller
  when: public_ingress_cloudflare_locator_controller | bool
  become: false
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_remote_tmp: "{{ public_ingress_cloudflare_locator_controller_tmp }}"
  no_log: true
  block:
    - name: Require the derived ACME locator binding
      ansible.builtin.assert:
        that:
          - public_ingress_cloudflare_token_locator | length > 0
          - public_ingress_cloudflare_locator_sha256 is match('^sha256:[0-9a-f]{64}$')
          - public_ingress_cloudflare_locator_controller_tmp | length > 0
        fail_msg: PUBLIC_INGRESS_LOCATOR_INVALID

    - name: Inspect the private ACME locator
      ansible.builtin.stat:
        path: "{{ public_ingress_cloudflare_token_locator }}"
        checksum_algorithm: sha256
        follow: false
      register: public_ingress_locator_stat

    - name: Reject a missing or changed ACME locator
      ansible.builtin.assert:
        that:
          - public_ingress_locator_stat.stat.isreg | default(false)
          - public_ingress_locator_stat.stat.mode | default('') == '0600'
          - ('sha256:' ~ (public_ingress_locator_stat.stat.checksum | default(''))) == public_ingress_cloudflare_locator_sha256
        fail_msg: PUBLIC_INGRESS_LOCATOR_INVALID

    - name: Read the private ACME locator
      ansible.builtin.slurp:
        src: "{{ public_ingress_cloudflare_token_locator }}"
      register: public_ingress_cloudflare_locator

    - name: Bind the ACME bytes read to the Bundle source
      ansible.builtin.assert:
        that:
          - ('sha256:' ~ (public_ingress_cloudflare_locator.content | b64decode | hash('sha256'))) == public_ingress_cloudflare_locator_sha256
        fail_msg: PUBLIC_INGRESS_LOCATOR_CHANGED

- name: Read the legacy ACME locator on the configured host
  ansible.builtin.slurp:
    src: "{{ public_ingress_cloudflare_token_locator }}"
  register: public_ingress_legacy_locator
  no_log: true
  when: not (public_ingress_cloudflare_locator_controller | bool)

- name: Keep the legacy ACME credential input
  ansible.builtin.set_fact:
    public_ingress_cloudflare_locator: "{{ public_ingress_legacy_locator }}"
  no_log: true
  when: not (public_ingress_cloudflare_locator_controller | bool)

- name: Require the configured ACME credential once
  ansible.builtin.assert:
    that:
      - public_ingress_cloudflare_locator.content | b64decode | regex_findall('(?m)^' ~ public_ingress_cloudflare_token_key ~ '=(.+)$') | length == 1
    fail_msg: PUBLIC_INGRESS_CLOUDFLARE_TOKEN_MISSING
  no_log: true

- name: Extract the ACME credential without logging it
  ansible.builtin.set_fact:
    public_ingress_cloudflare_token: >-
      {{ (public_ingress_cloudflare_locator.content | b64decode)
         | regex_findall('(?m)^' ~ public_ingress_cloudflare_token_key ~ '=(.+)$') | first }}
  no_log: true
