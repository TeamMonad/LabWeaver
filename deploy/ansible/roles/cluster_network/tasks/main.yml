---
- name: Load the reviewed Cilium chart and image lock
  tags: [cilium]
  ansible.builtin.set_fact:
    cluster_network_cilium_lock: >-
      {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../versions.lock.yml') | from_yaml).cilium }}

- name: Require the locked Cilium image to match the chart release
  tags: [cilium]
  ansible.builtin.assert:
    that:
      - cluster_network_cilium_lock.chart is match('^[0-9]+[.][0-9]+[.][0-9]+$')
      - >-
        cluster_network_cilium_lock.image is match(
          '^quay[.]io/cilium/cilium:v'
          ~ (cluster_network_cilium_lock.chart | regex_escape)
          ~ '@sha256:[0-9a-f]{64}$')
    fail_msg: CILIUM_RELEASE_LOCK_INVALID

- name: Assert Helm is available on the control plane
  tags: [cilium]
  ansible.builtin.command: helm version --short
  changed_when: false

- name: Install pinned Gateway API Standard CRDs before enabling Gateway API
  kubernetes.core.k8s:
    state: present
    src: >-
      {{ gateway_api_crd_file
         | default('https://github.com/kubernetes-sigs/gateway-api/releases/download/'
                   ~ gateway_api_version ~ '/experimental-install.yaml') }}

- name: Add pinned Helm repositories
  tags: [cilium]
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
  loop:
    - { name: cilium, url: https://helm.cilium.io/ }
    - { name: metallb, url: https://metallb.github.io/metallb }
  environment: "{{ labweaver_controller_proxy_env | default({}) }}"

- name: Install Cilium with kube-proxy replacement and Gateway API
  tags: [cilium]
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    chart_version: "{{ cluster_network_cilium_lock.chart }}"
    update_repo_cache: true
    release_namespace: kube-system
    create_namespace: false
    values:
      image:
        override: "{{ cluster_network_cilium_lock.image }}"
      kubeProxyReplacement: true
      k8sServiceHost: "{{ kubernetes_api_advertise_address }}"
      k8sServicePort: 6443
      # KubeVirt and similar Pods need Service translation at tc, as documented
      # by Cilium, rather than socket rewriting inside their Pod namespaces.
      socketLB:
        hostNamespaceOnly: true
      # Keep the datapath in eBPF instead of iptables-nft. firewalld flushes
      # the nftables ruleset when it starts, which removes Cilium's legacy
      # iptables chains and breaks pod/gateway traffic until the agent is
      # restarted. BPF masquerade and eBPF host routing remove that dependency.
      bpf:
        masquerade: true
        hostLegacyRouting: false
      # Cilium Host Firewall replaces firewalld for the node firewall duty.
      # Enforcement only starts once a host policy selects the node, which is
      # applied right after this install.
      hostFirewall:
        enabled: true
      hubble:
        relay:
          enabled: true
        ui:
          enabled: true
      gatewayAPI:
        enabled: true
  environment: "{{ labweaver_controller_proxy_env | default({}) }}"

- name: Apply the LabWeaver node firewall policy
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    state: present
    definition: "{{ lookup('template', 'host-firewall-policy.yml.j2') | from_yaml }}"

- name: Install MetalLB
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb/metallb
    chart_version: "{{ metallb_chart_version }}"
    release_namespace: metallb-system
    create_namespace: true
  environment: "{{ labweaver_controller_proxy_env | default({}) }}"

- name: Apply MetalLB address pool and L2 advertisement
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'metallb.yml.j2') | from_yaml_all | list }}"
