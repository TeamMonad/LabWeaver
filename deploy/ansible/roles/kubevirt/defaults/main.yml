---
# KubeVirt control-plane placement. Empty keeps the upstream control-plane-only
# scheduling. Set an explicit node selector when the control-plane node cannot
# reach the adopted API endpoint but worker nodes can.
kubevirt_control_plane_node_selector: {}
# Allow KubeVirt control-plane pods to reach the adopted kube-apiserver identity
# and cluster DNS. Cilium host firewall only permits explicit node ports, so the
# service path must be allowed explicitly.
kubevirt_control_plane_egress_enabled: true
# Optional mediated-device resources. Keep these empty by default because a
# resource name is valid only after the NVIDIA host has created that exact
# mdev type. Operators enable one or more supported profiles explicitly for a
# labelled node group.
kubevirt_permitted_mediated_devices: []
# The global list is optional when every mediated type is node-scoped. Leave
# both lists empty to preserve any existing unmanaged CR fields; setting the
# node list opts this role into the configured mdev scope.
kubevirt_mediated_device_types: []
kubevirt_mediated_devices_configuration: []
