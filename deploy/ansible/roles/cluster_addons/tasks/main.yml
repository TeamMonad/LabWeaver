---
- name: Install cert-manager
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_addons_kubeconfig }}"
    state: present
    src: "https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.yaml"

- name: Wait for cert-manager controllers
  ansible.builtin.command: "kubectl --kubeconfig {{ cluster_addons_kubeconfig | quote }} -n cert-manager wait deployment/{{ item }} --for=condition=Available --timeout=5m"
  changed_when: false
  loop: [cert-manager, cert-manager-webhook]

- name: Create internal development issuer
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_addons_kubeconfig }}"
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata: { name: dev-selfsigned }
      spec: { selfSigned: {} }

- name: Apply namespaces, quota, Gateway, and HTTPRoute
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster_addons_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'gateway.yml.j2') | from_yaml_all | list }}"
  when: not cluster_addons_local_kind | bool

- name: Verify programmed internal Gateway
  ansible.builtin.command: kubectl --kubeconfig {{ cluster_addons_kubeconfig | quote }} -n labweaver-demo wait gateway/public-gateway --for=condition=Programmed --timeout=5m
  changed_when: false
  when: not cluster_addons_local_kind | bool
