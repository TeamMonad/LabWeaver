---
- name: Validate Resource deployment inputs
  ansible.builtin.assert:
    that:
      - resource_application_package_manifest | length > 0
      - resource_application_configuration_bundle | length > 0
      - resource_application_access_seed_file | length > 0
      - resource_application_postgres_service | length > 0
      - resource_application_postgres_service_file | length > 0
      - resource_application_values_file | length > 0
    fail_msg: RESOURCE_APPLICATION_INPUT_INVALID

- name: Load the immutable application identities
  ansible.builtin.set_fact:
    resource_application_lock: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../versions.lock.yml') | from_yaml }}
  no_log: true

- name: Verify controller-owned Resource deployment inputs
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - "{{ resource_application_package_manifest }}"
    - "{{ resource_application_configuration_bundle }}"
    - "{{ resource_application_access_seed_file }}"
    - "{{ resource_application_configuration_manifest }}"
    - "{{ resource_application_values_file }}"
    - "{{ resource_application_chart_source }}"
    - "{{ resource_application_postgres_service_file }}"
  register: resource_application_inputs

- name: Reject missing Resource deployment inputs
  ansible.builtin.assert:
    that: resource_application_inputs.results | map(attribute='stat.exists') | min
    fail_msg: RESOURCE_APPLICATION_REQUIRED_PATH_MISSING

- name: Parse immutable Resource package and private configuration
  ansible.builtin.set_fact:
    resource_application_package: "{{ lookup('ansible.builtin.file', resource_application_package_manifest) | from_json }}"
    resource_application_bundle_manifest: "{{ lookup('ansible.builtin.file', resource_application_configuration_manifest) | from_json }}"
    resource_application_bundle_objects: "{{ lookup('ansible.builtin.file', resource_application_configuration_bundle) | from_yaml_all | list }}"
    resource_application_bundle_sha256: "sha256:{{ resource_application_inputs.results[1].stat.checksum }}"
  no_log: true

- name: Load private Access bootstrap
  ansible.builtin.set_fact:
    resource_application_access_seed: >-
      {{ lookup('ansible.builtin.file', resource_application_access_seed_file) | from_json }}
  no_log: true

- name: Create bounded Resource bootstrap workspace
  ansible.builtin.file:
    path: "{{ resource_application_work_root }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true

- name: Render conflict-detecting Access bootstrap
  ansible.builtin.template:
    src: access-seed-adopt.sql.j2
    dest: "{{ resource_application_work_root }}/access-seed-adopt.sql"
    owner: root
    group: root
    mode: '0600'
  become: true
  no_log: true

- name: Apply or verify Resource Access bootstrap
  labweaver_postgres_apply:
    kubeconfig: "{{ resource_application_kubeconfig }}"
    psql: "{{ resource_application_psql }}"
    service_file: "{{ resource_application_postgres_service_file }}"
    service: "{{ resource_application_postgres_service }}"
    sql_file: "{{ resource_application_work_root }}/access-seed-adopt.sql"

- name: Enforce exact Resource package and configuration boundaries
  ansible.builtin.assert:
    that:
      - resource_application_package.schema_version == 'platform-image-package-manifest.v2'
      - resource_application_package.profile | default('platform') == 'resource'
      - resource_application_package.images | length == 1
      - resource_application_package.images[0].component == 'resource-service'
      - resource_application_package.images[0].reference is match('^[^@]+@sha256:[0-9a-f]{64}$')
      - resource_application_bundle_manifest.apiVersion == 'deploy.labweaver.io/resource-bundle-manifest/v1'
      - resource_application_bundle_manifest.namespace == resource_application_namespace
      - resource_application_bundle_objects | length == 2
      - resource_application_bundle_objects | map(attribute='metadata.name') | sort == ['resource-service-config', 'resource-service-secrets']
      - resource_application_bundle_objects | map(attribute='metadata.namespace') | unique | list == [resource_application_namespace]
    fail_msg: RESOURCE_APPLICATION_CONFIGURATION_INVALID
  no_log: true

- name: Bind the rendered Resource capacity configuration
  ansible.builtin.set_fact:
    resource_application_capacity_configuration: >-
      {{ ((resource_application_bundle_objects
           | selectattr('kind', 'equalto', 'ConfigMap')
           | selectattr('metadata.name', 'equalto', 'resource-service-config')
           | first).data['capacity.json']) | from_json }}
  no_log: true

- name: Require every reviewed GPU class to match the rendered Resource capacity catalog
  ansible.builtin.assert:
    that:
      - (resource_application_gpu_classes | length) > 0
      - >-
        (resource_application_gpu_classes
         | selectattr('capacity_units', 'gt', 0)
         | list | length) == (resource_application_gpu_classes | length)
      - >-
        (resource_application_gpu_classes
         | selectattr('mode', 'in', ['exclusive', 'container_time_slice', 'vm_vgpu'])
         | list | length) == (resource_application_gpu_classes | length)
      - (resource_application_capacity_configuration.gpuCatalogSeed | default([]) | length) > 0
      - >-
        (resource_application_capacity_configuration.gpuCatalogSeed
         | selectattr('capacityUnits', 'gt', 0)
         | list | length) == (resource_application_capacity_configuration.gpuCatalogSeed | length)
      - >-
        (resource_application_capacity_configuration.gpuCatalogSeed
         | map(attribute='class') | sort | list) ==
        (resource_application_gpu_classes | map(attribute='class') | sort | list)
    fail_msg: PLATFORM_APPLICATION_GPU_CLASS_CATALOG_MISMATCH
  no_log: true

- name: Require every rendered GPU class to match the reviewed lock entry
  ansible.builtin.assert:
    that:
      - >-
        (resource_application_gpu_classes
         | selectattr('class', 'equalto', item.class)
         | selectattr('mode', 'equalto', item.mode)
         | selectattr('provider_binding', 'equalto', item.providerBinding)
         | selectattr('capacity_units', 'equalto', item.capacityUnits)
         | selectattr('allocation_binding', 'equalto', item.allocationBinding)
         | list | length) == 1
    fail_msg: PLATFORM_APPLICATION_GPU_CLASS_CATALOG_MISMATCH
  loop: "{{ resource_application_capacity_configuration.gpuCatalogSeed }}"
  loop_control:
    label: "{{ item.class }}"
  no_log: true

- name: Apply only the independently reviewed Resource configuration
  labweaver_resource_bundle_apply:
    kubeconfig: "{{ resource_application_kubeconfig }}"
    bundle: "{{ resource_application_configuration_bundle }}"

- name: Build isolated Resource Helm arguments
  ansible.builtin.set_fact:
    resource_application_helm_args:
      - "--values={{ resource_application_values_file }}"
      - "--set-string"
      - "imagePullSecrets[0].name={{ resource_application_image_pull_secret_name }}"
      - "--set-string"
      - "deploymentIdentity.configurationBundleSha256={{ resource_application_bundle_sha256 }}"
      - "--set-string"
      - "images.resource_service={{ resource_application_package.images[0].reference }}"
      - "--set"
      - "workloads.resource-service.enabled=true"
      - "--set"
      - "network.defaultDenyEnabled=false"
      - "--set"
      - "network.cdiCloneSourcePolicyEnabled=false"
      - "--set"
      - "network.ciliumIngressPolicyEnabled=false"
      - "--set"
      - "network.resourceKubernetesApiCiliumPolicyEnabled=true"

- name: Disable every non-Resource workload explicitly
  ansible.builtin.set_fact:
    resource_application_helm_args: "{{ resource_application_helm_args + ['--set', 'workloads.' + item + '.enabled=false'] }}"
  loop: "{{ resource_application_workloads }}"

- name: Atomically deploy the Resource authority without taking ownership of the platform release
  ansible.builtin.command:
    argv: >-
      {{ [resource_application_helm, '--kubeconfig', resource_application_kubeconfig,
          'upgrade', '--install', resource_application_release_name, resource_application_chart_source,
          '--namespace', resource_application_namespace, '--atomic', '--wait',
          '--timeout', resource_application_rollout_timeout] + resource_application_helm_args }}
  changed_when: true

- name: Verify Resource authority rollout
  ansible.builtin.command:
    argv:
      - "{{ resource_application_kubectl }}"
      - --kubeconfig
      - "{{ resource_application_kubeconfig }}"
      - --namespace
      - "{{ resource_application_namespace }}"
      - rollout
      - status
      - deployment/resource-service
      - "--timeout={{ resource_application_rollout_timeout }}"
  changed_when: false
