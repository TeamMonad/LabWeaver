---
- name: Load immutable Sprint 2 foundation identities
  ansible.builtin.set_fact:
    platform_foundation_lock: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../versions.lock.yml') | from_yaml }}

- name: Validate Sprint 2 foundation inputs
  ansible.builtin.assert:
    that:
      - platform_foundation_enabled | bool
      - platform_foundation_namespace == 'labweaver-data'
      - platform_foundation_bundle | length > 0
      - platform_foundation_storage_class | length > 0
      - platform_foundation_minio_storage_class | length > 0
      - platform_foundation_lock.postgresql.image is match('^[^\s]+@sha256:[0-9a-f]{64}$')
      - platform_foundation_lock.platform_foundation.nats is match('^[^\s]+@sha256:[0-9a-f]{64}$')
      - platform_foundation_lock.platform_foundation.minio is match('^[^\s]+@sha256:[0-9a-f]{64}$')
      - platform_foundation_postgres_database is match('^[a-z][a-z0-9_]{0,62}$')
      - platform_foundation_postgres_admin_role is match('^[a-z][a-z0-9-]{0,62}$')
    fail_msg: PLATFORM_FOUNDATION_INPUT_INVALID

- name: Inspect controlled foundation inputs
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ platform_foundation_bundle }}"
    - "{{ platform_foundation_manifest }}"
  register: platform_foundation_inputs
  delegate_to: localhost
  become: false

- name: Reject missing foundation inputs
  ansible.builtin.assert:
    that:
      - platform_foundation_inputs.results | map(attribute='stat.exists') | min
      - platform_foundation_inputs.results | map(attribute='stat.isreg') | min
    fail_msg: PLATFORM_FOUNDATION_INPUT_MISSING

- name: Parse reviewed foundation bundle and manifest
  ansible.builtin.set_fact:
    platform_foundation_objects: >-
      {{ lookup('ansible.builtin.file', platform_foundation_bundle) | from_yaml_all | list }}
    platform_foundation_manifest_value: >-
      {{ lookup('ansible.builtin.file', platform_foundation_manifest) | from_json }}
    platform_foundation_bundle_sha256: >-
      {{ lookup('ansible.builtin.file', platform_foundation_bundle) | hash('sha256') }}
  no_log: true

- name: Validate foundation object boundary
  ansible.builtin.assert:
    that:
      - platform_foundation_manifest_value.apiVersion == 'deploy.labweaver.io/platform-bundle-manifest/v1'
      - platform_foundation_manifest_value.namespace == platform_foundation_namespace
      - platform_foundation_objects | length == 4
      - platform_foundation_objects | map(attribute='apiVersion') | unique | list == ['v1']
      - platform_foundation_objects | map(attribute='metadata.namespace') | unique | list == [platform_foundation_namespace]
      - >-
        platform_foundation_objects | selectattr('kind', 'equalto', 'ConfigMap')
        | map(attribute='metadata.name') | sort
        == platform_foundation_manifest_value.configMaps.keys() | sort
      - >-
        platform_foundation_objects | selectattr('kind', 'equalto', 'Secret')
        | map(attribute='metadata.name') | sort
        == platform_foundation_manifest_value.secrets.keys() | sort
    fail_msg: PLATFORM_FOUNDATION_BUNDLE_INVALID
  no_log: true

- name: Validate every foundation key against the manifest
  ansible.builtin.assert:
    that:
      - item.data is defined
      - item.stringData is not defined
      - item.binaryData is not defined
      - item.data.keys() | sort == platform_foundation_expected_keys | sort
      - item.kind != 'Secret' or item.type == 'Opaque'
    fail_msg: PLATFORM_FOUNDATION_BUNDLE_KEYS_INVALID
  vars:
    platform_foundation_expected_keys: >-
      {{ (platform_foundation_manifest_value.configMaps
          if item.kind == 'ConfigMap'
          else platform_foundation_manifest_value.secrets)[item.metadata.name] }}
  loop: "{{ platform_foundation_objects }}"
  no_log: true

- name: Select reviewed NATS server configuration
  ansible.builtin.set_fact:
    platform_foundation_nats_configuration: >-
      {{ (platform_foundation_objects
          | selectattr('kind', 'equalto', 'ConfigMap')
          | selectattr('metadata.name', 'equalto', 'nats-config')
          | first).data['nats-server.conf'] }}
  no_log: true

- name: Bind workload-scoped foundation configuration identities
  ansible.builtin.set_fact:
    platform_foundation_workload_configuration_sha256:
      postgres: >-
        {{ ((platform_foundation_objects
             | selectattr('kind', 'equalto', 'Secret')
             | selectattr('metadata.name', 'equalto', 'postgres-secrets')
             | first).data | to_json | hash('sha256')) }}
      nats: >-
        {{ ((((platform_foundation_objects
               | selectattr('kind', 'equalto', 'ConfigMap')
               | selectattr('metadata.name', 'equalto', 'nats-config')
               | first).data | to_json)
             ~
             ((platform_foundation_objects
               | selectattr('kind', 'equalto', 'Secret')
               | selectattr('metadata.name', 'equalto', 'nats-server-secrets')
               | first).data | to_json)) | hash('sha256')) }}
      minio: >-
        {{ ((platform_foundation_objects
             | selectattr('kind', 'equalto', 'Secret')
             | selectattr('metadata.name', 'equalto', 'minio-secrets')
             | first).data | to_json | hash('sha256')) }}
  no_log: true

- name: Require JetStream, operator credentials, and mutual TLS
  ansible.builtin.assert:
    that:
      - "'jetstream' in platform_foundation_nats_configuration"
      - "'store_dir: \"/data\"' in platform_foundation_nats_configuration"
      - "'operator:' in platform_foundation_nats_configuration"
      - "'resolver' in platform_foundation_nats_configuration"
      - "'tls {' in platform_foundation_nats_configuration"
      - "'cert_file: \"/etc/nats/tls/tls.crt\"' in platform_foundation_nats_configuration"
      - "'key_file: \"/etc/nats/tls/tls.key\"' in platform_foundation_nats_configuration"
      - "'ca_file: \"/etc/nats/tls/ca.crt\"' in platform_foundation_nats_configuration"
      - "'verify: true' in platform_foundation_nats_configuration"
    fail_msg: PLATFORM_FOUNDATION_NATS_SECURITY_INVALID
  no_log: true

- name: Reconcile the protected foundation namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_foundation_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ platform_foundation_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver-infrastructure
          labweaver.io/infrastructure: "true"
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted

- name: Apply reviewed foundation configuration
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_foundation_kubeconfig }}"
    state: present
    definition: "{{ item }}"
  loop: "{{ platform_foundation_objects }}"
  no_log: true

- name: Reconcile foundation workloads
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_foundation_kubeconfig }}"
    state: present
    definition: "{{ item }}"
  loop: >-
    {{ lookup('ansible.builtin.template', 'workloads.yml.j2') | from_yaml_all | list }}

- name: Read foundation revisions before bounded rollout recovery
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_foundation_kubeconfig }}"
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ platform_foundation_namespace }}"
  register: platform_foundation_revisions

- name: Delete exact pod blocked on a superseded failed revision
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_foundation_kubeconfig }}"
    state: absent
    api_version: v1
    kind: Pod
    namespace: "{{ platform_foundation_namespace }}"
    name: "{{ item.metadata.name }}-0"
    # The StatefulSet immediately recreates the same pod name; waiting for
    # name absence races the controller. The readiness readback below is the
    # bounded authority for the replacement revision.
    wait: false
  loop: "{{ platform_foundation_revisions.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - item.status.currentRevision | default('') | length > 0
    - item.status.updateRevision | default('') | length > 0
    - item.status.currentRevision != item.status.updateRevision
    - item.status.readyReplicas | default(0, true) | int < item.spec.replicas | int

- name: Read foundation StatefulSets
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_foundation_kubeconfig }}"
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ platform_foundation_namespace }}"
  register: platform_foundation_statefulsets
  until: >-
    platform_foundation_statefulsets.resources | length == 3 and
    platform_foundation_statefulsets.resources
    | map(attribute='status.readyReplicas') | map('default', 0, true) | map('int') | min == 1
  retries: "{{ platform_foundation_rollout_retries }}"
  delay: "{{ platform_foundation_rollout_delay }}"

- name: Verify exact foundation workload set and immutable images
  ansible.builtin.assert:
    that:
      - platform_foundation_statefulsets.resources | map(attribute='metadata.name') | sort == ['minio', 'nats', 'postgres']
      - >-
        platform_foundation_statefulsets.resources
        | map(attribute='spec.template.spec.containers') | map('first')
        | map(attribute='image') | sort
        == [platform_foundation_lock.postgresql.image,
            platform_foundation_lock.platform_foundation.minio,
            platform_foundation_lock.platform_foundation.nats] | sort
    fail_msg: PLATFORM_FOUNDATION_READBACK_INVALID

- name: Read the PostgreSQL deployment-admin role before reconciliation
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ platform_foundation_kubeconfig }}"
    namespace: "{{ platform_foundation_namespace }}"
    pod: postgres-0
    container: postgres
    command: >-
      psql -U postgres -d {{ platform_foundation_postgres_database }} -Atqc
      "SELECT rolname || '|' || rolsuper::text || '|' || rolinherit::text || '|'
      || rolcreaterole::text || '|' || rolcreatedb::text || '|' || rolcanlogin::text
      FROM pg_roles WHERE rolname = '{{ platform_foundation_postgres_admin_role }}'"
  register: platform_foundation_postgres_admin_readback
  changed_when: false
  no_log: true

- name: Create the bounded PostgreSQL deployment-admin role
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ platform_foundation_kubeconfig }}"
    namespace: "{{ platform_foundation_namespace }}"
    pod: postgres-0
    container: postgres
    command: >-
      psql -U postgres -d {{ platform_foundation_postgres_database }} -v ON_ERROR_STOP=1
      -c 'CREATE ROLE "{{ platform_foundation_postgres_admin_role }}" LOGIN INHERIT
      CREATEROLE CREATEDB NOSUPERUSER NOREPLICATION NOBYPASSRLS'
  when: (platform_foundation_postgres_admin_readback.stdout | default('') | trim) == ''
  register: platform_foundation_postgres_admin_create
  changed_when: true
  no_log: true

- name: Repair the bounded PostgreSQL deployment-admin role attributes
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ platform_foundation_kubeconfig }}"
    namespace: "{{ platform_foundation_namespace }}"
    pod: postgres-0
    container: postgres
    command: >-
      psql -U postgres -d {{ platform_foundation_postgres_database }} -v ON_ERROR_STOP=1
      -c 'ALTER ROLE "{{ platform_foundation_postgres_admin_role }}" WITH LOGIN INHERIT
      CREATEROLE CREATEDB NOSUPERUSER NOREPLICATION NOBYPASSRLS'
  when:
    - (platform_foundation_postgres_admin_readback.stdout | default('') | trim) != ''
    - (platform_foundation_postgres_admin_readback.stdout | default('') | trim)
      != (platform_foundation_postgres_admin_role ~ '|false|true|true|true|true')
  register: platform_foundation_postgres_admin_repair
  changed_when: true
  no_log: true

- name: Grant the deployment-admin database privileges
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ platform_foundation_kubeconfig }}"
    namespace: "{{ platform_foundation_namespace }}"
    pod: postgres-0
    container: postgres
    command: >-
      psql -U postgres -d {{ platform_foundation_postgres_database }} -v ON_ERROR_STOP=1
      -c 'GRANT CONNECT, CREATE, TEMPORARY ON DATABASE
      "{{ platform_foundation_postgres_database }}" TO
      "{{ platform_foundation_postgres_admin_role }}"'
  register: platform_foundation_postgres_admin_grant
  changed_when: false
  no_log: true

- name: Read the PostgreSQL deployment-admin role after reconciliation
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ platform_foundation_kubeconfig }}"
    namespace: "{{ platform_foundation_namespace }}"
    pod: postgres-0
    container: postgres
    command: >-
      psql -U postgres -d {{ platform_foundation_postgres_database }} -Atqc
      "SELECT rolname || '|' || rolsuper::text || '|' || rolinherit::text || '|'
      || rolcreaterole::text || '|' || rolcreatedb::text || '|' || rolcanlogin::text
      FROM pg_roles WHERE rolname = '{{ platform_foundation_postgres_admin_role }}'"
  register: platform_foundation_postgres_admin_verified
  changed_when: false
  no_log: true

- name: Verify the PostgreSQL deployment-admin role contract
  ansible.builtin.assert:
    that:
      - (platform_foundation_postgres_admin_verified.stdout | trim)
        == (platform_foundation_postgres_admin_role ~ '|false|true|true|true|true')
    fail_msg: PLATFORM_FOUNDATION_POSTGRES_ADMIN_ROLE_INVALID
  no_log: true
