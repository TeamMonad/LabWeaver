---
- name: Bind the transient verification identity
  ansible.builtin.set_fact:
    verify_run_id: "{{ lookup('ansible.builtin.env', 'LABWEAVER_RUN_ID') | default('manual', true) }}"

- name: Bind the transient probe resource names
  ansible.builtin.set_fact:
    verify_runtime_namespace: "labweaver-verify-{{ verify_run_id }}"
    verify_gateway_configmap_name: "gateway-body-{{ verify_run_id }}"
    verify_gateway_backend_name: "gateway-backend-{{ verify_run_id }}"
    verify_gateway_route_name: "gateway-probe-{{ verify_run_id }}"
    verify_busybox_image: "{{ (lookup('file', playbook_dir ~ '/../../versions.lock.yml') | from_yaml).test_images.busybox }}"

- name: Require a bounded verification identity and digest-pinned image
  ansible.builtin.assert:
    that:
      - verify_runtime_namespace is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - verify_busybox_image is match('^.+@sha256:[0-9a-f]{64}$')
    fail_msg: VERIFY_EXECUTION_INPUT_INVALID

- name: Run real infrastructure probes
  block:
    - name: Read the registered Kubernetes nodes
      ansible.builtin.command:
        argv:
          - "{{ verify_kubectl_path }}"
          - --kubeconfig
          - "{{ verify_kubeconfig_path }}"
          - get
          - nodes
          - -o
          - json
      check_mode: false
      changed_when: false
      register: verify_nodes

    - name: Reject an unexpected Kubernetes node set
      ansible.builtin.assert:
        that:
          - >-
            (verify_nodes.stdout | from_json)['items']
            | map(attribute='metadata.name') | sort
            == verify_expected_kubernetes_nodes | sort
        fail_msg: NODE_SET_UNEXPECTED

    - name: Require every Kubernetes node to be Ready
      ansible.builtin.command:
        argv:
          - "{{ verify_kubectl_path }}"
          - --kubeconfig
          - "{{ verify_kubeconfig_path }}"
          - wait
          - --for=condition=Ready
          - node
          - --all
          - --timeout=5m
      check_mode: false
      changed_when: false

    - name: Render the isolated runtime probe resources
      ansible.builtin.template:
        src: runtime-probes.yml.j2
        dest: /var/tmp/labweaver-runtime-probes.yml
        mode: '0600'

    - name: Apply the isolated runtime probe resources
      ansible.builtin.command:
        argv:
          - "{{ verify_kubectl_path }}"
          - --kubeconfig
          - "{{ verify_kubeconfig_path }}"
          - apply
          - -f
          - /var/tmp/labweaver-runtime-probes.yml
      check_mode: false
      changed_when: false

    - name: Wait for the storage probe Pods
      ansible.builtin.command:
        argv:
          - "{{ verify_kubectl_path }}"
          - --kubeconfig
          - "{{ verify_kubeconfig_path }}"
          - -n
          - "{{ verify_runtime_namespace }}"
          - wait
          - "pod/{{ item }}"
          - --for=condition=Ready
          - --timeout=5m
      check_mode: false
      changed_when: false
      loop: [rwo-writer, rwo-reader, rwx-writer, rwx-reader]

    - name: Require Local Path RWO write and read content
      ansible.builtin.command:
        argv:
          - "{{ verify_kubectl_path }}"
          - --kubeconfig
          - "{{ verify_kubeconfig_path }}"
          - -n
          - "{{ verify_runtime_namespace }}"
          - exec
          - rwo-reader
          - --
          - cat
          - /data/probe
      check_mode: false
      changed_when: false
      register: verify_rwo_probe
      failed_when: verify_rwo_probe.stdout | trim != 'rwo-ok'

    - name: Require cross-worker NFS RWX write and read content
      ansible.builtin.command:
        argv:
          - "{{ verify_kubectl_path }}"
          - --kubeconfig
          - "{{ verify_kubeconfig_path }}"
          - -n
          - "{{ verify_runtime_namespace }}"
          - exec
          - rwx-reader
          - --
          - cat
          - /data/probe
      check_mode: false
      changed_when: false
      register: verify_rwx_probe
      failed_when: verify_rwx_probe.stdout | trim != 'rwx-ok'

    - name: Wait for the Gateway probe backend
      ansible.builtin.command: >-
        {{ verify_kubectl_path }} --kubeconfig {{ verify_kubeconfig_path }}
        -n labweaver-demo rollout status
        deployment/{{ verify_gateway_backend_name }} --timeout=5m
      check_mode: false
      changed_when: false

    - name: Verify the internal Gateway HTTPRoute response
      ansible.builtin.command: >-
        {{ verify_kubectl_path }} --kubeconfig {{ verify_kubeconfig_path }}
        -n {{ verify_runtime_namespace }} run gateway-client --restart=Never --rm -i
        --image={{ verify_busybox_image }} --
        wget -qO- --header=Host:{{ verify_gateway_hostname }} http://{{ gateway_vip }}
      check_mode: false
      changed_when: false
      register: verify_gateway_probe
      failed_when: "'gateway-ok' not in verify_gateway_probe.stdout"

    - name: Start the KubeVirt probe VirtualMachine
      ansible.builtin.command: "virtctl -n {{ verify_runtime_namespace }} start kvm-probe"
      check_mode: false
      changed_when: false

    - name: Require a Running KubeVirt VirtualMachineInstance
      ansible.builtin.command: >-
        {{ verify_kubectl_path }} --kubeconfig {{ verify_kubeconfig_path }}
        -n {{ verify_runtime_namespace }} wait vmi/kvm-probe
        --for=jsonpath='{.status.phase}'=Running --timeout=5m
      check_mode: false
      changed_when: false

    - name: Require a functioning KubeVirt console client
      ansible.builtin.command: virtctl version
      check_mode: false
      changed_when: false

    - name: Exercise the KubeVirt console connection
      ansible.builtin.command: >-
        timeout --foreground --kill-after=5s 15s
        virtctl -n {{ verify_runtime_namespace }} console kvm-probe
      check_mode: false
      changed_when: false
      register: verify_console_probe
      failed_when: verify_console_probe.rc not in [0, 124]

    - name: Stop the KubeVirt probe VirtualMachine
      ansible.builtin.command: "virtctl -n {{ verify_runtime_namespace }} stop kvm-probe"
      check_mode: false
      changed_when: false

    - name: Require the KubeVirt VirtualMachineInstance to stop
      ansible.builtin.command: >-
        {{ verify_kubectl_path }} --kubeconfig {{ verify_kubeconfig_path }}
        -n {{ verify_runtime_namespace }} wait vmi/kvm-probe
        --for=delete --timeout=5m
      check_mode: false
      changed_when: false

    - name: Delete the KubeVirt probe VirtualMachine
      ansible.builtin.command: >-
        {{ verify_kubectl_path }} --kubeconfig {{ verify_kubeconfig_path }}
        -n {{ verify_runtime_namespace }} delete vm/kvm-probe
        --ignore-not-found --wait=true --timeout=5m
      check_mode: false
      changed_when: false

    - name: Verify Cilium daemonset readiness
      ansible.builtin.command:
        argv:
          - "{{ verify_kubectl_path }}"
          - --kubeconfig
          - "{{ verify_kubeconfig_path }}"
          - -n
          - kube-system
          - get
          - daemonset/cilium
          - -o
          - jsonpath={.status.desiredNumberScheduled}{" "}{.status.numberReady}
      check_mode: false
      changed_when: false
      register: verify_cilium_status
      failed_when: >-
        verify_cilium_status.rc != 0 or
        (verify_cilium_status.stdout.split()[0] | int) !=
        (verify_cilium_status.stdout.split()[1] | int)

  always:
    - name: Remove the transient Gateway probe resources
      ansible.builtin.command:
        argv:
          - "{{ verify_kubectl_path }}"
          - --kubeconfig
          - "{{ verify_kubeconfig_path }}"
          - -n
          - labweaver-demo
          - delete
          - deployment,service,configmap,httproute
          - -l
          - "app.kubernetes.io/part-of=labweaver-verify,labweaver.io/verify-run={{ verify_run_id }}"
          - --ignore-not-found
          - --wait=true
      check_mode: false
      changed_when: false
      failed_when: false
      register: verify_gateway_cleanup

    - name: Remove the transient probe namespace
      ansible.builtin.command:
        argv:
          - "{{ verify_kubectl_path }}"
          - --kubeconfig
          - "{{ verify_kubeconfig_path }}"
          - delete
          - namespace
          - "{{ verify_runtime_namespace }}"
          - --ignore-not-found
          - --wait=true
          - --timeout=5m
      check_mode: false
      changed_when: false
      failed_when: false
      register: verify_namespace_cleanup

- name: Require the transient verification resources to be removed
  ansible.builtin.assert:
    that:
      - verify_gateway_cleanup.rc == 0
      - verify_namespace_cleanup.rc == 0
    fail_msg: VERIFY_CLEANUP_FAILED
