---
- name: Validate destructive reset inputs
  ansible.builtin.assert:
    that:
      - sprint2_reset_run_id is match('^[a-z0-9][a-z0-9-]{2,62}$')
      - sprint2_reset_source_commit is match('^[0-9a-f]{40,64}$')
      - sprint2_reset_postgres_service_file | length > 0
      - sprint2_reset_nats_server | length > 0
      - sprint2_reset_nats_credentials_file | length > 0
      - sprint2_reset_minio_alias | length > 0
      - sprint2_reset_harbor_api | length > 0
      - sprint2_reset_harbor_username | length > 0
      - sprint2_reset_harbor_password | length > 0
      - sprint2_reset_keycloak_config | length > 0
      - sprint2_reset_keycloak_server | length > 0
      - sprint2_reset_keycloak_username | length > 0
      - sprint2_reset_keycloak_password | length > 0
      - sprint2_reset_keycloak_realm_file | length > 0
      - sprint2_reset_values_files | length > 0
      - sprint2_reset_rollback_probe_values_file | length > 0
    fail_msg: SPRINT2_RESET_INPUT_INVALID

- name: Validate reset tools and controlled inputs
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ sprint2_reset_kubeconfig }}"
    - "{{ sprint2_reset_kubectl }}"
    - "{{ sprint2_reset_helm }}"
    - "{{ sprint2_reset_psql }}"
    - "{{ sprint2_reset_nats }}"
    - "{{ sprint2_reset_mc }}"
    - "{{ sprint2_reset_kcadm }}"
    - "{{ sprint2_reset_postgres_service_file }}"
    - "{{ sprint2_reset_nats_credentials_file }}"
    - "{{ sprint2_reset_keycloak_config }}"
  register: sprint2_reset_remote_required_paths

- name: Validate controller-owned reviewed inputs
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: >-
    {{ [sprint2_reset_chart_source, sprint2_reset_migration_catalog,
        sprint2_reset_keycloak_realm_file,
        sprint2_reset_rollback_probe_values_file] + sprint2_reset_values_files }}
  register: sprint2_reset_controller_required_paths
  delegate_to: localhost
  become: false

- name: Reject missing reset tools or inputs
  ansible.builtin.assert:
    that:
      - sprint2_reset_remote_required_paths.results | map(attribute='stat.exists') | min
      - sprint2_reset_controller_required_paths.results | map(attribute='stat.exists') | min
    fail_msg: SPRINT2_RESET_REQUIRED_PATH_MISSING

- name: Hash the reviewed migration catalog
  ansible.builtin.stat:
    path: "{{ sprint2_reset_migration_catalog }}"
    checksum_algorithm: sha256
  register: sprint2_reset_migration_catalog_stat
  delegate_to: localhost
  become: false

- name: Read target cluster UID
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kubectl }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - get
      - namespace
      - kube-system
      - -o
      - jsonpath={.metadata.uid}
  register: sprint2_reset_cluster_uid
  changed_when: false

- name: Bind confirmation to the exact cluster and reset run
  ansible.builtin.assert:
    that:
      - sprint2_reset_cluster_uid.stdout | trim | length > 0
      - sprint2_reset_confirmation == 'destroy-pre-release-data:' + (sprint2_reset_cluster_uid.stdout | trim) + ':' + sprint2_reset_run_id
    fail_msg: SPRINT2_RESET_CONFIRMATION_MISMATCH

- name: Create protected reset report directory
  ansible.builtin.file:
    path: "{{ sprint2_reset_report_root }}/{{ sprint2_reset_run_id }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inventory Helm releases without secret values
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_helm }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - list
      - --all-namespaces
      - --output
      - json
  register: sprint2_reset_helm_inventory
  changed_when: false

- name: Inventory Kyverno cluster policies
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kubectl }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - get
      - clusterpolicies.kyverno.io
      - -o
      - json
      - --ignore-not-found
  register: sprint2_reset_cluster_policies
  changed_when: false

- name: Inventory namespaced Kyverno policies
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kubectl }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - get
      - policies.kyverno.io
      - --all-namespaces
      - -o
      - json
      - --ignore-not-found
  register: sprint2_reset_namespaced_policies
  changed_when: false

- name: Derive the conservative Kyverno dependency inventory
  ansible.builtin.set_fact:
    sprint2_reset_cluster_policy_items: "{{ (sprint2_reset_cluster_policies.stdout | default('{\"items\":[]}') | from_json).items | default([]) }}"
    sprint2_reset_namespaced_policy_items: "{{ (sprint2_reset_namespaced_policies.stdout | default('{\"items\":[]}') | from_json).items | default([]) }}"

- name: Block removal when Kyverno has unowned dependencies
  ansible.builtin.assert:
    that:
      - sprint2_reset_cluster_policy_items | length == 0
      - >-
        sprint2_reset_namespaced_policy_items
        | rejectattr('metadata.namespace', 'in', sprint2_reset_namespaces)
        | list | length == 0
    fail_msg: KYVERNO_EXTERNAL_DEPENDENCY_DETECTED

- name: Persist the pre-destruction inventory
  ansible.builtin.copy:
    dest: "{{ sprint2_reset_report_root }}/{{ sprint2_reset_run_id }}/inventory.json"
    owner: root
    group: root
    mode: "0600"
    content: >-
      {{ {'schema_version': 'labweaver.sprint2-reset-inventory.v1',
          'run_id': sprint2_reset_run_id,
          'cluster_uid': sprint2_reset_cluster_uid.stdout | trim,
          'helm_releases': sprint2_reset_helm_inventory.stdout | from_json,
          'cluster_policy_names': sprint2_reset_cluster_policy_items | map(attribute='metadata.name') | list,
          'namespaced_policy_names': sprint2_reset_namespaced_policy_items | map(attribute='metadata.name') | list}
         | to_nice_json }}

- name: Uninstall the historical Private Sigstore release
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_helm }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - uninstall
      - private-sigstore
      - --namespace
      - sigstore-system
      - --ignore-not-found
      - --wait
  register: sprint2_reset_sigstore_uninstall
  changed_when: sprint2_reset_sigstore_uninstall.rc == 0

- name: Delete the historical Private Sigstore namespace and storage
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kubectl }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - delete
      - namespace
      - sigstore-system
      - --ignore-not-found=true
      - --wait=true
      - --timeout=10m
  register: sprint2_reset_sigstore_delete
  changed_when: "'deleted' in sprint2_reset_sigstore_delete.stdout"

- name: Uninstall the Kyverno release after dependency validation
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_helm }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - uninstall
      - kyverno
      - --namespace
      - kyverno
      - --ignore-not-found
      - --wait
  register: sprint2_reset_kyverno_uninstall
  changed_when: sprint2_reset_kyverno_uninstall.rc == 0

- name: Delete the Kyverno namespace
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kubectl }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - delete
      - namespace
      - kyverno
      - --ignore-not-found=true
      - --wait=true
      - --timeout=10m
  register: sprint2_reset_kyverno_delete
  changed_when: "'deleted' in sprint2_reset_kyverno_delete.stdout"

- name: Discover residual Kyverno CRDs
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kubectl }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - get
      - customresourcedefinitions.apiextensions.k8s.io
      - -o
      - json
  register: sprint2_reset_crds
  changed_when: false

- name: Derive exact residual Kyverno CRD names
  ansible.builtin.set_fact:
    sprint2_reset_kyverno_crd_names: >-
      {{ (sprint2_reset_crds.stdout | from_json).items
         | selectattr('spec.group', 'equalto', 'kyverno.io')
         | map(attribute='metadata.name') | list }}

- name: Delete exact residual Kyverno CRDs
  ansible.builtin.command:
    argv: >-
      {{ [sprint2_reset_kubectl, '--kubeconfig', sprint2_reset_kubeconfig,
          'delete', 'customresourcedefinitions.apiextensions.k8s.io']
          + sprint2_reset_kyverno_crd_names + ['--wait=true', '--timeout=10m'] }}
  when: sprint2_reset_kyverno_crd_names | length > 0
  changed_when: true

- name: Discover residual Kyverno admission webhooks
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kubectl }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - get
      - validatingwebhookconfigurations,mutatingwebhookconfigurations
      - -o
      - json
  register: sprint2_reset_webhooks
  changed_when: false

- name: Reject residual Kyverno admission webhooks
  ansible.builtin.assert:
    that: >-
      (sprint2_reset_webhooks.stdout | from_json).items
      | selectattr('metadata.name', 'search', 'kyverno') | list | length == 0
    fail_msg: KYVERNO_ADMISSION_WEBHOOK_REMAINS

- name: Delete exact LabWeaver namespaces and their pre-release data
  ansible.builtin.command:
    argv: >-
      {{ [sprint2_reset_kubectl, '--kubeconfig', sprint2_reset_kubeconfig,
          'delete', 'namespace'] + sprint2_reset_namespaces
          + ['--ignore-not-found=true', '--wait=true', '--timeout=15m'] }}
  register: sprint2_reset_namespace_delete
  changed_when: sprint2_reset_namespace_delete.stdout | length > 0

- name: Recreate exact LabWeaver namespace topology
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kubectl }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - create
      - namespace
      - "{{ item }}"
  loop: "{{ sprint2_reset_namespaces }}"
  register: sprint2_reset_namespace_create
  changed_when: true

- name: Label recreated namespaces as reset-owned
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kubectl }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - label
      - namespace
      - "{{ item }}"
      - labweaver.io/managed=true
      - "labweaver.io/reset-run={{ sprint2_reset_run_id }}"
      - --overwrite
  loop: "{{ sprint2_reset_namespaces }}"
  changed_when: true

- name: Render the six-domain destructive database baseline
  ansible.builtin.template:
    src: baseline.sql.j2
    dest: "{{ sprint2_reset_report_root }}/{{ sprint2_reset_run_id }}/baseline.sql"
    owner: root
    group: root
    mode: "0600"

- name: Apply the six-domain destructive database baseline
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_psql }}"
      - service={{ sprint2_reset_postgres_service }}
      - --file
      - "{{ sprint2_reset_report_root }}/{{ sprint2_reset_run_id }}/baseline.sql"
  environment:
    PGSERVICEFILE: "{{ sprint2_reset_postgres_service_file }}"
  register: sprint2_reset_postgres_apply
  changed_when: true
  no_log: true

- name: Delete exact LabWeaver NATS streams
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_nats }}"
      - --server
      - "{{ sprint2_reset_nats_server }}"
      - --creds
      - "{{ sprint2_reset_nats_credentials_file }}"
      - stream
      - delete
      - "{{ item.name }}"
      - --force
  loop: "{{ sprint2_reset_nats_streams }}"
  register: sprint2_reset_nats_delete
  failed_when: sprint2_reset_nats_delete.rc != 0 and 'not found' not in sprint2_reset_nats_delete.stderr | lower
  changed_when: sprint2_reset_nats_delete.rc == 0
  no_log: true

- name: Recreate exact LabWeaver NATS streams
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_nats }}"
      - --server
      - "{{ sprint2_reset_nats_server }}"
      - --creds
      - "{{ sprint2_reset_nats_credentials_file }}"
      - stream
      - add
      - "{{ item.name }}"
      - --subjects
      - "{{ item.subjects }}"
      - --storage
      - file
      - --retention
      - limits
      - --max-age
      - "{{ item.max_age }}"
      - --discard
      - old
      - --defaults
  loop: "{{ sprint2_reset_nats_streams }}"
  changed_when: true
  no_log: true

- name: Delete exact LabWeaver MinIO bucket contents
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_mc }}"
      - rm
      - --recursive
      - --force
      - --versions
      - "{{ sprint2_reset_minio_alias }}/{{ sprint2_reset_minio_bucket }}"
  register: sprint2_reset_minio_delete
  failed_when: sprint2_reset_minio_delete.rc != 0 and 'does not exist' not in sprint2_reset_minio_delete.stderr | lower
  changed_when: sprint2_reset_minio_delete.rc == 0
  no_log: true

- name: Recreate the exact LabWeaver MinIO bucket
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_mc }}"
      - mb
      - --ignore-existing
      - "{{ sprint2_reset_minio_alias }}/{{ sprint2_reset_minio_bucket }}"
  changed_when: true
  no_log: true

- name: Enable immutable artifact bucket versioning
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_mc }}"
      - version
      - enable
      - "{{ sprint2_reset_minio_alias }}/{{ sprint2_reset_minio_bucket }}"
  changed_when: true
  no_log: true

- name: Look up the exact Harbor project
  ansible.builtin.uri:
    url: "{{ sprint2_reset_harbor_api }}/api/v2.0/projects?name={{ sprint2_reset_harbor_project | urlencode }}"
    user: "{{ sprint2_reset_harbor_username }}"
    password: "{{ sprint2_reset_harbor_password }}"
    force_basic_auth: true
    validate_certs: true
    return_content: true
  register: sprint2_reset_harbor_lookup
  no_log: true

- name: Delete the exact Harbor project and all pre-release images
  ansible.builtin.uri:
    url: "{{ sprint2_reset_harbor_api }}/api/v2.0/projects/{{ sprint2_reset_harbor_project | urlencode }}"
    method: DELETE
    user: "{{ sprint2_reset_harbor_username }}"
    password: "{{ sprint2_reset_harbor_password }}"
    force_basic_auth: true
    validate_certs: true
    status_code: [200, 202]
  when: sprint2_reset_harbor_lookup.json | length > 0
  no_log: true

- name: Recreate the private Harbor project
  ansible.builtin.uri:
    url: "{{ sprint2_reset_harbor_api }}/api/v2.0/projects"
    method: POST
    user: "{{ sprint2_reset_harbor_username }}"
    password: "{{ sprint2_reset_harbor_password }}"
    force_basic_auth: true
    validate_certs: true
    body_format: json
    body:
      project_name: "{{ sprint2_reset_harbor_project }}"
      metadata: {public: "false"}
    status_code: [201]
  no_log: true

- name: Authenticate the controlled Keycloak admin client
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kcadm }}"
      - config
      - credentials
      - --server
      - "{{ sprint2_reset_keycloak_server }}"
      - --realm
      - "{{ sprint2_reset_keycloak_admin_realm }}"
      - --user
      - "{{ sprint2_reset_keycloak_username }}"
      - --password
      - "{{ sprint2_reset_keycloak_password }}"
      - --config
      - "{{ sprint2_reset_keycloak_config }}"
  changed_when: false
  no_log: true

- name: Delete the exact Keycloak realm
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kcadm }}"
      - delete
      - "realms/{{ sprint2_reset_keycloak_realm }}"
      - --config
      - "{{ sprint2_reset_keycloak_config }}"
  register: sprint2_reset_keycloak_delete
  failed_when: sprint2_reset_keycloak_delete.rc != 0 and '404' not in sprint2_reset_keycloak_delete.stderr
  changed_when: sprint2_reset_keycloak_delete.rc == 0
  no_log: true

- name: Stage the reviewed Sprint 2 Keycloak realm
  ansible.builtin.copy:
    src: "{{ sprint2_reset_keycloak_realm_file }}"
    dest: "{{ sprint2_reset_report_root }}/{{ sprint2_reset_run_id }}/keycloak-realm.json"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Import the reviewed Sprint 2 Keycloak realm
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kcadm }}"
      - create
      - realms
      - --config
      - "{{ sprint2_reset_keycloak_config }}"
      - --file
      - "{{ sprint2_reset_report_root }}/{{ sprint2_reset_run_id }}/keycloak-realm.json"
  changed_when: true
  no_log: true

- name: Copy the reviewed Sprint 2 Helm chart
  ansible.builtin.copy:
    src: "{{ sprint2_reset_chart_source }}/"
    dest: "{{ sprint2_reset_report_root }}/{{ sprint2_reset_run_id }}/chart/"
    owner: root
    group: root
    mode: preserve

- name: Copy reviewed private values files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ sprint2_reset_report_root }}/{{ sprint2_reset_run_id }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ sprint2_reset_values_files }}"
  no_log: true

- name: Copy the reviewed rollback probe values
  ansible.builtin.copy:
    src: "{{ sprint2_reset_rollback_probe_values_file }}"
    dest: "{{ sprint2_reset_report_root }}/{{ sprint2_reset_run_id }}/rollback-probe-values.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Build controlled Helm values arguments
  ansible.builtin.set_fact:
    sprint2_reset_remote_values_argv: >-
      {{ sprint2_reset_values_files
         | map('basename')
         | map('regex_replace', '^(.*)$', sprint2_reset_report_root + '/' + sprint2_reset_run_id + '/\\1')
         | map('regex_replace', '^(.*)$', '--values=\\1') | list }}

- name: Deploy the Sprint 2 profile atomically
  ansible.builtin.command:
    argv: >-
      {{ [sprint2_reset_helm, '--kubeconfig', sprint2_reset_kubeconfig,
          'upgrade', '--install', sprint2_reset_release_name,
          sprint2_reset_report_root + '/' + sprint2_reset_run_id + '/chart',
          '--namespace', sprint2_reset_namespace, '--atomic', '--wait',
          '--timeout', sprint2_reset_rollout_timeout]
          + sprint2_reset_remote_values_argv }}
  changed_when: true

- name: Read the first deployment revision
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_helm }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - status
      - "{{ sprint2_reset_release_name }}"
      - --namespace
      - "{{ sprint2_reset_namespace }}"
      - --output
      - json
  register: sprint2_reset_first_status
  changed_when: false

- name: Record the first deployment revision
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_helm }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - history
      - "{{ sprint2_reset_release_name }}"
      - --namespace
      - "{{ sprint2_reset_namespace }}"
      - --max
      - "1"
      - --output
      - json
  register: sprint2_reset_first_revision_raw
  changed_when: false

- name: Normalize the first deployment revision
  ansible.builtin.set_fact:
    sprint2_reset_first_revision_value: "{{ (sprint2_reset_first_revision_raw.stdout | from_json | first).revision }}"

- name: Deploy the identical Sprint 2 profile a second time
  ansible.builtin.command:
    argv: >-
      {{ [sprint2_reset_helm, '--kubeconfig', sprint2_reset_kubeconfig,
          'upgrade', '--install', sprint2_reset_release_name,
          sprint2_reset_report_root + '/' + sprint2_reset_run_id + '/chart',
          '--namespace', sprint2_reset_namespace, '--atomic', '--wait',
          '--timeout', sprint2_reset_rollout_timeout]
          + sprint2_reset_remote_values_argv }}
  changed_when: true

- name: Read the second deployment revision
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_helm }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - history
      - "{{ sprint2_reset_release_name }}"
      - --namespace
      - "{{ sprint2_reset_namespace }}"
      - --max
      - "1"
      - --output
      - json
  register: sprint2_reset_second_revision_raw
  changed_when: false

- name: Normalize deployment revisions for the report
  ansible.builtin.set_fact:
    sprint2_reset_first_revision:
      stdout: "{{ sprint2_reset_first_revision_value }}"
    sprint2_reset_second_revision:
      stdout: "{{ (sprint2_reset_second_revision_raw.stdout | from_json | first).revision }}"

- name: Exercise atomic rollback with reviewed invalid readiness values
  ansible.builtin.command:
    argv: >-
      {{ [sprint2_reset_helm, '--kubeconfig', sprint2_reset_kubeconfig,
          'upgrade', sprint2_reset_release_name,
          sprint2_reset_report_root + '/' + sprint2_reset_run_id + '/chart',
          '--namespace', sprint2_reset_namespace, '--atomic', '--wait',
          '--timeout', '2m'] + sprint2_reset_remote_values_argv
          + ['--values', sprint2_reset_report_root + '/' + sprint2_reset_run_id + '/rollback-probe-values.yml'] }}
  register: sprint2_reset_rollback_probe
  failed_when: false
  changed_when: false

- name: Require the rollback probe to fail closed
  ansible.builtin.assert:
    that: sprint2_reset_rollback_probe.rc != 0
    fail_msg: SPRINT2_ROLLBACK_PROBE_DID_NOT_FAIL

- name: Verify the release recovered after the failed upgrade
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_helm }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - status
      - "{{ sprint2_reset_release_name }}"
      - --namespace
      - "{{ sprint2_reset_namespace }}"
      - --output
      - json
  register: sprint2_reset_rollback_status
  changed_when: false

- name: Require a deployed release after atomic rollback
  ansible.builtin.assert:
    that: (sprint2_reset_rollback_status.stdout | from_json).info.status == 'deployed'
    fail_msg: SPRINT2_ATOMIC_ROLLBACK_FAILED

- name: Verify every Sprint 2 workload rollout
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kubectl }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - --namespace
      - "{{ sprint2_reset_namespace }}"
      - rollout
      - status
      - "deployment/{{ item }}"
      - "--timeout={{ sprint2_reset_rollout_timeout }}"
  loop: "{{ sprint2_reset_workloads }}"
  changed_when: false

- name: Read back the exact Sprint 2 deployment set
  ansible.builtin.command:
    argv:
      - "{{ sprint2_reset_kubectl }}"
      - --kubeconfig
      - "{{ sprint2_reset_kubeconfig }}"
      - --namespace
      - "{{ sprint2_reset_namespace }}"
      - get
      - deployments
      - -l
      - app.kubernetes.io/instance={{ sprint2_reset_release_name }}
      - -o
      - json
  register: sprint2_reset_deployment_readback
  changed_when: false

- name: Require the exact Sprint 2 deployment set
  ansible.builtin.assert:
    that:
      - >-
        (sprint2_reset_deployment_readback.stdout | from_json).items
        | map(attribute='metadata.name') | sort
        == sprint2_reset_workloads | sort
      - (sprint2_reset_first_status.stdout | from_json).info.status == 'deployed'
    fail_msg: SPRINT2_DEPLOYMENT_READBACK_FAILED

- name: Hash the pre-destruction inventory
  ansible.builtin.stat:
    path: "{{ sprint2_reset_report_root }}/{{ sprint2_reset_run_id }}/inventory.json"
    checksum_algorithm: sha256
  register: sprint2_reset_inventory_stat

- name: Persist the sanitized reset and deployment report
  ansible.builtin.template:
    src: reset-report.json.j2
    dest: "{{ sprint2_reset_report_root }}/{{ sprint2_reset_run_id }}/report.json"
    owner: root
    group: root
    mode: "0600"
