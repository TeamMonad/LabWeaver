---
sprint2_reset_confirmation: "{{ lookup('ansible.builtin.env', 'LABWEAVER_SPRINT2_RESET_CONFIRMATION') }}"
sprint2_reset_run_id: "{{ lookup('ansible.builtin.env', 'LABWEAVER_RUN_ID') }}"
sprint2_reset_source_commit: "{{ lookup('ansible.builtin.env', 'LABWEAVER_COMMIT_SHA') }}"
sprint2_reset_migration_catalog: "{{ playbook_dir }}/../../../migrations/catalog.yaml"
sprint2_reset_kubeconfig: /etc/kubernetes/admin.conf
sprint2_reset_kubectl: /usr/bin/kubectl
sprint2_reset_helm: /usr/local/bin/helm
sprint2_reset_psql: /usr/bin/psql
sprint2_reset_nats: /usr/local/bin/nats
sprint2_reset_mc: /usr/local/bin/mc
sprint2_reset_kcadm: /usr/local/bin/kcadm.sh
sprint2_reset_buildctl: /usr/local/bin/buildctl
sprint2_reset_report_root: /var/lib/labweaver/sprint2-reset
sprint2_reset_namespaces:
  - access-system
  - environment-system
  - labweaver-demo
  - labweaver-evaluation
  - labweaver-system
sprint2_reset_domains: [control, access, environment, agent, evaluation, resource]
sprint2_reset_postgres_service_file: ""
sprint2_reset_postgres_service: sprint2-admin
sprint2_reset_nats_server: ""
sprint2_reset_nats_credentials_file: ""
sprint2_reset_nats_streams:
  - name: LABWEAVER_AGENT_EVENTS
    subjects: labweaver.agent.>
    max_age: 24h
  - name: LABWEAVER_CONTROL_COMMANDS
    subjects: labweaver.control.agent_build.requested.v1
    max_age: 24h
  - name: LABWEAVER_ENVIRONMENT_COMMANDS
    subjects: labweaver.environment.instance.lifecycle_requested.v1
    max_age: 24h
  - name: LABWEAVER_RELEASES
    subjects: labweaver.control.environment_template_release.>
    max_age: 168h
  - {name: LABWEAVER_ACCESS, subjects: "labweaver.access.>", max_age: 24h}
  - {name: LABWEAVER_SUBMISSION, subjects: "labweaver.evaluation.submission.>", max_age: 168h}
sprint2_reset_minio_alias: ""
sprint2_reset_minio_bucket: labweaver-artifacts
sprint2_reset_buildkit_address: ""
sprint2_reset_harbor_api: ""
sprint2_reset_harbor_username: ""
sprint2_reset_harbor_password: ""
sprint2_reset_harbor_project: labweaver-system
sprint2_reset_keycloak_realm: workloads
sprint2_reset_keycloak_config: ""
sprint2_reset_keycloak_server: ""
sprint2_reset_keycloak_admin_realm: master
sprint2_reset_keycloak_username: ""
sprint2_reset_keycloak_password: ""
sprint2_reset_keycloak_realm_file: ""
sprint2_reset_chart_source: "{{ playbook_dir }}/../../helm/labweaver"
sprint2_reset_values_files: []
sprint2_reset_rollback_probe_values_file: ""
sprint2_reset_configuration_bundle: ""
sprint2_reset_configuration_manifest: "{{ playbook_dir }}/../../config/sprint2-bundle-manifest.json"
sprint2_reset_required_configmaps:
  - control-service-config
  - access-service-config
  - agent-service-config
  - build-executor-config
  - environment-service-config
  - container-executor-config
  - kubevirt-executor-config
  - web-config
sprint2_reset_required_secrets:
  - control-service-secrets
  - access-service-secrets
  - agent-service-secrets
  - build-executor-secrets
  - environment-service-secrets
  - container-executor-secrets
  - kubevirt-executor-secrets
  - openssh-gateway-secrets
sprint2_reset_release_name: labweaver
sprint2_reset_namespace: labweaver-system
sprint2_reset_rollout_timeout: 10m
sprint2_reset_workloads:
  - control-service
  - access-service
  - agent-service
  - build-executor
  - environment-service
  - container-executor
  - kubevirt-executor
  - openssh-gateway
  - web
sprint2_reset_runtime_probe_namespace: labweaver-demo
