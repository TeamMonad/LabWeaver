---
- name: Validate the bounded Harbor route adoption inputs
  ansible.builtin.assert:
    that:
      - harbor_namespace == 'harbor'
      - harbor_release_name == 'harbor'
      - harbor_gateway_name | length > 0
      - harbor_hostname is match('^[a-z0-9][a-z0-9.-]+$')
      - harbor_kubeconfig_path | length > 0
    fail_msg: SPRINT2_HARBOR_ROUTE_INPUT_INVALID

- name: Read the existing Harbor namespace
  kubernetes.core.k8s_info:
    kubeconfig: "{{ harbor_kubeconfig_path }}"
    api_version: v1
    kind: Namespace
    name: "{{ harbor_namespace }}"
  register: sprint2_harbor_namespace_read

- name: Read the existing Harbor nginx service
  kubernetes.core.k8s_info:
    kubeconfig: "{{ harbor_kubeconfig_path }}"
    api_version: v1
    kind: Service
    namespace: "{{ harbor_namespace }}"
    name: "{{ harbor_release_name }}"
  register: sprint2_harbor_service_read

- name: Read the existing Harbor nginx endpoint slices
  kubernetes.core.k8s_info:
    kubeconfig: "{{ harbor_kubeconfig_path }}"
    api_version: discovery.k8s.io/v1
    kind: EndpointSlice
    namespace: "{{ harbor_namespace }}"
    label_selectors:
      - "kubernetes.io/service-name={{ harbor_release_name }}"
  register: sprint2_harbor_endpoint_slice_read

- name: Read the existing Harbor Gateway
  kubernetes.core.k8s_info:
    kubeconfig: "{{ harbor_kubeconfig_path }}"
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    namespace: "{{ harbor_namespace }}"
    name: "{{ harbor_gateway_name }}"
  register: sprint2_harbor_gateway_read

- name: Read the existing Harbor HTTPRoute
  kubernetes.core.k8s_info:
    kubeconfig: "{{ harbor_kubeconfig_path }}"
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    namespace: "{{ harbor_namespace }}"
    name: harbor
  register: sprint2_harbor_route_read

- name: Bind existing Harbor adoption objects
  ansible.builtin.set_fact:
    sprint2_harbor_namespace_object: "{{ sprint2_harbor_namespace_read.resources | first | default({}) }}"
    sprint2_harbor_service_object: "{{ sprint2_harbor_service_read.resources | first | default({}) }}"
    sprint2_harbor_endpoint_slices: "{{ sprint2_harbor_endpoint_slice_read.resources }}"
    sprint2_harbor_gateway_object: "{{ sprint2_harbor_gateway_read.resources | first | default({}) }}"
    sprint2_harbor_route_object: "{{ sprint2_harbor_route_read.resources | first | default({}) }}"

- name: Reject an incomplete or unmanaged Harbor installation
  ansible.builtin.assert:
    that:
      - sprint2_harbor_namespace_object.metadata.labels['app.kubernetes.io/part-of'] | default('') == 'labweaver-infrastructure'
      - sprint2_harbor_service_object.metadata.name | default('') == harbor_release_name
      - sprint2_harbor_service_object.spec.ports | selectattr('port', 'equalto', 80) | list | length == 1
      - sprint2_harbor_endpoint_slices | length > 0
      - sprint2_harbor_endpoint_slices | map(attribute='endpoints') | flatten | selectattr('conditions.ready', 'defined') | selectattr('conditions.ready', 'equalto', true) | list | length > 0
      - sprint2_harbor_gateway_object.metadata.labels['app.kubernetes.io/part-of'] | default('') == 'labweaver-infrastructure'
      - sprint2_harbor_route_object.metadata.labels['app.kubernetes.io/part-of'] | default('') == 'labweaver-infrastructure'
    fail_msg: SPRINT2_HARBOR_ADOPTION_BOUNDARY_INVALID

- name: Read the existing Harbor nginx public CA
  kubernetes.core.k8s_info:
    kubeconfig: "{{ harbor_kubeconfig_path }}"
    api_version: v1
    kind: Secret
    namespace: "{{ harbor_namespace }}"
    name: harbor-nginx
  register: sprint2_harbor_nginx_secret_read
  no_log: true

- name: Reject missing Harbor nginx TLS material
  ansible.builtin.assert:
    that:
      - sprint2_harbor_nginx_secret_read.resources | length == 1
      - sprint2_harbor_nginx_secret_read.resources[0].metadata.labels['app.kubernetes.io/managed-by'] | default('') == 'Helm'
      - sprint2_harbor_nginx_secret_read.resources[0].data['ca.crt'] | default('') | length > 0
    fail_msg: SPRINT2_HARBOR_BACKEND_CA_INVALID
  no_log: true

- name: Publish only the Harbor nginx public CA for Gateway validation
  kubernetes.core.k8s:
    kubeconfig: "{{ harbor_kubeconfig_path }}"
    state: present
    apply: true
    server_side_apply:
      field_manager: labweaver-sprint2-adoption
      force_conflicts: false
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: harbor-backend-ca
        namespace: "{{ harbor_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver-infrastructure
      data:
        ca.crt: "{{ sprint2_harbor_nginx_secret_read.resources[0].data['ca.crt'] | b64decode }}"
  no_log: true

- name: Require TLS validation for the Harbor nginx backend
  kubernetes.core.k8s:
    kubeconfig: "{{ harbor_kubeconfig_path }}"
    state: present
    apply: true
    server_side_apply:
      field_manager: labweaver-sprint2-adoption
      force_conflicts: false
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: BackendTLSPolicy
      metadata:
        name: harbor
        namespace: "{{ harbor_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver-infrastructure
      spec:
        targetRefs:
          - group: ''
            kind: Service
            name: "{{ harbor_release_name }}"
            sectionName: https
        validation:
          hostname: "{{ harbor_hostname }}"
          caCertificateRefs:
            - group: ''
              kind: ConfigMap
              name: harbor-backend-ca

- name: Adopt only the existing Harbor HTTPRoute backend
  kubernetes.core.k8s:
    kubeconfig: "{{ harbor_kubeconfig_path }}"
    state: present
    apply: true
    server_side_apply:
      field_manager: labweaver-sprint2-adoption
      # The retained route was created by kubectl client-side apply. Ownership
      # transfer is bounded by the managed-object and ready-backend checks above.
      force_conflicts: true
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: harbor
        namespace: "{{ harbor_namespace }}"
        labels:
          app.kubernetes.io/part-of: labweaver-infrastructure
      spec:
        parentRefs:
          - name: "{{ harbor_gateway_name }}"
            sectionName: https
        hostnames:
          - "{{ harbor_hostname }}"
        rules:
          - backendRefs:
              - name: "{{ harbor_release_name }}"
                port: 443
  register: sprint2_harbor_route_apply

- name: Read adopted Harbor HTTPRoute status
  kubernetes.core.k8s_info:
    kubeconfig: "{{ harbor_kubeconfig_path }}"
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    namespace: "{{ harbor_namespace }}"
    name: harbor
  register: sprint2_harbor_route_readback

- name: Require the Gateway controller to accept and resolve the adopted route
  ansible.builtin.assert:
    that:
      - sprint2_harbor_route_readback.resources | length == 1
      - sprint2_harbor_route_readback.resources[0].spec.rules[0].backendRefs[0].name == harbor_release_name
      - sprint2_harbor_route_readback.resources[0].spec.rules[0].backendRefs[0].port == 443
      - sprint2_harbor_route_readback.resources[0].status.parents | default([]) | map(attribute='conditions') | flatten | selectattr('type', 'equalto', 'Accepted') | selectattr('status', 'equalto', 'True') | list | length > 0
      - sprint2_harbor_route_readback.resources[0].status.parents | default([]) | map(attribute='conditions') | flatten | selectattr('type', 'equalto', 'ResolvedRefs') | selectattr('status', 'equalto', 'True') | list | length > 0
    fail_msg: SPRINT2_HARBOR_ROUTE_NOT_READY

- name: Verify the adopted Docker Registry endpoint contract
  ansible.builtin.uri:
    url: "https://{{ harbor_hostname }}/v2/"
    method: GET
    validate_certs: true
    status_code: 401
    return_content: false
  register: sprint2_harbor_registry_probe

- name: Reject a route that bypasses the Harbor registry authentication boundary
  ansible.builtin.assert:
    that:
      - sprint2_harbor_registry_probe.docker_distribution_api_version | default('') == 'registry/2.0'
      - sprint2_harbor_registry_probe.www_authenticate | default('') is search('/service/token')
    fail_msg: SPRINT2_HARBOR_REGISTRY_ROUTE_INVALID
