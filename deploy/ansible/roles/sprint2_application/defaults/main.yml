---
sprint2_application_run_id: "{{ lookup('ansible.builtin.env', 'LABWEAVER_RUN_ID') }}"
sprint2_application_source_commit: "{{ lookup('ansible.builtin.env', 'LABWEAVER_COMMIT_SHA') }}"
sprint2_application_package_manifest: "{{ lookup('ansible.builtin.env', 'LABWEAVER_PACKAGE_MANIFEST') }}"
sprint2_application_migration_catalog: "{{ playbook_dir }}/../../../migrations/catalog.yaml"
sprint2_application_kubeconfig: "{{ sprint2_reset_kubeconfig | default('/etc/kubernetes/admin.conf') }}"
sprint2_application_kubectl: "{{ sprint2_reset_kubectl | default('/usr/bin/kubectl') }}"
sprint2_application_helm: "{{ sprint2_reset_helm | default('/usr/local/bin/helm') }}"
sprint2_application_psql: "{{ sprint2_reset_psql | default('/usr/bin/psql') }}"
sprint2_application_nats: "{{ sprint2_reset_nats | default('/usr/local/bin/nats') }}"
sprint2_application_mc: "{{ sprint2_reset_mc | default('/usr/local/bin/mc') }}"
sprint2_application_kcadm: "{{ sprint2_reset_kcadm | default('/usr/local/bin/kcadm.sh') }}"
sprint2_application_report_root: /var/lib/labweaver/sprint2-application
sprint2_application_domains: [control, access, environment, agent, evaluation, resource]
sprint2_application_postgres_service_file: "{{ sprint2_reset_postgres_service_file }}"
sprint2_application_postgres_service: "{{ sprint2_reset_postgres_service | default('sprint2-admin') }}"
sprint2_application_nats_server: "{{ sprint2_reset_nats_server }}"
sprint2_application_nats_credentials_file: "{{ sprint2_reset_nats_credentials_file }}"
sprint2_application_nats_streams:
  - {name: LABWEAVER_AGENT_EVENTS, subjects: "labweaver.agent.>", max_age: 24h}
  - {name: LABWEAVER_CONTROL_COMMANDS, subjects: "labweaver.control.agent_build.requested.v1", max_age: 24h}
  - {name: LABWEAVER_ENVIRONMENT_COMMANDS, subjects: "labweaver.environment.instance.lifecycle_requested.v1", max_age: 24h}
  - {name: LABWEAVER_RELEASES, subjects: "labweaver.control.environment_template_release.>", max_age: 168h}
  - {name: LABWEAVER_ACCESS, subjects: "labweaver.access.>", max_age: 24h}
  - {name: LABWEAVER_SUBMISSION, subjects: "labweaver.evaluation.submission.>", max_age: 168h}
sprint2_application_minio_alias: "{{ sprint2_reset_minio_alias }}"
sprint2_application_minio_bucket: "{{ sprint2_reset_minio_bucket | default('labweaver-artifacts') }}"
sprint2_application_harbor_api: "{{ sprint2_reset_harbor_api }}"
sprint2_application_harbor_username: "{{ sprint2_reset_harbor_username }}"
sprint2_application_harbor_password: "{{ sprint2_reset_harbor_password }}"
sprint2_application_harbor_project: "{{ sprint2_reset_harbor_project | default('labweaver-system') }}"
sprint2_application_keycloak_realm: "{{ sprint2_reset_keycloak_realm | default('workloads') }}"
sprint2_application_keycloak_config: "{{ sprint2_reset_keycloak_config }}"
sprint2_application_keycloak_server: "{{ sprint2_reset_keycloak_server }}"
sprint2_application_keycloak_admin_realm: "{{ sprint2_reset_keycloak_admin_realm | default('master') }}"
sprint2_application_keycloak_username: "{{ sprint2_reset_keycloak_username }}"
sprint2_application_keycloak_password: "{{ sprint2_reset_keycloak_password }}"
sprint2_application_keycloak_realm_file: "{{ sprint2_reset_keycloak_realm_file }}"
sprint2_application_access_seed_file: "{{ sprint2_reset_access_seed_file }}"
sprint2_application_chart_source: "{{ playbook_dir }}/../../helm/labweaver"
sprint2_application_values_files: "{{ sprint2_reset_values_files }}"
sprint2_application_configuration_bundle: "{{ sprint2_reset_configuration_bundle }}"
sprint2_application_configuration_manifest: "{{ sprint2_reset_configuration_manifest | default(playbook_dir + '/../../config/sprint2-bundle-manifest.json') }}"
sprint2_application_required_configmaps:
  - control-service-config
  - access-service-config
  - agent-service-config
  - build-executor-config
  - environment-service-config
  - evaluation-service-config
  - container-executor-config
  - kubevirt-executor-config
  - web-config
sprint2_application_required_secrets:
  - control-service-secrets
  - access-service-secrets
  - agent-service-secrets
  - build-executor-secrets
  - environment-service-secrets
  - evaluation-service-secrets
  - container-executor-secrets
  - kubevirt-executor-secrets
  - openssh-gateway-secrets
sprint2_application_release_name: "{{ sprint2_reset_release_name | default('labweaver') }}"
sprint2_application_namespace: "{{ sprint2_reset_namespace | default('labweaver-system') }}"
sprint2_application_rollout_timeout: "{{ sprint2_reset_rollout_timeout | default('10m') }}"
sprint2_application_workloads:
  - control-service
  - access-service
  - agent-service
  - build-executor
  - environment-service
  - evaluation-service
  - container-executor
  - kubevirt-executor
  - openssh-gateway
  - web
sprint2_application_components:
  - access-service
  - agent-service
  - control-service
  - environment-service
  - evaluation-service
  - openssh-gateway
  - web
