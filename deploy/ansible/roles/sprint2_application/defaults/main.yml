  - access-service-secrets
  - agent-service-secrets
  - build-executor-secrets
  - environment-service-secrets
  - evaluation-service-secrets
  - container-executor-secrets
  - kubevirt-executor-secrets
  - openssh-gateway-secrets
sprint2_application_release_name: labweaver
sprint2_application_namespace: labweaver-system
sprint2_application_rollout_timeout: 10m
sprint2_application_portal_route_namespace: ""
sprint2_application_portal_route_name: ""
