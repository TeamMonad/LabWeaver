---
- name: Refresh retained router trust
  ansible.builtin.command: update-ca-trust
  changed_when: true
  delegate_to: "{{ groups['routers'] | first }}"
  become: true

- name: Refresh Kubernetes node Harbor trust
  ansible.builtin.command: update-ca-trust
  changed_when: true
  delegate_to: "{{ item }}"
  become: true
  loop: "{{ groups['k8s_cluster'] }}"

- name: Restart the adopted PostgreSQL port-forward
  ansible.builtin.systemd_service:
    name: "{{ sprint2_application_postgres_forward_service_name }}"
    enabled: true
    state: restarted
    daemon_reload: true
  become: true
