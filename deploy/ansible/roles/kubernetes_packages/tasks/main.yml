---
# Install pinned CRI-O and Kubernetes packages from pkgs.k8s.io.
# RedHat family uses the RPM channel, Debian/Ubuntu family the deb channel;
# both pin the same versions from deploy/versions.lock.yml.
- name: Configure Kubernetes RPM repository (RedHat)
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes {{ kubernetes_minor }}
    baseurl: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/rpm/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/rpm/repodata/repomd.xml.key"
  when: ansible_facts.os_family == 'RedHat'

- name: Configure CRI-O RPM repository (RedHat)
  ansible.builtin.yum_repository:
    name: crio
    description: CRI-O {{ kubernetes_minor }}
    baseurl: "https://pkgs.k8s.io/addons:/cri-o:/stable:/{{ kubernetes_minor }}/rpm/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/addons:/cri-o:/stable:/{{ kubernetes_minor }}/rpm/repodata/repomd.xml.key"
  when: ansible_facts.os_family == 'RedHat'

- name: Install pinned Kubernetes and CRI-O packages (RedHat)
  ansible.builtin.dnf:
    name:
      - "cri-o-{{ crio_version }}*"
      - "kubelet-{{ kubernetes_patch | regex_replace('^v', '') }}*"
      - "kubeadm-{{ kubernetes_patch | regex_replace('^v', '') }}*"
      - "kubectl-{{ kubernetes_patch | regex_replace('^v', '') }}*"
    state: present
    disable_excludes: kubernetes
  when: ansible_facts.os_family == 'RedHat'

- name: Ensure the APT keyrings directory exists (Ubuntu)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_facts.os_family == 'Debian'

- name: Remove stale Kubernetes/CRI-O apt sources and keyrings (old cluster,
    previous pkgs.k8s.io addons channel) before configuring fresh ones
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/kubernetes.list
    - /etc/apt/sources.list.d/cri-o.list
    - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    - /etc/apt/keyrings/kubernetes-apt-keyring.asc
    - /etc/apt/keyrings/cri-o-apt-keyring.gpg
    - /etc/apt/keyrings/cri-o-apt-keyring.asc
  when: ansible_facts.os_family == 'Debian'

- name: Configure Kubernetes APT keyring (Ubuntu)
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
  when: ansible_facts.os_family == 'Debian'

- name: Configure Kubernetes APT repository (Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/ /"
    filename: kubernetes
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Configure CRI-O APT keyring (Ubuntu)
  ansible.builtin.get_url:
    url: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ kubernetes_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/cri-o-apt-keyring.asc
    mode: '0644'
  when: ansible_facts.os_family == 'Debian'

- name: Configure CRI-O APT repository (Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.asc] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ kubernetes_minor }}/deb/ /"
    filename: cri-o
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Refresh APT after repository change (Ubuntu)
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts.os_family == 'Debian'

- name: Assert the exact pinned candidate versions are available (Ubuntu)
  ansible.builtin.shell: "apt-cache policy {{ item.pkg }} | awk '/Candidate/{print $2}'"
  changed_when: false
  register: v1_candidate
  loop:
    - { pkg: kubeadm, version: "{{ kubernetes_patch | regex_replace('^v', '') }}" }
    - { pkg: kubelet, version: "{{ kubernetes_patch | regex_replace('^v', '') }}" }
    - { pkg: kubectl, version: "{{ kubernetes_patch | regex_replace('^v', '') }}" }
    - { pkg: cri-o, version: "{{ crio_version }}" }
  when: ansible_facts.os_family == 'Debian'

- name: Reject version drift from the lock file (Ubuntu)
  ansible.builtin.assert:
    that: item.stdout | trim is startswith(item.item.version)
    fail_msg: >-
      KUBERNETES_PACKAGE_VERSION_DRIFT: {{ item.item.pkg }} candidate
      {{ item.stdout | trim }} does not match locked
      {{ item.item.version }}
  loop: "{{ v1_candidate.results }}"
  when: ansible_facts.os_family == 'Debian'

- name: Install pinned Kubernetes and CRI-O packages (Ubuntu)
  ansible.builtin.apt:
    name: [cri-o, kubelet, kubeadm, kubectl]
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Enable CRI-O and kubelet
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [crio, kubelet]
