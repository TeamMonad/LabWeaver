---
- name: Validate Resource replay identity reconciliation inputs
  ansible.builtin.assert:
    that:
      - resource_replay_auth_base_url is match('^https://[a-z0-9][a-z0-9.-]*(?::[0-9]+)?$')
      - resource_replay_auth_keycloak_server is match('^https://[a-z0-9][a-z0-9.-]*(?::[0-9]+)?$')
      - resource_replay_auth_keycloak_hostname is match('^[a-z0-9][a-z0-9.-]+$')
      - resource_replay_auth_keycloak_endpoint_address is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - resource_replay_auth_keycloak_realm == 'workloads'
      - resource_replay_auth_keycloak_admin_realm == 'master'
      - resource_replay_auth_required_users == ['platform-teacher', 'platform-student', 'platform-admin']
    fail_msg: LW_RESOURCE_REPLAY_AUTH_INPUT_INVALID

- name: Inspect Resource replay identity prerequisites
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop:
    - "{{ resource_replay_auth_driver }}"
    - "{{ resource_replay_auth_trusted_ca_file }}"
    - "{{ resource_replay_auth_keycloak_ca_file }}"
    - "{{ resource_replay_auth_identity_seed_file }}"
    - "{{ resource_replay_auth_keycloak_admin_username_file }}"
    - "{{ resource_replay_auth_keycloak_admin_password_file }}"
    - "{{ resource_replay_auth_keycloak_truststore_password_file }}"
    - "{{ resource_replay_auth_kcadm }}"
    - "{{ resource_replay_auth_keytool }}"
  register: resource_replay_auth_prerequisites
  no_log: true

- name: Reject invalid Resource replay identity prerequisites
  ansible.builtin.assert:
    that:
      - resource_replay_auth_prerequisites.results[0].stat.exists
      - resource_replay_auth_prerequisites.results[1].stat.exists
      - resource_replay_auth_prerequisites.results[2].stat.exists
      - resource_replay_auth_prerequisites.results[3].stat.exists
      - resource_replay_auth_prerequisites.results[4].stat.exists
      - resource_replay_auth_prerequisites.results[5].stat.exists
      - resource_replay_auth_prerequisites.results[6].stat.exists
      - resource_replay_auth_prerequisites.results[7].stat.exists
      - resource_replay_auth_prerequisites.results[8].stat.exists
      - resource_replay_auth_prerequisites.results[0].stat.isreg
      - resource_replay_auth_prerequisites.results[1].stat.isreg
      - resource_replay_auth_prerequisites.results[2].stat.isreg
      - resource_replay_auth_prerequisites.results[3].stat.isreg
      - resource_replay_auth_prerequisites.results[4].stat.isreg
      - resource_replay_auth_prerequisites.results[5].stat.isreg
      - resource_replay_auth_prerequisites.results[6].stat.isreg
      - resource_replay_auth_prerequisites.results[7].stat.isreg
      - resource_replay_auth_prerequisites.results[8].stat.isreg
      - resource_replay_auth_prerequisites.results[2].stat.mode == '0600'
      - resource_replay_auth_prerequisites.results[3].stat.mode == '0600'
      - resource_replay_auth_prerequisites.results[4].stat.mode == '0600'
      - resource_replay_auth_prerequisites.results[5].stat.mode == '0600'
      - resource_replay_auth_prerequisites.results[6].stat.mode == '0600'
    quiet: true
    fail_msg: LW_RESOURCE_REPLAY_AUTH_PREREQUISITE_INVALID

- name: Create root-only Resource replay authentication directory
  ansible.builtin.file:
    path: "{{ resource_replay_auth_root }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Read reviewed Resource replay identity seed
  ansible.builtin.slurp:
    src: "{{ resource_replay_auth_identity_seed_file }}"
  register: resource_replay_auth_seed_file
  changed_when: false
  no_log: true

- name: Bind reviewed Resource replay identity seed
  ansible.builtin.set_fact:
    resource_replay_auth_seed: "{{ resource_replay_auth_seed_file.content | b64decode | from_json }}"
  no_log: true

- name: Require exact reviewed replay users and password credentials
  ansible.builtin.assert:
    that:
      - >-
        resource_replay_auth_seed.users | selectattr('username', 'equalto', item)
        | list | length == 1
      - >-
        (resource_replay_auth_seed.users | selectattr('username', 'equalto', item)
        | first).credentials | selectattr('type', 'equalto', 'password')
        | list | length == 1
      - >-
        ((resource_replay_auth_seed.users | selectattr('username', 'equalto', item)
        | first).credentials | selectattr('type', 'equalto', 'password')
        | first).value | length > 0
    fail_msg: LW_RESOURCE_REPLAY_AUTH_IDENTITY_SEED_INVALID
  loop: "{{ resource_replay_auth_required_users }}"
  no_log: true

- name: Read private Keycloak administration locators
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ resource_replay_auth_keycloak_admin_username_file }}"
    - "{{ resource_replay_auth_keycloak_admin_password_file }}"
    - "{{ resource_replay_auth_keycloak_truststore_password_file }}"
  register: resource_replay_auth_keycloak_private_files
  changed_when: false
  no_log: true

- name: Bind private Keycloak administration inputs
  ansible.builtin.set_fact:
    resource_replay_auth_keycloak_admin_username: "{{ resource_replay_auth_keycloak_private_files.results[0].content | b64decode | trim }}"
    resource_replay_auth_keycloak_admin_password: "{{ resource_replay_auth_keycloak_private_files.results[1].content | b64decode | trim }}"
    resource_replay_auth_keycloak_truststore_password: "{{ resource_replay_auth_keycloak_private_files.results[2].content | b64decode | trim }}"
  no_log: true

- name: Require non-empty Keycloak administration inputs
  ansible.builtin.assert:
    that:
      - resource_replay_auth_keycloak_admin_username | length > 0
      - resource_replay_auth_keycloak_admin_password | length > 0
      - resource_replay_auth_keycloak_truststore_password | length >= 16
    fail_msg: LW_RESOURCE_REPLAY_AUTH_KEYCLOAK_INPUT_INVALID
  no_log: true

- name: Bind Keycloak hostname to its reviewed endpoint address
  ansible.builtin.copy:
    dest: "{{ resource_replay_auth_keycloak_hosts }}"
    content: "{{ resource_replay_auth_keycloak_endpoint_address }} {{ resource_replay_auth_keycloak_hostname }}\n"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Remove stale staged Resource replay Keycloak truststore
  ansible.builtin.file:
    path: "{{ resource_replay_auth_keycloak_truststore_staged }}"
    state: absent
  no_log: true

- name: Build staged Resource replay Keycloak truststore
  ansible.builtin.command:
    argv:
      - "{{ resource_replay_auth_keytool }}"
      - -importcert
      - -noprompt
      - -storetype
      - PKCS12
      - -alias
      - labweaver-keycloak-ca
      - -file
      - "{{ resource_replay_auth_keycloak_ca_file }}"
      - -keystore
      - "{{ resource_replay_auth_keycloak_truststore_staged }}"
      - -storepass
      - "{{ resource_replay_auth_keycloak_truststore_password }}"
  changed_when: true
  no_log: true

- name: Restrict staged Resource replay Keycloak truststore permissions
  ansible.builtin.file:
    path: "{{ resource_replay_auth_keycloak_truststore_staged }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Atomically publish Resource replay Keycloak truststore
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - -f
      - "{{ resource_replay_auth_keycloak_truststore_staged }}"
      - "{{ resource_replay_auth_keycloak_truststore }}"
  changed_when: true
  no_log: true

- name: Bind Keycloak administration to isolated truststore
  ansible.builtin.command:
    argv:
      - "{{ resource_replay_auth_kcadm }}"
      - config
      - truststore
      - "{{ resource_replay_auth_keycloak_truststore }}"
      - --trustpass
      - "{{ resource_replay_auth_keycloak_truststore_password }}"
      - --config
      - "{{ resource_replay_auth_keycloak_config }}"
  changed_when: false
  no_log: true

- name: Authenticate Keycloak administration for Resource replay identities
  ansible.builtin.command:
    argv:
      - "{{ resource_replay_auth_kcadm }}"
      - config
      - credentials
      - --server
      - "{{ resource_replay_auth_keycloak_server }}"
      - --realm
      - "{{ resource_replay_auth_keycloak_admin_realm }}"
      - --user
      - "{{ resource_replay_auth_keycloak_admin_username }}"
      - --password
      - "{{ resource_replay_auth_keycloak_admin_password }}"
      - --config
      - "{{ resource_replay_auth_keycloak_config }}"
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ resource_replay_auth_keycloak_hosts }}"
  register: resource_replay_auth_keycloak_authentication
  changed_when: false
  failed_when: >-
    resource_replay_auth_keycloak_authentication.rc != 0 or
    resource_replay_auth_keycloak_authentication.stderr is search('HTTP [45][0-9][0-9]')
  no_log: true

- name: Load explicit Keycloak administration token
  ansible.builtin.slurp:
    src: "{{ resource_replay_auth_keycloak_config }}"
  register: resource_replay_auth_keycloak_session_file
  changed_when: false
  no_log: true

- name: Bind explicit Keycloak administration token
  ansible.builtin.set_fact:
    resource_replay_auth_keycloak_admin_token: >-
      {{ ((resource_replay_auth_keycloak_session_file.content | b64decode | from_json)
          .get('endpoints', {}).get(resource_replay_auth_keycloak_server, {})
          .get(resource_replay_auth_keycloak_admin_realm, {}).get('token', '')) }}
  no_log: true

- name: Require usable Keycloak administration token
  ansible.builtin.assert:
    that:
      - resource_replay_auth_keycloak_admin_token.split('.') | length == 3
    fail_msg: LW_RESOURCE_REPLAY_AUTH_KEYCLOAK_TOKEN_INVALID
  no_log: true

- name: Read active Keycloak replay users
  ansible.builtin.command:
    argv:
      - "{{ resource_replay_auth_kcadm }}"
      - get
      - users
      - --realm
      - "{{ resource_replay_auth_keycloak_realm }}"
      - --fields
      - id,username,enabled
      - --token
      - "{{ resource_replay_auth_keycloak_admin_token }}"
      - --config
      - "{{ resource_replay_auth_keycloak_config }}"
  environment:
    JAVA_OPTS_APPEND: "-Djdk.net.hosts.file={{ resource_replay_auth_keycloak_hosts }}"
  register: resource_replay_auth_keycloak_users
  changed_when: false
  no_log: true

- name: Require exact active Keycloak replay users
  ansible.builtin.assert:
    that:
      - >-
        resource_replay_auth_required_users | difference(
          resource_replay_auth_keycloak_users.stdout | from_json
          | selectattr('enabled') | map(attribute='username') | list) | length == 0
    fail_msg: LW_RESOURCE_REPLAY_AUTH_KEYCLOAK_USERS_INVALID
  no_log: true

- name: Reconcile reviewed Keycloak replay credentials
  ansible.builtin.uri:
    url: >-
      {{ resource_replay_auth_keycloak_server }}/admin/realms/{{ resource_replay_auth_keycloak_realm
      }}/users/{{ item.id }}/reset-password
    method: PUT
    headers:
      Authorization: "Bearer {{ resource_replay_auth_keycloak_admin_token }}"
    body_format: json
    body:
      type: password
      temporary: false
      value: >-
        {{ ((resource_replay_auth_seed.users | selectattr('username', 'equalto', item.username)
            | first).credentials | selectattr('type', 'equalto', 'password') | first).value }}
    ca_path: "{{ resource_replay_auth_keycloak_ca_file }}"
    status_code: 204
    return_content: false
  loop: >-
    {{ resource_replay_auth_keycloak_users.stdout | from_json
      | selectattr('username', 'in', resource_replay_auth_required_users) | list }}
  loop_control:
    label: "{{ item.username }}"
  no_log: true

- name: Create fresh BFF sessions for Resource replay through OIDC
  ansible.builtin.command:
    argv:
      - python3
      - "{{ resource_replay_auth_driver }}"
      - --base-url
      - "{{ resource_replay_auth_base_url }}"
      - --trusted-ca
      - "{{ resource_replay_auth_trusted_ca_file }}"
      - --trusted-ca
      - "{{ resource_replay_auth_keycloak_ca_file }}"
      - --output-root
      - "{{ resource_replay_auth_root }}"
      - --identity-seed
      - "{{ resource_replay_auth_identity_seed_file }}"
  register: resource_replay_auth_result
  failed_when: false
  changed_when: true
  no_log: true

- name: Surface a stable Resource replay authentication diagnostic
  ansible.builtin.assert:
    that: resource_replay_auth_result.rc == 0
    fail_msg: >-
      {{ resource_replay_auth_result.stderr
         | regex_search('LW_[A-Z0-9_]+')
         | default('LW_RESOURCE_REPLAY_AUTH_OIDC_FAILED', true) }}

- name: Verify private Resource replay authentication locator permissions
  ansible.builtin.stat:
    path: "{{ resource_replay_auth_locator }}"
  register: resource_replay_auth_locator_stat

- name: Reject invalid Resource replay authentication locator permissions
  ansible.builtin.assert:
    that:
      - resource_replay_auth_locator_stat.stat.exists
      - resource_replay_auth_locator_stat.stat.pw_name == 'root'
      - resource_replay_auth_locator_stat.stat.gr_name == 'root'
      - resource_replay_auth_locator_stat.stat.mode == '0600'
    fail_msg: LW_RESOURCE_REPLAY_AUTH_OUTPUT_INVALID
