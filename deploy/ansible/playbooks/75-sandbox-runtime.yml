---
# Install the gVisor sandbox runtime shared by every platform one-shot workload
# (Agent authoring attempts, OJ runs and Ansible probes) and publish the
# matching `RuntimeClass`.
#
# Only the two workers carry one-shot sandbox work: `v1-cp-63` is the control
# plane and is tainted `node-role.kubernetes.io/control-plane:NoSchedule`, so a
# Job never lands there. The `RuntimeClass` itself is a cluster-scoped object
# and is published from the control plane, which owns the admin kubeconfig.
- name: Install the gVisor sandbox runtime on sandbox-capable workers
  hosts: workers
  gather_facts: true
  become: true
  roles:
    - role: sandbox_runtime
      when: sandbox_runtime_enabled | bool

- name: Publish the sandbox RuntimeClass
  hosts: control_plane
  gather_facts: false
  become: true
  roles:
    - role: sandbox_runtime
      when: sandbox_runtime_enabled | bool
