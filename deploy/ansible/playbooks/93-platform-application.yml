---
- import_playbook: 00-preflight.yml
  vars:
    labweaver_preflight_scope: platform-application
    # This entrypoint targets an already validated cluster. It verifies the
    # controller API and existing services, but does not re-run node/router/NFS
    # infrastructure qualification or mutate those hosts.
    labweaver_preflight_validate_remote_hosts: false

- name: Reconcile existing services and deploy the application profile
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  roles: [platform_application]
