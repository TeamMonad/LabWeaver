---
- name: Run Sprint 2 foundation preflight
  import_playbook: 00-preflight.yml
  vars:
    labweaver_preflight_scope: sprint2-foundation

- name: Install locked Sprint 2 credential authoring tools
  hosts: routers
  gather_facts: false
  become: true
  roles:
    - role: sprint2_admin_tools
      sprint2_admin_tools_profile: authoring

- name: Install locked Sprint 2 execution tools
  hosts: control_plane
  gather_facts: false
  become: true
  roles:
    - role: sprint2_admin_tools
      sprint2_admin_tools_profile: execution

- name: Reconcile the Sprint 2 data foundation
  hosts: control_plane
  gather_facts: false
  become: true
  roles: [sprint2_foundation]
