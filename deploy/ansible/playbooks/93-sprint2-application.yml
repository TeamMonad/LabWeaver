---
- import_playbook: 00-preflight.yml
  vars:
    labweaver_preflight_scope: >-
      {{ 'single-node-kind' if deployment_profile | default('') == 'single-node-kind'
         else 'sprint2-application' }}
    # This entrypoint adopts an already validated cluster. It verifies the
    # controller API and retained services, but does not re-run node/router/NFS
    # infrastructure qualification or mutate those hosts.
    labweaver_preflight_validate_remote_hosts: false

- name: Adopt existing services and deploy the Sprint 2 application profile
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  roles: [sprint2_application]
