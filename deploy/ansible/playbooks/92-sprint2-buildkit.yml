---
- name: Run Sprint 2 BuildKit preflight
  import_playbook: 00-preflight.yml
  vars:
    labweaver_preflight_scope: sprint2-buildkit

- import_playbook: 91-sprint2-admin-tools.yml

- name: Reconcile the Sprint 2 rootless BuildKit service
  hosts: control_plane
  gather_facts: false
  become: true
  roles: [sprint2_buildkit]
