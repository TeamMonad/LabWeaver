---
- name: Validate local deployment inputs
  hosts: localhost
  connection: local
  gather_facts: false
  roles: [preflight]

- name: Validate router prerequisites
  hosts: routers
  gather_facts: true
  roles:
    - role: preflight
      when: labweaver_preflight_validate_remote_hosts | default(true) | bool

- name: Validate Kubernetes node prerequisites
  hosts: k8s_cluster
  gather_facts: true
  roles:
    - role: preflight
      when: labweaver_preflight_validate_remote_hosts | default(true) | bool

- name: Validate NFS server prerequisites
  hosts: nfs_servers
  gather_facts: true
  roles:
    - role: preflight
      when: labweaver_preflight_validate_remote_hosts | default(true) | bool
