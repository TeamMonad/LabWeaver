[defaults]
inventory = inventories/dev/hosts.yml
roles_path = roles
remote_tmp = /tmp/.ansible-labweaver
library = library
collections_path = collections
interpreter_python = auto_silent
# `yaml` moved out of the ansible-core callback set.  The controller lock pins
# ansible-core, so keep the built-in callback explicit rather than relying on a
# locally installed community callback that the allowlisted xtask process does
# not load.
stdout_callback = default
bin_ansible_callbacks = True
retry_files_enabled = False
host_key_checking = True

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
