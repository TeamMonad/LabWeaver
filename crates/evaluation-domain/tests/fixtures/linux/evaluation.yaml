apiVersion: evaluation.labweaver.io/v1alpha1
kind: EvaluationSpec
metadata:
  name: nginx-service-v1
  version: "1.0.0"
spec:
  submission:
    collector:
      kind: system_facts
      facts:
        - service.nginx.active
        - file./etc/nginx/nginx.conf.sha256
      maxBytes: 4194304
    llmReadable: []
  steps:
    - role: gate
      id: probe-preflight
      runner:
        kind: ansible_probe
        playbookProfile: linux-nginx-probe-v1
        moduleAllowlist:
          - ansible.builtin.service_facts
          - ansible.builtin.stat
        readOnly: true
        assertions:
          - fact: host.reachable
            expected: true
      checker:
        kind: exit_code
        expected: 0
      failurePolicy: stop
    - role: score
      id: nginx-active
      dependsOn: [probe-preflight]
      runner:
        kind: ansible_probe
        playbookProfile: linux-nginx-probe-v1
        moduleAllowlist:
          - ansible.builtin.service_facts
          - ansible.builtin.stat
        readOnly: true
        assertions:
          - fact: service.nginx.active
            expected: true
      checker:
        kind: service_state
        service: nginx
        expected: active
      score:
        max: 20
      failurePolicy: continue
  aggregation:
    kind: deterministic_sum
    maxScore: 20
    gates:
      - step: probe-preflight
        requiredStatus: passed
  review:
    teacherApprovalRequiredForRelease: true
    forceManualWhen:
      - infrastructureError
      - invalidEvidence
