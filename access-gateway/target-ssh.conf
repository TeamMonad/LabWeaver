BatchMode yes
CanonicalizeHostname no
CheckHostIP yes
ConnectTimeout 10
ConnectionAttempts 1
ForwardAgent no
HashKnownHosts yes
IdentitiesOnly yes
IdentityFile /etc/labweaver/secrets/target_key
PasswordAuthentication no
KbdInteractiveAuthentication no
RequestTTY force
StrictHostKeyChecking yes
UserKnownHostsFile /dev/null
KnownHostsCommand /usr/local/bin/labweaver-gateway known-host %H %f %K
