[defaults]
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = ansible.posix.json
collections_path = /opt/labweaver/probe/collections
local_tmp = /work/ansible/tmp
remote_tmp = ~/.ansible/tmp

[ssh_connection]
# Only ssh is shipped. Modules use stdin; any required file transfer uses ssh+dd.
pipelining = True
ssh_transfer_method = piped
ssh_args = -o ControlMaster=no -o ControlPersist=no
