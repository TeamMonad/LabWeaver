pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Optional deployment-owned reverse-proxy locations are mounted here. The
    # image remains usable without them because an unmatched include mask is
    # valid nginx configuration.
    include /etc/nginx/labweaver-conf.d/*.conf;

    location = /health/live {
      access_log off;
      default_type application/json;
      return 200 '{"service":"web","status":"live"}';
    }

    location = /health/ready {
      access_log off;
      default_type application/json;
      try_files /index.html =503;
    }

    # The entry document must be fetched again after each deployment so that
    # it cannot keep referring to an older hashed bundle.  Keep the same
    # policy for the root route, which is the public SPA entry point.
    location = / {
      add_header Cache-Control "no-store" always;
      try_files /index.html =404;
    }

    location = /index.html {
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    # Vite's production assets carry content hashes.  A missing bundle is an
    # actual missing resource, rather than an SPA route that should fall back
    # to index.html.
    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
