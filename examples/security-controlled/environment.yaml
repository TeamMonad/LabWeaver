apiVersion: environment.labweaver.io/v1
kind: EnvironmentSpec
name: offline-auth-remediation-lab
class: experiment
resources:
  cpuMillicores: 500
  memoryBytes: 268435456
  storageBytes: 1073741824
network:
  mode: restricted
  policyBinding: security-lab-restricted-egress-v1
entries:
  - name: public-files
    protocol: http
    servicePort: 8080
security:
  userPolicy: non_root_required
  rootFilesystemPolicy: read_only_required
  privilegeEscalationPolicy: deny
  publicExposurePolicy: deny
  securityProfileBinding: security-lab-container-v1
runtime:
  kind: container
  providerBinding: kubernetes-work-local-hostpath
  buildContext:
    artifactId: 01900000-0000-7000-8000-000000000021
    storeBinding: problem-package-minio-v1
    objectVersion: security-context-v1
    sizeBytes: 1
    mediaType: application/vnd.labweaver.build-context.v1+tar
  servicePort: 8080
  terminal:
    executable: /bin/sh
    args: []
    workingDirectory: /workspace
retention:
  policyId: 01900000-0000-7000-8000-000000000022
  policyRevision: 1
  class: security_audit
  retainUntil: "2036-01-01T00:00:00.000Z"
  disposition: retain_sanitized_receipt
