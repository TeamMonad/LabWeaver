  rootFilesystemPolicy: read_only_required
  privilegeEscalationPolicy: deny
  publicExposurePolicy: deny
  securityProfileBinding: ctf-web-lab-container-v1
runtime:
  kind: container
  provider_binding: kubernetes-work-local-hostpath
  build_context:
    artifactId: 01900000-0000-7000-8000-000000000031
    storeBinding: problem-package-minio-v1
    objectVersion: ctf-web-context-v1
    sizeBytes: 1
    mediaType: application/vnd.labweaver.build-context.v1+tar
  service_port: 8080
retention:
  policyId: 01900000-0000-7000-8000-000000000032
  policyRevision: 1
  class: course_material
  retainUntil: "2036-01-01T00:00:00.000Z"
  disposition: delete
