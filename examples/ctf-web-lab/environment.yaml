apiVersion: environment.labweaver.io/v1
kind: EnvironmentSpec
name: ctf-web-flag-vault-lab
class: experiment
resources:
  cpuMillicores: 500
  memoryBytes: 536870912
  storageBytes: 2147483648
network:
  mode: restricted
  policy_binding: ctf-web-lab-restricted-egress-v1
entries:
  - name: flag-vault
    protocol: http
    servicePort: 8080
security:
