[package]
name = "environment-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
async-nats = { version = "=0.45.0", default-features = false, features = ["ring", "server_2_10", "server_2_11"] }
axum.workspace = true
base64.workspace = true
contracts = { path = "../../crates/contracts" }
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["server", "service", "tokio"] }
futures-util = "0.3.31"
persistence-sqlx = { path = "../../crates/persistence-sqlx" }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
telemetry = { path = "../../crates/telemetry" }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true
uuid.workspace = true
x509-parser = "0.18.1"

[lints]
workspace = true

[dev-dependencies]
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.23.0"
testcontainers = { version = "0.25.0", features = ["blocking", "properties-config"] }
testcontainers-modules = { version = "0.13.0", features = ["postgres"] }
