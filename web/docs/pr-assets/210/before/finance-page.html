<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>before · 预算与费用</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --ink:#1a1c1e; --muted:#5c5f66; --line:#d9dde3; --primary:#3558c7; }
  body { margin:0; font-family: "Noto Sans SC", "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  .page { max-width: 1080px; margin: 24px auto; padding: 0 20px 40px; }
  header h1 { margin:0; font-size:28px; } header p { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:18px; }
  .card h2 { margin:0 0 8px; font-size:20px; } .card p { margin:0; color:var(--muted); font-size:14px; }
  .grid { display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin-top:14px; }
  .kpi { background:#f1f3f7; border-radius:10px; padding:12px; } .kpi span{display:block;color:var(--muted);font-size:12px;} .kpi strong{font-size:18px;}
  .badge { display:inline-block; margin-top:10px; padding:4px 10px; border-radius:999px; background:#e8eaf0; color:var(--muted); font-size:12px; }
  .note { margin-top:18px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>费率、预算与费用</h1>
      <p>全局费率无需选择项目；项目预算和费用须有相应权限。金额用于核算，不代表支付。</p>
    </header>
    <section class="card">
      <h2>项目预算</h2>
      <p>预算和已花费会按当前项目实时更新。无 Credits 账户面板，也无服务端 CREDITS 估价。</p>
      <div class="grid">
        <div class="kpi"><span>预算上限</span><strong>100.000000 USD</strong></div>
        <div class="kpi"><span>提醒阈值</span><strong>80.000000 USD</strong></div>
        <div class="kpi"><span>已花费</span><strong>12.500000 USD</strong></div>
      </div>
      <span class="badge">客户端费率提示 · 无 estimateProjectResourceCost</span>
    </section>
    <section class="card">
      <h2>费用明细</h2>
      <p>历史费用记录。未知用量可能被误解为零。</p>
    </section>
    <p class="note">Before（#252 head，未含 #210 前端）：管理员财务页仅有预算与费用，无 Credits / 服务端估价。</p>
  </div>
</body>
</html>
