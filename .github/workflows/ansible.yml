name: Ansible

on:
  workflow_dispatch:
  pull_request:
    paths: ["deploy/ansible/**", "deploy/versions.lock.yml", "tests/ansible/**", "tools/*.py", "tools/requirements-local-dev.txt", "xtask/**", "Cargo.lock", ".github/workflows/ansible.yml"]
  push:
    branches: [main, develop]
    paths: ["deploy/ansible/**", "deploy/versions.lock.yml", "tests/ansible/**", "tools/*.py", "tools/requirements-local-dev.txt", "xtask/**", "Cargo.lock", ".github/workflows/ansible.yml"]

permissions:
  contents: read

jobs:
  ansible-gate:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/deploy/ansible/ansible.cfg
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/deploy/ansible/roles
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install pinned controller dependencies
        run: python -m pip install ansible-core==2.18.6 ansible-lint==25.6.1
      - name: Install local development test dependencies
        run: python -m pip install -r tools/requirements-local-dev.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the shared Rust Bundle configuration validator
        run: cargo build -p xtask --locked
      - name: Install the pinned Helm renderer used by Platform Images
        run: |
          mkdir -p "$RUNNER_TEMP/bundle-tools"
          docker run --rm --entrypoint /bin/sh docker.io/alpine/helm:3.21.3@sha256:35da09ba0716fc7c3cd63b6b31ee380a9c7662e95f29ab0e4ae962420afd315b -c 'cat /usr/bin/helm' > "$RUNNER_TEMP/bundle-tools/helm"
          chmod 0755 "$RUNNER_TEMP/bundle-tools/helm"
          echo "$RUNNER_TEMP/bundle-tools" >> "$GITHUB_PATH"
      - name: Install pinned age for encrypted Bundle lifecycle tests
        run: |
          curl --fail --location --retry 3 -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/age.tar.gz' | sha256sum --check
          tar -xzf /tmp/age.tar.gz -C /tmp age/age age/age-keygen
          mkdir -p "$RUNNER_TEMP/bundle-tools"
          cp /tmp/age/age /tmp/age/age-keygen "$RUNNER_TEMP/bundle-tools/"
          echo "$RUNNER_TEMP/bundle-tools" >> "$GITHUB_PATH"
      - name: Install pinned collections
        run: ansible-galaxy collection install -p .ansible/collections -r deploy/ansible/requirements.yml
      - name: Lint roles and playbooks
        run: ansible-lint deploy/ansible/playbooks deploy/ansible/roles
      - name: Check playbook syntax
        run: |
          cp deploy/ansible/inventories/dev/hosts.yml.example /tmp/labweaver-hosts.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/site.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/95-harbor.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/90-verify.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/91-platform-admin-tools.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/91-identity-foundation.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/92-identity-foundation-verify.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/92-platform-foundation.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/92-platform-buildkit.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/92-platform-harbor-route.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/93-platform-application.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/94-resource-application.yml
          ansible-playbook --syntax-check -i /tmp/labweaver-hosts.yml deploy/ansible/playbooks/94-platform-clean-redeploy.yml
      - name: Run fictional Vault and storage-safety fixtures
        run: python -m unittest discover -s tests/ansible
