name: playwright-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  playwright-gate:
    runs-on: ubuntu-latest
    outputs:
      playwright_changed: ${{ steps.changes.outputs.playwright_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Playwright changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            comparison_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            changed_files="$(git diff --name-only "$comparison_base" "$HEAD_SHA")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            comparison_base="$(git rev-parse "$AFTER_SHA^" 2>/dev/null || true)"
            if [[ -n "$comparison_base" ]]; then
              changed_files="$(git diff --name-only "$comparison_base" "$AFTER_SHA")"
            else
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$AFTER_SHA")"
            fi
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/playwright-ci\.yml|\.gitignore|web/package\.json|web/pnpm-lock\.yaml|web/playwright\.config\.mjs|web/e2e/|web/scripts/(e2e-gate|fixed-sleep-check|run-e2e|verify-config)\.mjs$)'; then
            echo "playwright_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "playwright_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Playwright gate not applicable
        if: steps.changes.outputs.playwright_changed != 'true'
        shell: bash
        run: |
          echo "playwright-gate: not applicable; no Playwright configuration files changed."

      - name: Setup Node.js
        if: steps.changes.outputs.playwright_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Setup pnpm
        if: steps.changes.outputs.playwright_changed == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        if: steps.changes.outputs.playwright_changed == 'true'
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Run aggregate E1 Playwright gate without browsers
        if: steps.changes.outputs.playwright_changed == 'true'
        working-directory: ./web
        run: pnpm test:e2e:gate

      - name: Upload Playwright configuration report
        if: always() && steps.changes.outputs.playwright_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-role-config-report
          path: web/artifacts/playwright/playwright-role-config-report.json
          if-no-files-found: warn

  playwright-fixture-runtime:
    needs: playwright-gate
    runs-on: ubuntu-latest
    if: needs.playwright-gate.outputs.playwright_changed == 'true'
    # Run inside the exact Playwright image used to generate the Linux visual
    # baselines so Chromium version and system fonts match; installing a
    # separate Chromium on ubuntu-latest produces different anti-aliasing and
    # fails every screenshot comparison.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust workspace git for evidence identity
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Enable corepack pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Run fixture browser matrix
        working-directory: ./web
        run: pnpm test:e2e:fixture
        env:
          VITE_DATA_MODE: fixture
          LABWEAVER_DATA_MODE: fixture
          LABWEAVER_BASE_URL: http://localhost:4173

      - name: Upload fixture Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fixture-report
          path: |
            web/playwright-report-fixture/
            web/test-results/fixture/
          if-no-files-found: warn

      - name: Upload fixture screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fixture-evidence
          path: |
            web/e2e/tests/shell.visual.spec.mjs-snapshots/fixture/
            web/test-results/fixture/**/*.png
            web/test-results/fixture/**/*.webm
            web/test-results/fixture/**/*.zip
          if-no-files-found: warn
