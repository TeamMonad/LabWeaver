name: playwright-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Check Playwright configuration
        working-directory: ./web
        run: pnpm test:e2e:verify

      - name: Run Playwright contract tests
        working-directory: ./web
        run: pnpm test:e2e:contract

      - name: List Playwright tests
        working-directory: ./web
        run: pnpm test:e2e:list
