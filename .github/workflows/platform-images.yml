name: Platform Images

on:
  pull_request:
    branches: [develop]
    paths:
      - access-gateway/**
      - containers/**
      - crates/**
      - services/**
      - Cargo.toml
      - Cargo.lock
      - deploy/helm/**
      - deploy/versions.lock.yml
      - schemas/results/platform-image-*.json
      - tests/fixtures/platform-image-*
      - xtask/**
      - .github/workflows/platform-images.yml
  push:
    branches: [develop]
    paths:
      - access-gateway/**
      - containers/**
      - crates/**
      - services/**
      - Cargo.toml
      - Cargo.lock
      - deploy/helm/**
      - deploy/versions.lock.yml
      - schemas/results/platform-image-*.json
      - tests/fixtures/platform-image-*
      - xtask/**
      - .github/workflows/platform-images.yml

permissions:
  contents: read

concurrency:
  group: platform-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo xtask package-validate --manifest tests/fixtures/platform-image-package-manifest.json --mode static
      - run: cargo test -p xtask --locked platform_images
      - name: Render Sprint 2 chart
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            docker.io/alpine/helm:3.21.3@sha256:35da09ba0716fc7c3cd63b6b31ee380a9c7662e95f29ab0e4ae962420afd315b \
            template labweaver deploy/helm/labweaver --namespace labweaver-system \
            --set-string deploymentIdentity.configurationBundleSha256=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --values tests/fixtures/platform-images-values.yaml >"$RUNNER_TEMP/platform-images.yaml"
          if grep -E 'image: .*:(latest|main|develop)([[:space:]]|$)' "$RUNNER_TEMP/platform-images.yaml"; then
            echo LW_PACKAGE_HELM_MUTABLE_IMAGE_FORBIDDEN >&2
            exit 1
          fi
          if docker run --rm -v "$PWD:/workspace" -w /workspace \
            docker.io/alpine/helm:3.21.3@sha256:35da09ba0716fc7c3cd63b6b31ee380a9c7662e95f29ab0e4ae962420afd315b \
            template labweaver deploy/helm/labweaver --namespace labweaver-system \
            --values tests/fixtures/platform-images-values.yaml \
            --set-string deploymentIdentity.configurationBundleSha256=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-json 'network.kubernetesApiCidrs=[]' >/dev/null 2>&1; then
            echo LW_PACKAGE_HELM_API_CIDR_FAIL_CLOSED_MISSING >&2
            exit 1
          fi

  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - access-service
          - agent-service
          - ansible-probe-runner
          - control-service
          - environment-service
          - evaluation-runtime
          - evaluation-service
          - oj-cpp17-runner
          - openssh-gateway
          - resource-service
          - web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a
      - name: Build reproducible runtime image
        env:
          COMPONENT: ${{ matrix.component }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          file=containers/Containerfile.rust
          service_args=(--build-arg "SERVICE=$COMPONENT" --target runtime)
          if [[ "$COMPONENT" == web ]]; then
            file=containers/Containerfile.web
            service_args=()
          elif [[ "$COMPONENT" == ansible-probe-runner ]]; then
            file=containers/Containerfile.ansible-probe
            service_args=(--target runtime)
          elif [[ "$COMPONENT" == evaluation-runtime ]]; then
            file=containers/Containerfile.ansible-probe
            service_args=(--target evaluation-runtime)
          elif [[ "$COMPONENT" == oj-cpp17-runner ]]; then
            file=containers/Containerfile.oj-cpp17
            service_args=()
          elif [[ "$COMPONENT" == openssh-gateway ]]; then
            file=access-gateway/Dockerfile
            service_args=()
          elif [[ "$COMPONENT" == agent-service ]]; then
            claude_code_version="$(awk '$1 == "claude_code:" { print $2 }' deploy/versions.lock.yml)"
            claude_code_sha512="$(awk '$1 == "claude_code_linux_x64_sha512:" { print $2 }' deploy/versions.lock.yml)"
            test -n "$claude_code_version" && test -n "$claude_code_sha512"
            service_args=(
              --build-arg "SERVICE=$COMPONENT"
              --build-arg "CLAUDE_CODE_VERSION=$claude_code_version"
              --build-arg "CLAUDE_CODE_LINUX_X64_SHA512=$claude_code_sha512"
              --target agent-runtime
            )
          fi
          docker buildx build --file "$file" --platform linux/amd64 \
            --build-arg "SOURCE_COMMIT=$source_commit" \
            --build-arg "SOURCE_DATE_EPOCH=$source_date_epoch" \
            "${service_args[@]}" --provenance=false \
            --output "type=oci,dest=$RUNNER_TEMP/$COMPONENT.tar,rewrite-timestamp=true,oci-mediatypes=true" .
