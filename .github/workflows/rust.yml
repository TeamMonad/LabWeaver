name: Rust

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-persistence:
    name: postgres-persistence-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p persistence-sqlx --all-targets --all-features -- -D warnings
      - run: cargo test -p persistence-sqlx --locked
  rust:
    name: rust-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Web contract dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo xtask contracts check
      - name: Compile generated TypeScript contracts
        working-directory: ./web
        run: pnpm typecheck
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
