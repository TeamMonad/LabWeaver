name: Rust

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: ci-scope
    runs-on: ubuntu-latest
    outputs:
      rust_required: ${{ steps.scope.outputs.rust_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI scope selection
        run: python3 -m unittest discover -s tests/ci
      - name: Select affected checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 tools/ci_scope.py >> "$GITHUB_OUTPUT"
      - name: Describe selection
        env:
          RUST_REQUIRED: ${{ steps.scope.outputs.rust_required }}
          SCOPE_REASON: ${{ steps.scope.outputs.scope_reason }}
        run: echo "Rust required=$RUST_REQUIRED reason=$SCOPE_REASON"
  postgres-persistence:
    name: postgres-persistence-gate
    needs: scope
    if: needs.scope.outputs.rust_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p persistence-sqlx --all-targets --all-features -- -D warnings
      - run: cargo test -p persistence-sqlx --locked
  rust:
    name: rust-gate
    needs: scope
    if: needs.scope.outputs.rust_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Web contract dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile
      - name: Install pinned age for synthetic Bundle HTTP and persistence tests
        run: |
          curl --fail --location --retry 3 -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/age.tar.gz' | sha256sum --check
          tar -xzf /tmp/age.tar.gz -C /tmp age/age age/age-keygen
          echo /tmp/age >> "$GITHUB_PATH"
          echo 'AGE=/tmp/age/age' >> "$GITHUB_ENV"
          echo 'AGE_KEYGEN=/tmp/age/age-keygen' >> "$GITHUB_ENV"
      - name: Prepare the pinned MinIO integration-test image
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_minio_test_image.py
          source_commit="$(awk '$1 == "source_commit:" { print $2; exit }' deploy/versions.lock.yml)"
          test "${#source_commit}" -eq 40
          echo "LABWEAVER_TEST_MINIO_IMAGE=labweaver/minio-test:${source_commit:0:12}" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo xtask contracts check
      - name: Compile generated TypeScript contracts
        working-directory: ./web
        run: pnpm typecheck
      - run: cargo build --workspace --locked
      - name: Run Agent retry PostgreSQL regression
        run: cargo test -p agent-service --test claude_code_runtime postgres_authoring_retry_starts_a_new_fenced_attempt --locked -- --ignored
      - run: cargo test --workspace --locked --no-fail-fast
  rust-merge-gate:
    name: rust-merge-gate
    if: always()
    needs: [scope, postgres-persistence, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Require a completed Rust decision
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_REQUIRED: ${{ needs.scope.outputs.rust_required }}
          POSTGRES_RESULT: ${{ needs.postgres-persistence.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "ci-scope result=$SCOPE_RESULT; refusing a skipped Rust decision" >&2
            exit 1
          fi
          case "$RUST_REQUIRED" in
            true)
              [[ "$POSTGRES_RESULT" == success ]] || {
                echo "postgres-persistence-gate result=$POSTGRES_RESULT" >&2
                exit 1
              }
              [[ "$RUST_RESULT" == success ]] || {
                echo "rust-gate result=$RUST_RESULT" >&2
                exit 1
              }
              ;;
            false)
              [[ "$POSTGRES_RESULT" == skipped && "$RUST_RESULT" == skipped ]] || {
                echo "Rust gates must be skipped only when scope selects no Rust checks" >&2
                exit 1
              }
              ;;
            *)
              echo "ci-scope produced no valid rust_required output: $RUST_REQUIRED" >&2
              exit 1
              ;;
          esac
