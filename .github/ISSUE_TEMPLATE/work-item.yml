name: Work item
description: Describe a product or engineering change.
title: "[ID] "
body:
  - type: textarea
    id: value
    attributes:
      label: User value
      description: State the observable user or operator outcome.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Name the owner boundary and explicitly excluded work.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe the success and failure behavior that users can observe.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Include dependencies, blockers, and operational risks.
    validations:
      required: false
